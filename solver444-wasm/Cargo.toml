[package]
name = "solver444-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "4x4x4 cube state, validation, and solver boundary for cubetimer"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
