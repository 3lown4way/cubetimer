name: Apply human Yau first 3 cross edges

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-yau-human-cross3.yml"
      - "tools/apply-yau-human-cross3.py"
      - "tools/refine-yau-human-cross3.py"
      - "tools/finalize-yau-human-cross3.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply human Yau Cross 3 patch
        run: |
          python tools/apply-yau-human-cross3.py
          python tools/refine-yau-human-cross3.py
          python tools/finalize-yau-human-cross3.py

      - name: Syntax check
        run: |
          node --check solver/edgePairing444.js
          node --check solver/solver444.js
          node --check tools/verify-444-yau.mjs

      - name: Verify targeted Yau behavior
        run: |
          node tools/verify-444-yau.mjs
          node tools/verify-444-edge-323.mjs
          node tools/verify-444-public-notation.mjs
          git diff --check

      - name: Commit implementation
        run: |
          rm -f tools/apply-yau-human-cross3.py tools/refine-yau-human-cross3.py tools/finalize-yau-human-cross3.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solver/edgePairing444.js solver/solver444.js tools/verify-444-yau.mjs tools/apply-yau-human-cross3.py tools/refine-yau-human-cross3.py tools/finalize-yau-human-cross3.py
          git commit -m "Make Yau first three cross edges human-style"
          git push origin HEAD:main
