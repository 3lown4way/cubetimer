name: Fix minmove HTM fallback

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-minmove-htm
          fetch-depth: 0

      - name: Patch minmove fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('solver/solverWorker.js')
          text = path.read_text()

          if 'phase_fallback_bundle_unavailable' not in text:
            function_start = text.index('async function solveWithInternal3x3Minmove(scramble, onProgress) {')
            insertion_point = text.index('\n\n  let incumbentSolution', function_start)
            insertion = '''

  const minmoveReady = await ensureMinmove333ReadyLazy().catch(() => null);
  if (!minmoveReady) {
    if (typeof onProgress === "function") {
      try {
        void onProgress({
          type: "exact_search_fallback",
          reason: "bundle_unavailable",
        });
      } catch (_) {}
    }
    const phaseFallback = await solveWithInternal3x3TwoPhase(scramble, onProgress);
    if (!phaseFallback?.ok) {
      return {
        ok: false,
        reason: phaseFallback?.reason || "MINMOVE_BUNDLE_UNAVAILABLE",
      };
    }
    return {
      ...phaseFallback,
      source: "MINMOVE_333_BUNDLE_UNAVAILABLE_FALLBACK",
      metric: "HTM",
      optimalityProven: false,
      proofSource: "phase_fallback_bundle_unavailable",
      fallbackReason: "MINMOVE_BUNDLE_UNAVAILABLE",
    };
  }'''
            text = text[:insertion_point] + insertion + text[insertion_point:]

            redundant = '''  const ready = await ensureMinmove333ReadyLazy();
  if (!ready) {
    return { ok: false, reason: "MINMOVE_UNAVAILABLE" };
  }

'''
            if redundant not in text:
              raise SystemExit('redundant minmove readiness block not found')
            text = text.replace(redundant, '', 1)
            path.write_text(text)
          else:
            print('source patch already present')
          PY

      - name: Syntax check
        run: node --check solver/solverWorker.js

      - name: Verify two-phase fallback backend
        run: |
          cat > .tmp-minmove-fallback.mjs <<'EOF'
          import {
            ensureMinmove333Ready,
            ensureTwophase333Ready,
            prepareTwophase333,
            searchTwophase333,
            dropTwophase333Search,
          } from './solver/wasmSolver.js';
          import { cube3x3x3 } from './vendor/cubing/puzzles/index.js';

          const minmove = await ensureMinmove333Ready();
          console.log(minmove ? 'exact minmove bundle available' : 'exact minmove bundle unavailable');

          const twophase = await ensureTwophase333Ready();
          if (!twophase) throw new Error('TWOPHASE_BACKEND_UNAVAILABLE');

          const scramble = "R U R' U'";
          const prepared = await prepareTwophase333(scramble, {
            maxPhase1Solutions: 12,
            phase1MaxDepth: 13,
          });
          if (!prepared?.ok || !Number.isFinite(prepared.searchId)) {
            throw new Error(`TWOPHASE_PREPARE_FAILED: ${JSON.stringify(prepared)}`);
          }

          let searched;
          try {
            searched = await searchTwophase333(prepared.searchId, {
              phase2MaxDepth: 20,
              phase2NodeLimit: 2000000,
            });
          } finally {
            await dropTwophase333Search(prepared.searchId);
          }
          if (!searched?.ok || !searched.solution) {
            throw new Error(`TWOPHASE_SEARCH_FAILED: ${JSON.stringify(searched)}`);
          }

          const kpuzzle = await cube3x3x3.kpuzzle();
          const after = kpuzzle.defaultPattern().applyAlg(scramble).applyAlg(searched.solution);
          if (!after.experimentalIsSolved({ ignorePuzzleOrientation: false })) {
            throw new Error(`FALLBACK_SOLUTION_INVALID: ${searched.solution}`);
          }
          console.log(`fallback ok: ${searched.solution} (${searched.moveCount} HTM)`);
          EOF
          node .tmp-minmove-fallback.mjs
          rm .tmp-minmove-fallback.mjs

      - name: Static regression assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          worker = Path('solver/solverWorker.js').read_text()
          assert 'phase_fallback_bundle_unavailable' in worker
          assert 'MINMOVE_333_BUNDLE_UNAVAILABLE_FALLBACK' in worker
          assert 'return { ok: false, reason: "MINMOVE_UNAVAILABLE" };' not in worker
          print('minmove fallback assertions passed')
          PY

      - name: Commit validated repair and clean temporary workflows
        run: |
          git checkout origin/main -- .github/workflows/cfop-speedup-benchmark.yml
          rm -f .github/workflows/fix-minmove-htm.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix minmove HTM when bundle is unavailable"
          git push origin HEAD:agent/fix-minmove-htm
