name: FMC human breakdown output validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/apply-fmc-human-breakdown-output.py'
      - '.github/workflows/fmc-human-breakdown-output.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply breakdown implementation
        run: |
          sed -i 's/constructor_count < 8/constructor_count < 4/' tools/apply-fmc-human-breakdown-output.py
          python3 tools/apply-fmc-human-breakdown-output.py

      - name: Format and test Rust
        run: |
          cargo fmt --manifest-path solver-wasm/Cargo.toml
          cargo test --release --manifest-path solver-wasm/Cargo.toml

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build release WASM
        run: wasm-pack build solver-wasm --release --target web --out-dir ../public/solver-wasm

      - name: JavaScript syntax checks
        run: |
          node --check solver/fmcSolver.js
          node --check main.js

      - name: Validate known human breakdown
        run: |
          node --input-type=module <<'NODE'
          import { buildFmcTablesWasm, verifyFmcSolutionWasm } from './solver/wasmSolver.js';
          import { solveWithFMCSearch } from './solver/fmcSolver.js';

          const scramble = "U R2 U' R B D R B' R' B2 U' F' D' R F' L' B L2 F R D";
          if (!(await buildFmcTablesWasm())) throw new Error('FMC_TABLE_BUILD_FAILED');
          const result = await solveWithFMCSearch(scramble, null, {
            qualityMode: 'extreme',
            targetMoveCount: 20,
            timeBudgetMs: 12000,
            maxPremoveSets: 180,
            extremeVariantCount: 4,
            continueBelowTarget: true,
            enableInsertions: true,
            preferNonCfop: true,
          });
          if (result?.ok !== false || result?.reason !== 'FMC_HUMAN_TARGET_NOT_REACHED') {
            throw new Error(`EXPECTED_TARGET_MISS:${JSON.stringify(result)}`);
          }
          const solution = result.bestHumanSolution;
          const check = await verifyFmcSolutionWasm(scramble, solution);
          if (!check?.ok || check.solved !== true) throw new Error('BEST_HUMAN_SOLUTION_INVALID');
          const stages = result.bestHumanStages || [];
          const byName = new Map(stages.map((stage) => [stage.name, stage]));
          for (const name of ['NISS 탐색', 'EO', 'DR', 'P2 / Skeleton 진행', 'Skeleton', 'Leave', 'Insertion 1', 'Cancellation', 'Final']) {
            if (!byName.has(name)) throw new Error(`MISSING_STAGE:${name}:${JSON.stringify(stages)}`);
          }
          const skeleton = byName.get('Skeleton');
          const insertion = byName.get('Insertion 1');
          const cancellation = byName.get('Cancellation');
          const final = byName.get('Final');
          if (skeleton.moveCount !== 27) throw new Error(`SKELETON_COUNT:${JSON.stringify(skeleton)}`);
          if (insertion.moveCount !== 8) throw new Error(`INSERTION_COUNT:${JSON.stringify(insertion)}`);
          if (!String(cancellation.notes).includes('35 → 21 (-14)')) {
            throw new Error(`CANCELLATION_COUNT:${JSON.stringify(cancellation)}`);
          }
          if (final.moveCount !== 21) throw new Error(`FINAL_COUNT:${JSON.stringify(final)}`);
          if (!byName.get('EO').solution || !byName.get('DR').solution) {
            throw new Error(`PHASE_MOVES_NOT_PRESERVED:${JSON.stringify(stages)}`);
          }
          console.log('FMC_BREAKDOWN_RESULT=' + JSON.stringify({ solution, stages }));
          NODE

      - name: Commit production implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982982+github-actions[bot]@users.noreply.github.com"
          git add solver-wasm/src/fmc_search.rs solver/fmcSolver.js main.js public/solver-wasm/solver_wasm_bg.wasm
          git rm -f .github/workflows/fmc-human-breakdown-output.yml .github/workflows/fmc-breakdown-snippets.yml tools/apply-fmc-human-breakdown-output.py
          git commit -m "Show human FMC phase and insertion breakdowns"
          git push origin HEAD:${{ github.head_ref }}
