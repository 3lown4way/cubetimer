name: Apply FMC insertion hash optimization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/fmc-core-speed-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fmc-core-speed-v1
          fetch-depth: 0

      - name: Capture current insertion output and timing
        env:
          FMC_INSERTION_REPEATS: '6'
        run: node benchmark-fmc-insertion-speed-identity.mjs --out /tmp/insertion-baseline.json

      - name: Apply single-lookup insertion transform
        run: |
          python3 tools/apply-fmc-insertion-entry-speed.py
          cargo fmt --manifest-path solver-wasm/Cargo.toml
          cargo check --release --manifest-path solver-wasm/Cargo.toml

      - name: Install wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          wasm-pack --version

      - name: Build optimized WASM
        run: |
          rm -rf solver-wasm/.wasm-pack-out
          cd solver-wasm
          wasm-pack build --release --target web --out-dir .wasm-pack-out
          cp .wasm-pack-out/solver_wasm.js ../public/solver-wasm/solver_wasm.js
          cp .wasm-pack-out/solver_wasm_bg.wasm ../public/solver-wasm/solver_wasm_bg.wasm
          cp .wasm-pack-out/solver_wasm.d.ts ../public/solver-wasm/solver_wasm.d.ts
          cp .wasm-pack-out/solver_wasm_bg.wasm.d.ts ../public/solver-wasm/solver_wasm_bg.wasm.d.ts

      - name: Capture optimized insertion output and timing
        env:
          FMC_INSERTION_REPEATS: '6'
        run: node benchmark-fmc-insertion-speed-identity.mjs --out /tmp/insertion-optimized.json

      - name: Require identical insertion results and measurable gain
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const baseline = JSON.parse(fs.readFileSync('/tmp/insertion-baseline.json', 'utf8'));
          const optimized = JSON.parse(fs.readFileSync('/tmp/insertion-optimized.json', 'utf8'));
          if (baseline.rows.length !== optimized.rows.length) throw new Error('row count changed');
          for (let i = 0; i < baseline.rows.length; i += 1) {
            for (const field of ['repeat', 'index', 'scramble', 'inputSolution', 'solution', 'moveCount']) {
              if (baseline.rows[i][field] !== optimized.rows[i][field]) {
                throw new Error(`insertion output changed at row ${i}, ${field}`);
              }
            }
          }
          const ratio = optimized.summary.averageMs / baseline.summary.averageMs;
          console.log(JSON.stringify({ baseline: baseline.summary, optimized: optimized.summary, insertionSpeedup: 1 / ratio }));
          if (!(ratio < 0.995)) throw new Error(`insertion gain below 0.5%: ratio=${ratio}`);
          NODE

      - name: Verify full FMC portfolio after insertion change
        env:
          FMC_SPEED_RUNS: '12'
          FMC_SPEED_PREMOVE_SETS: '80'
          FMC_SPEED_INSERTION_RUNS: '6'
        run: node benchmark-fmc-speed-identity.mjs --out /tmp/fmc-regression.json

      - name: Commit optimized source and WASM
        run: |
          rm -rf solver-wasm/.wasm-pack-out
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solver-wasm/src/fmc_insertion.rs \
            public/solver-wasm/solver_wasm.js \
            public/solver-wasm/solver_wasm_bg.wasm \
            public/solver-wasm/solver_wasm.d.ts \
            public/solver-wasm/solver_wasm_bg.wasm.d.ts
          git commit -m "Avoid duplicate insertion hash lookups"
          git push origin HEAD:agent/fmc-core-speed-v1
