name: Apply FMC core speed optimization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/fmc-core-speed-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fmc-core-speed-v1
          fetch-depth: 0

      - name: Capture baseline FMC output and timing
        env:
          FMC_SPEED_RUNS: '12'
          FMC_SPEED_PREMOVE_SETS: '80'
          FMC_SPEED_INSERTION_RUNS: '4'
        run: node benchmark-fmc-speed-identity.mjs --out /tmp/fmc-baseline.json

      - name: Apply FMC core transform
        run: |
          python3 tools/apply-fmc-core-speed.py
          cargo fmt --manifest-path solver-wasm/Cargo.toml
          cargo check --release --manifest-path solver-wasm/Cargo.toml

      - name: Install wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          wasm-pack --version

      - name: Build optimized WASM
        run: |
          rm -rf solver-wasm/.wasm-pack-out
          cd solver-wasm
          wasm-pack build --release --target web --out-dir .wasm-pack-out
          cp .wasm-pack-out/solver_wasm.js ../public/solver-wasm/solver_wasm.js
          cp .wasm-pack-out/solver_wasm_bg.wasm ../public/solver-wasm/solver_wasm_bg.wasm
          cp .wasm-pack-out/solver_wasm.d.ts ../public/solver-wasm/solver_wasm.d.ts
          cp .wasm-pack-out/solver_wasm_bg.wasm.d.ts ../public/solver-wasm/solver_wasm_bg.wasm.d.ts

      - name: Capture optimized FMC output and timing
        env:
          FMC_SPEED_RUNS: '12'
          FMC_SPEED_PREMOVE_SETS: '80'
          FMC_SPEED_INSERTION_RUNS: '4'
        run: node benchmark-fmc-speed-identity.mjs --out /tmp/fmc-optimized.json

      - name: Require identical candidates and faster solve
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const baseline = JSON.parse(fs.readFileSync('/tmp/fmc-baseline.json', 'utf8'));
          const optimized = JSON.parse(fs.readFileSync('/tmp/fmc-optimized.json', 'utf8'));
          if (baseline.rows.length !== optimized.rows.length) {
            throw new Error(`row count changed: ${baseline.rows.length} -> ${optimized.rows.length}`);
          }
          const scalarFields = ['scramble', 'solution', 'moveCount'];
          for (let i = 0; i < baseline.rows.length; i += 1) {
            for (const field of scalarFields) {
              if (baseline.rows[i][field] !== optimized.rows[i][field]) {
                throw new Error(`FMC output changed at row ${i}, ${field}`);
              }
            }
            if (JSON.stringify(baseline.rows[i].candidates) !== JSON.stringify(optimized.rows[i].candidates)) {
              throw new Error(`FMC candidate portfolio changed at row ${i}`);
            }
            if (JSON.stringify(baseline.rows[i].insertion) !== JSON.stringify(optimized.rows[i].insertion)) {
              throw new Error(`FMC insertion output changed at row ${i}`);
            }
          }
          const ratio = optimized.summary.averageSolveMs / baseline.summary.averageSolveMs;
          console.log(JSON.stringify({
            baseline: baseline.summary,
            optimized: optimized.summary,
            solveSpeedup: 1 / ratio,
          }));
          if (!(ratio < 0.99)) {
            throw new Error(`FMC solve gain below 1%: ratio=${ratio}`);
          }
          NODE

      - name: Commit optimized source and WASM
        run: |
          rm -rf solver-wasm/.wasm-pack-out
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solver-wasm/src/fmc_search.rs \
            public/solver-wasm/solver_wasm.js \
            public/solver-wasm/solver_wasm_bg.wasm \
            public/solver-wasm/solver_wasm.d.ts \
            public/solver-wasm/solver_wasm_bg.wasm.d.ts
          git commit -m "Speed up FMC premove state construction"
          git push origin HEAD:agent/fmc-core-speed-v1
