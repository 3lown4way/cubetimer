name: FMC WR16 continuation push driver

on:
  push:
    branches:
      - agent/fmc-extreme-independent-frontier-v2

permissions:
  contents: write

jobs:
  drive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fmc-extreme-independent-frontier-v2
          fetch-depth: 0
      - name: Remove driver and run diagnostic body
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fmc-wr16-continuation-push-driver.yml
          git commit -m "Remove temporary WR16 continuation push driver"
          git push origin HEAD:agent/fmc-extreme-independent-frontier-v2
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import os
          import subprocess
          import yaml

          workflow = yaml.safe_load(open('.github/workflows/fmc-wr16-continuation-diagnostic.yml'))
          step = next(
              step for step in workflow['jobs']['diagnose']['steps']
              if step.get('name') == 'Inject and run exact continuation diagnostic'
          )
          subprocess.run(
              step['run'],
              shell=True,
              executable='/bin/bash',
              check=True,
              env=os.environ.copy(),
          )
          PY
