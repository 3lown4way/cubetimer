name: Verify Yau center preservation once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-yau-center-preservation-once.yml"
      - "tools/verify-yau-center-preservation.mjs"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/verify-yau-center-preservation.mjs
