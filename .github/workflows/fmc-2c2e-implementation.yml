name: FMC 2C2E implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/fmc-2c2e-insertion

      - name: Apply production transforms
        run: |
          python tools/apply-fmc-2c2e.py
          python tools/apply-fmc-2c2e-beam.py
          cargo fmt --manifest-path solver-wasm/Cargo.toml

      - name: Run Rust validation
        run: cargo test --manifest-path solver-wasm/Cargo.toml --release

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build release WASM
        run: |
          cd solver-wasm
          wasm-pack build --target web --release --out-dir ../public/solver-wasm

      - name: Compare stage 2 and stage 3 FMC outputs
        run: |
          git fetch origin main
          git worktree add /tmp/fmc-main origin/main
          cat > /tmp/benchmark-fmc-2c2e.mjs <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          import { performance } from 'node:perf_hooks';

          async function load(root) {
            const dir = `${root}/public/solver-wasm`;
            const mod = await import(pathToFileURL(`${dir}/solver_wasm.js`).href);
            await mod.default(fs.readFileSync(`${dir}/solver_wasm_bg.wasm`));
            mod.load_twophase_333_bundle(fs.readFileSync(`${dir}/twophase/twophase-333-v1.bin`));
            const start = performance.now();
            const built = JSON.parse(mod.build_fmc_tables_wasm());
            const buildMs = performance.now() - start;
            if (!built.ok) throw new Error(`FMC table build failed: ${JSON.stringify(built)}`);
            return {mod, built, buildMs};
          }

          function makeScrambles(count) {
            let x = 0x45d9f3b;
            const faces = ['U', 'R', 'F', 'D', 'L', 'B'];
            const suffixes = ['', "'", '2'];
            const opposite = [3, 4, 5, 0, 1, 2];
            const next = () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return x >>>= 0; };
            const result = [];
            for (let sample = 0; sample < count; sample++) {
              const moves = [];
              let last = -1;
              for (let index = 0; index < 21; index++) {
                let face;
                do face = next() % 6;
                while (face === last || (last >= 0 && face === opposite[last] && face < last));
                moves.push(faces[face] + suffixes[next() % 3]);
                last = face;
              }
              result.push(moves.join(' '));
            }
            return result;
          }

          const baseline = await load('/tmp/fmc-main');
          const current = await load(process.cwd());
          const mixedCount = current.built.twoCornerTwoEdgeAlgorithmCount ?? 0;
          if (mixedCount < 64) throw new Error(`2C2E library coverage too small: ${mixedCount}`);
          if (current.built.threeCycleAlgorithmCount !== baseline.built.threeCycleAlgorithmCount) {
            throw new Error('3-cycle library coverage changed');
          }

          const options = JSON.stringify({maxPremoveSets: 24, forceRzp: false});
          const oldTimes = [];
          const newTimes = [];
          let mixedSkeletons = 0;
          let mixedInsertions = 0;
          let improved = 0;

          for (const [index, scramble] of makeScrambles(16).entries()) {
            let oldResult;
            let newResult;
            if (index % 2 === 0) {
              let start = performance.now();
              oldResult = JSON.parse(baseline.mod.solve_fmc_wasm(scramble, options));
              oldTimes.push(performance.now() - start);
              start = performance.now();
              newResult = JSON.parse(current.mod.solve_fmc_wasm(scramble, options));
              newTimes.push(performance.now() - start);
            } else {
              let start = performance.now();
              newResult = JSON.parse(current.mod.solve_fmc_wasm(scramble, options));
              newTimes.push(performance.now() - start);
              start = performance.now();
              oldResult = JSON.parse(baseline.mod.solve_fmc_wasm(scramble, options));
              oldTimes.push(performance.now() - start);
            }
            if (!oldResult.ok || !newResult.ok) throw new Error(`solve failed at ${index}`);
            if (newResult.moveCount > oldResult.moveCount) {
              throw new Error(`move regression at ${index}: ${oldResult.moveCount} -> ${newResult.moveCount}`);
            }
            if (newResult.moveCount < oldResult.moveCount) improved++;
            mixedSkeletons += newResult.skeletons.filter(s => s.kind === 'corner2edge2').length;
            mixedInsertions += newResult.mixedInsertionCandidateCount ?? 0;
            for (const candidate of newResult.candidates) {
              const verified = JSON.parse(current.mod.verify_fmc_solution_wasm(scramble, candidate.solution));
              if (!verified.ok || !verified.solved) throw new Error(`invalid candidate at ${index}`);
            }
          }

          const avg = xs => xs.reduce((a, b) => a + b, 0) / xs.length;
          const report = {
            cases: 16,
            threeCycleAlgorithmCount: current.built.threeCycleAlgorithmCount,
            twoCornerTwoEdgeAlgorithmCount: mixedCount,
            baselineTableBuildMs: baseline.buildMs,
            currentTableBuildMs: current.buildMs,
            baselineAverageMs: avg(oldTimes),
            currentAverageMs: avg(newTimes),
            runtimeRatio: avg(newTimes) / avg(oldTimes),
            mixedSkeletons,
            mixedInsertions,
            improvedCases: improved,
          };
          console.log(JSON.stringify(report, null, 2));
          if (mixedSkeletons === 0) throw new Error('no 2C2E skeleton reached the retained beam');
          if (mixedInsertions === 0) throw new Error('no 2C2E skeleton was completed');
          if (report.runtimeRatio > 1.65) throw new Error(`runtime ratio too high: ${report.runtimeRatio}`);
          NODE
          node /tmp/benchmark-fmc-2c2e.mjs

      - name: Commit production result
        run: |
          rm -f tools/apply-fmc-2c2e.py
          rm -f tools/apply-fmc-2c2e-beam.py
          rm -f .github/workflows/fmc-2c2e-implementation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solver-wasm/src/fmc_search.rs solver-wasm/src/lib.rs public/solver-wasm/solver_wasm_bg.wasm tools/apply-fmc-2c2e.py tools/apply-fmc-2c2e-beam.py .github/workflows/fmc-2c2e-implementation.yml
          git commit -m "Add FMC 2C2E skeleton insertion"
          git push origin HEAD:agent/fmc-2c2e-insertion
