name: Apply Yau 3-cross center lock

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-yau-cross3-center-lock.yml"
      - "tools/apply-yau-cross3-center-lock.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply cross-lock patch
        run: python tools/apply-yau-cross3-center-lock.py

      - name: Format Rust
        run: cargo fmt --manifest-path solver444-wasm/Cargo.toml --all

      - name: Run 4x4 Rust tests
        run: cargo test --manifest-path solver444-wasm/Cargo.toml --lib

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --locked
          fi

      - name: Rebuild 4x4 browser WASM
        run: |
          rm -rf target/yau-center-lock-wasm
          wasm-pack build solver444-wasm --target web --out-dir ../target/yau-center-lock-wasm --out-name solver444_wasm --release
          cp target/yau-center-lock-wasm/solver444_wasm.js public/solver444-wasm/solver444_wasm.js
          cp target/yau-center-lock-wasm/solver444_wasm.d.ts public/solver444-wasm/solver444_wasm.d.ts
          cp target/yau-center-lock-wasm/solver444_wasm_bg.wasm public/solver444-wasm/solver444_wasm_bg.wasm
          cp target/yau-center-lock-wasm/solver444_wasm_bg.wasm.d.ts public/solver444-wasm/solver444_wasm_bg.wasm.d.ts

      - name: Verify Yau cross lock and regressions
        run: |
          node --check solver/solver444.js
          node --check tools/verify-444-yau.mjs
          node tools/verify-444-yau.mjs
          node tools/verify-444-edge-323.mjs
          node tools/verify-444-public-notation.mjs
          git diff --check

      - name: Commit implementation
        run: |
          rm -f tools/apply-yau-cross3-center-lock.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solver444-wasm/src/edges.rs solver444-wasm/src/centers.rs solver444-wasm/src/api.rs solver/solver444.js tools/verify-444-yau.mjs public/solver444-wasm tools/apply-yau-cross3-center-lock.py
          git commit -m "Keep Yau 3-cross locked through remaining centers"
          git push origin HEAD:main
