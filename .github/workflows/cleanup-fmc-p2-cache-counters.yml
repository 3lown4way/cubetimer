name: Clean FMC phase-2 cache counters

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/fmc-p2-state-cache-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fmc-p2-state-cache-v1
          fetch-depth: 0

      - name: Capture cached baseline
        env:
          FMC_SPEED_RUNS: '100'
          FMC_SPEED_PREMOVE_SETS: '80'
          FMC_SPEED_INSERTION_RUNS: '0'
        run: node benchmark-fmc-speed-identity.mjs --out /tmp/fmc-before-cleanup.json

      - name: Remove cache counters
        run: |
          python3 tools/remove-fmc-p2-cache-counters.py
          cargo fmt --manifest-path solver-wasm/Cargo.toml
          cargo check --release --manifest-path solver-wasm/Cargo.toml
          cargo test --release --manifest-path solver-wasm/Cargo.toml

      - name: Install wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Rebuild WASM
        run: |
          rm -rf solver-wasm/.wasm-pack-out
          cd solver-wasm
          wasm-pack build --release --target web --out-dir .wasm-pack-out
          cp .wasm-pack-out/solver_wasm.js ../public/solver-wasm/solver_wasm.js
          cp .wasm-pack-out/solver_wasm_bg.wasm ../public/solver-wasm/solver_wasm_bg.wasm
          cp .wasm-pack-out/solver_wasm.d.ts ../public/solver-wasm/solver_wasm.d.ts
          cp .wasm-pack-out/solver_wasm_bg.wasm.d.ts ../public/solver-wasm/solver_wasm_bg.wasm.d.ts

      - name: Capture cleaned cache timing
        env:
          FMC_SPEED_RUNS: '100'
          FMC_SPEED_PREMOVE_SETS: '80'
          FMC_SPEED_INSERTION_RUNS: '0'
        run: node benchmark-fmc-speed-identity.mjs --out /tmp/fmc-after-cleanup.json

      - name: Require identity and no regression
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('/tmp/fmc-before-cleanup.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('/tmp/fmc-after-cleanup.json', 'utf8'));
          if (before.rows.length !== after.rows.length) throw new Error('row count changed');
          for (let i = 0; i < before.rows.length; i += 1) {
            for (const field of ['scramble', 'solution', 'moveCount']) {
              if (before.rows[i][field] !== after.rows[i][field]) {
                throw new Error(`output changed at row ${i}, ${field}`);
              }
            }
            if (JSON.stringify(before.rows[i].candidates) !== JSON.stringify(after.rows[i].candidates)) {
              throw new Error(`candidate portfolio changed at row ${i}`);
            }
          }
          const ratio = after.summary.averageSolveMs / before.summary.averageSolveMs;
          console.log(JSON.stringify({ before: before.summary, after: after.summary, cleanupSpeedup: 1 / ratio }));
          if (!(ratio < 1.03)) throw new Error(`counter cleanup regressed over 3%: ratio=${ratio}`);
          NODE

      - name: Run FMC regressions
        env:
          FMC_SPEED_RUNS: '20'
          FMC_SPEED_PREMOVE_SETS: '80'
          FMC_SPEED_INSERTION_RUNS: '6'
          FMC_INSERTION_REPEATS: '2'
        run: |
          node benchmark-fmc-speed-identity.mjs
          node benchmark-fmc-insertion-speed-identity.mjs

      - name: Commit cleaned source and WASM
        run: |
          rm -rf solver-wasm/.wasm-pack-out
          git rm tools/remove-fmc-p2-cache-counters.py .github/workflows/cleanup-fmc-p2-cache-counters.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solver-wasm/src/fmc_search.rs \
            public/solver-wasm/solver_wasm.js \
            public/solver-wasm/solver_wasm_bg.wasm \
            public/solver-wasm/solver_wasm.d.ts \
            public/solver-wasm/solver_wasm_bg.wasm.d.ts
          git commit -m "Remove FMC cache instrumentation"
          git push origin HEAD:agent/fmc-p2-state-cache-v1
