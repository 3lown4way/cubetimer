name: Apply Yau cross robustness

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-yau-cross-robustness.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply robustness patches
        run: |
          python tools/apply-yau-cross-robustness.py
          python tools/apply-yau-target-projection.py
          python tools/apply-yau-cross-meta.py
          python tools/apply-yau-frame-retry.py
          python tools/apply-yau-probe-projection-flag.py
          python tools/apply-yau-frame-sequential.py
      - name: Validate syntax
        run: |
          node --check solver/edgePairing444.js
          node --check solver/solver444.js
      - name: Verify existing Yau contract
        run: node tools/verify-444-yau.mjs
      - name: Verify reproduced Cross failure
        run: |
          cat > tools/.yau-cross-repro-temp.mjs <<'EOF'
          import { solve444 } from "../solver/solver444.js";
          const cases = [
            {
              crossColor: "D",
              scramble: "Rw U' F R2 F Bw' Fw' Dw Bw Dw Uw R Bw Fw2 B2 Fw2 B Uw2 Lw Bw2 R' Lw R' L Bw U2 Bw U' Fw2 D Bw' Uw'",
            },
            {
              crossColor: "F",
              scramble: "Bw' F L F' D Lw' Dw Lw2 R D Uw' Lw2 Dw U' L2 R2 Bw' Rw' Bw' R Fw' U Rw' Uw' B2 Uw' F' R Uw' Rw' Lw2 Uw",
            },
          ];
          for (const test of cases) {
            const started = Date.now();
            const result = await solve444(test.scramble, null, {
              deadlineTs: Date.now() + 60_000,
              crossColor: test.crossColor,
              method444: "yau",
            });
            console.log(JSON.stringify({
              crossColor: test.crossColor,
              elapsedMs: Date.now() - started,
              ok: result.ok,
              verified: result.verified,
              reason: result.reason,
              frameSpin: result.meta?.yauFrameSpin,
              attempts: result.meta?.yauFrameAttempts,
            }));
            if (!result.ok || result.verified !== true) throw new Error(`YAU_CROSS_REPRO_FAILED:${result.reason}`);
          }
          EOF
          node tools/.yau-cross-repro-temp.mjs
          rm tools/.yau-cross-repro-temp.mjs
      - name: Verify existing 4x4 contracts
        run: |
          node tools/verify-444-worker-boundary.mjs
          node tools/verify-444-public-notation.mjs
          node tools/verify-444-edge-323.mjs
      - name: Commit runtime fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solver/edgePairing444.js solver/solver444.js
          git commit -m "Fix Yau cross frame failures"
          git push origin HEAD:main

# Reproduces the former 444_YAU_CROSS3_FAILED path and requires verified Yau output.
