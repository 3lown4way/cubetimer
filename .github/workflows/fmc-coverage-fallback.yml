name: FMC coverage fallback validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply coverage fallback transform
        run: python3 tools/apply-fmc-coverage-fallback.py

      - name: Syntax check
        run: |
          node --check solver/wasmSolver.js
          node --check tools/verify-fmc-coverage-fallback.mjs

      - name: Verify three failures and 1000-scramble coverage
        run: node tools/verify-fmc-coverage-fallback.mjs

      - name: Commit production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver/wasmSolver.js
          if git diff --cached --quiet; then
            echo "No production changes to commit"
          else
            git commit -m "Add FMC two-phase coverage fallback"
            git push origin HEAD:${{ github.head_ref }}
          fi
