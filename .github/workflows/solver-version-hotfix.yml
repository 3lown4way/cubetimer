name: Solver version hotfix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/app-wide-performance
          fetch-depth: 0
      - name: Apply declaration fix
        run: python3 tools/apply-solver-versioning.py
      - name: Validate syntax and binding
        run: |
          node --check main.js
          node benchmark-solver-version-binding.mjs
      - name: Commit fixed main bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js
          if git diff --cached --quiet; then
            echo "No main.js changes to commit."
          else
            git commit -m "Fix solverVersion runtime declaration"
            git push origin HEAD:agent/app-wide-performance
          fi
