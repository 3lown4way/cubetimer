name: Apply FMC phase-2 state cache

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/fmc-p2-state-cache-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fmc-p2-state-cache-v1
          fetch-depth: 0

      - name: Capture baseline FMC output and timing
        env:
          FMC_SPEED_RUNS: '100'
          FMC_SPEED_PREMOVE_SETS: '80'
          FMC_SPEED_INSERTION_RUNS: '0'
        run: node benchmark-fmc-speed-identity.mjs --out /tmp/fmc-baseline.json

      - name: Apply shared phase-2 state cache
        run: |
          python3 tools/apply-fmc-p2-state-cache.py
          cargo fmt --manifest-path solver-wasm/Cargo.toml
          cargo check --release --manifest-path solver-wasm/Cargo.toml
          cargo test --release --manifest-path solver-wasm/Cargo.toml

      - name: Install wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          wasm-pack --version

      - name: Build optimized WASM
        run: |
          rm -rf solver-wasm/.wasm-pack-out
          cd solver-wasm
          wasm-pack build --release --target web --out-dir .wasm-pack-out
          cp .wasm-pack-out/solver_wasm.js ../public/solver-wasm/solver_wasm.js
          cp .wasm-pack-out/solver_wasm_bg.wasm ../public/solver-wasm/solver_wasm_bg.wasm
          cp .wasm-pack-out/solver_wasm.d.ts ../public/solver-wasm/solver_wasm.d.ts
          cp .wasm-pack-out/solver_wasm_bg.wasm.d.ts ../public/solver-wasm/solver_wasm_bg.wasm.d.ts

      - name: Capture optimized FMC output and timing
        env:
          FMC_SPEED_RUNS: '100'
          FMC_SPEED_PREMOVE_SETS: '80'
          FMC_SPEED_INSERTION_RUNS: '0'
        run: node benchmark-fmc-speed-identity.mjs --out /tmp/fmc-optimized.json

      - name: Require identical candidate portfolio and speed gain
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const baseline = JSON.parse(fs.readFileSync('/tmp/fmc-baseline.json', 'utf8'));
          const optimized = JSON.parse(fs.readFileSync('/tmp/fmc-optimized.json', 'utf8'));
          if (baseline.rows.length !== optimized.rows.length) throw new Error('row count changed');
          for (let i = 0; i < baseline.rows.length; i += 1) {
            const before = baseline.rows[i];
            const after = optimized.rows[i];
            for (const field of ['scramble', 'solution', 'moveCount']) {
              if (before[field] !== after[field]) {
                throw new Error(`FMC output changed at row ${i}, ${field}`);
              }
            }
            if (JSON.stringify(before.candidates) !== JSON.stringify(after.candidates)) {
              throw new Error(`FMC candidate portfolio changed at row ${i}`);
            }
          }
          const ratio = optimized.summary.averageSolveMs / baseline.summary.averageSolveMs;
          const medianRatio = optimized.summary.medianSolveMs / baseline.summary.medianSolveMs;
          console.log(JSON.stringify({
            baseline: baseline.summary,
            optimized: optimized.summary,
            averageSpeedup: 1 / ratio,
            medianSpeedup: 1 / medianRatio,
          }));
          if (!(ratio < 0.995)) throw new Error(`FMC average gain below 0.5%: ratio=${ratio}`);
          NODE

      - name: Run permanent FMC regressions
        env:
          FMC_SPEED_RUNS: '20'
          FMC_SPEED_PREMOVE_SETS: '80'
          FMC_SPEED_INSERTION_RUNS: '6'
          FMC_INSERTION_REPEATS: '2'
        run: |
          node benchmark-fmc-speed-identity.mjs
          node benchmark-fmc-insertion-speed-identity.mjs

      - name: Commit optimized source and WASM
        run: |
          rm -rf solver-wasm/.wasm-pack-out
          git rm tools/apply-fmc-p2-state-cache.py .github/workflows/apply-fmc-p2-state-cache.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solver-wasm/src/fmc_search.rs \
            public/solver-wasm/solver_wasm.js \
            public/solver-wasm/solver_wasm_bg.wasm \
            public/solver-wasm/solver_wasm.d.ts \
            public/solver-wasm/solver_wasm_bg.wasm.d.ts
          git commit -m "Reuse FMC phase-2 searches by state"
          git push origin HEAD:agent/fmc-p2-state-cache-v1
