name: Apply Yau edge 3-2-3 rescue

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-yau-edge323-rescue.yml"
      - "tools/apply-yau-edge323-rescue.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Yau edge rescue patch
        run: python tools/apply-yau-edge323-rescue.py

      - name: Syntax check
        run: |
          node --check solver/solver444.js
          node --check solver/edgePairing444.js

      - name: Verify Yau and 3-2-3 regressions
        run: |
          node tools/verify-444-yau.mjs
          node tools/verify-444-edge-323.mjs
          node tools/verify-444-public-notation.mjs
          git diff --check

      - name: Commit implementation
        run: |
          rm -f tools/apply-yau-edge323-rescue.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solver/solver444.js tools/apply-yau-edge323-rescue.py
          git commit -m "Retry Yau edge pairing with flexible 3-2-3 bank"
          git push origin HEAD:main
