name: Apply ZBLS completion

on:
  push:
    branches:
      - agent/complete-zbls-index
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-zbls-index
          fetch-depth: 0

      - name: Apply and validate completion patch
        run: |
          base64 -d .github/zbls-complete.patch.b64 | gzip -d > /tmp/zbls-complete.patch
          git apply --check /tmp/zbls-complete.patch
          git apply /tmp/zbls-complete.patch
          node --check solver/cfop3x3.js
          node --check solver/zblsSupplementalCases.js
          node --check tools/verify-zbls-case-coverage.mjs
          node tools/verify-zbls-case-coverage.mjs
          node benchmark-solver-versions.mjs

      - name: Commit completed fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solver/cfop3x3.js tools/verify-zbls-case-coverage.mjs
          git commit -m "Complete ZBLS case coverage"
          git push origin HEAD:agent/complete-zbls-index
