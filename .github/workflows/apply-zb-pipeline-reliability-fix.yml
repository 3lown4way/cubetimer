name: Apply ZB pipeline reliability fix

on:
  push:
    branches:
      - fix/zb-pipeline-reliability-v2
    paths:
      - tools/apply-zb-pipeline-reliability-fix.mjs
      - .github/workflows/apply-zb-pipeline-reliability-fix.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply source repair
        run: node tools/apply-zb-pipeline-reliability-fix.mjs

      - name: Validate syntax
        run: |
          node --check solver/cfop3x3.js
          node --check benchmark-zb-pipeline-reliability.mjs

      - name: Regenerate ZB case index
        run: node tools/generate-zbll-case-index.mjs

      - name: Run deterministic Pure ZB benchmark and preserve result
        id: benchmark
        continue-on-error: true
        env:
          ZB_PIPELINE_RUNS: "100"
        run: node benchmark-zb-pipeline-reliability.mjs

      - name: Commit repaired source and benchmark result
        run: |
          rm -f tools/apply-zb-pipeline-reliability-fix.mjs
          rm -f .github/workflows/apply-zb-pipeline-reliability-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver/cfop3x3.js solver/zbllCaseIndex.js benchmark-zb-pipeline-reliability.mjs benchmark-results/zb-pipeline-reliability.json tools/apply-zb-pipeline-reliability-fix.mjs .github/workflows/apply-zb-pipeline-reliability-fix.yml
          git commit -m "Fix Pure ZB XCross, F2L beam, and case lookup reliability"
          git push origin HEAD:fix/zb-pipeline-reliability-v2

      - name: Enforce benchmark result
        if: steps.benchmark.outcome != 'success'
        run: exit 1
