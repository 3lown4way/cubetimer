name: FMC quality targeted validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'solver/fmcSolver.js'
      - 'solver/solverWorker.js'
      - '.github/workflows/fmc-quality-targeted.yml'

jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Validate adaptive stage escalation
        run: |
          node --input-type=module <<'NODE'
          import { solveWithFMCSearch } from './solver/fmcSolver.js';
          import { buildFmcTablesWasm, verifyFmcSolutionWasm } from './solver/wasmSolver.js';

          const scramble = "U R2 U' R B D R B' R' B2 U' F' D' R F' L' B L2 F R D";
          if (!(await buildFmcTablesWasm())) throw new Error('FMC_TABLE_BUILD_FAILED');

          const sweet = await solveWithFMCSearch(scramble, null, {
            qualityMode: 'sweetSpot',
            enableInsertions: false,
          });
          if (!sweet?.ok) throw new Error(`SWEET_FAILED:${sweet?.reason}`);
          const sweetStages = sweet.performanceDiagnostics?.wasmStages?.map((stage) => stage.name) || [];
          if (sweetStages.join(',') !== 'baseline,eo-multi-switch') {
            throw new Error(`SWEET_STAGE_ESCALATION:${sweetStages.join(',')}`);
          }
          if (sweet.moveCount > 24 || !sweet.qualityTargetReached) {
            throw new Error(`SWEET_TARGET_MISS:${sweet.moveCount}`);
          }

          const extreme = await solveWithFMCSearch(scramble, null, {
            qualityMode: 'extreme',
            enableInsertions: false,
          });
          if (!extreme?.ok) throw new Error(`EXTREME_FAILED:${extreme?.reason}`);
          if (extreme.moveCount > sweet.moveCount) {
            throw new Error(`EXTREME_REGRESSION:${sweet.moveCount}:${extreme.moveCount}`);
          }
          const verification = await verifyFmcSolutionWasm(scramble, extreme.solution);
          if (!verification?.ok || verification.solved !== true) throw new Error('EXTREME_INVALID');

          console.log(JSON.stringify({
            scramble,
            sweet: {
              moveCount: sweet.moveCount,
              stages: sweetStages,
              elapsedMs: sweet.performanceDiagnostics.totalElapsedMs,
            },
            extreme: {
              moveCount: extreme.moveCount,
              stages: extreme.performanceDiagnostics.wasmStages.map((stage) => stage.name),
              elapsedMs: extreme.performanceDiagnostics.totalElapsedMs,
            },
          }, null, 2));
          NODE
