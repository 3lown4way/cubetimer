name: Apply human Yau grip presentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-444-yau-human-grip.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add Yau-specific human grip flow
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('solver/solver444.js')
          s = p.read_text()
          anchor = '''function buildHumanYawPresentation444(segments) {\n  if (!Array.isArray(segments) || !segments.length) return null;\n  const yawCandidates = VIEW_ORIENTATIONS_444.filter((entry) => entry.map.U === "U" && entry.map.D === "D");\n  return humanizeAbsoluteSegments444(segments, segments.map(() => yawCandidates));\n}\n'''
          insert = '''function buildHumanYauSetupPresentation444(segments, crossColor) {\n  if (!Array.isArray(segments) || segments.length < 5) return null;\n  const normalizedCross = /^[URFDLB]$/.test(String(crossColor || "")) ? String(crossColor) : "D";\n  const opposite = OPPOSITE_FACE_444[normalizedCross];\n\n  // Human Yau grip sequence:\n  // 1) build the first center on U,\n  // 2) flip so the first center is D while building its opposite on U,\n  // 3) hold the cross center on L for Cross 3/4 and the last four centers,\n  // 4) put the cross on D before Cross 4/4 and the remaining edge stage.\n  const firstCenterCandidates = VIEW_ORIENTATIONS_444.filter(\n    (entry) => entry.map.U === normalizedCross,\n  );\n  const oppositeCenterCandidates = VIEW_ORIENTATIONS_444.filter(\n    (entry) => entry.map.D === normalizedCross && entry.map.U === opposite,\n  );\n  const crossLeftCandidates = VIEW_ORIENTATIONS_444.filter(\n    (entry) => entry.map.L === normalizedCross && entry.map.R === opposite,\n  );\n  const crossDownCandidates = VIEW_ORIENTATIONS_444.filter(\n    (entry) => entry.map.D === normalizedCross && entry.map.U === opposite,\n  );\n\n  const candidateSets = segments.map((_, index) => {\n    if (index === 0) return firstCenterCandidates;\n    if (index === 1) return oppositeCenterCandidates;\n    if (index === 2 || index === 3) return crossLeftCandidates;\n    return crossDownCandidates;\n  });\n  return humanizeAbsoluteSegments444(segments, candidateSets);\n}\n\nfunction buildHumanYauEdgePresentation444(segments, crossColor) {\n  if (!Array.isArray(segments) || !segments.length) return null;\n  const normalizedCross = /^[URFDLB]$/.test(String(crossColor || "")) ? String(crossColor) : "D";\n  const opposite = OPPOSITE_FACE_444[normalizedCross];\n  const crossDownCandidates = VIEW_ORIENTATIONS_444.filter(\n    (entry) => entry.map.D === normalizedCross && entry.map.U === opposite,\n  );\n  return humanizeAbsoluteSegments444(segments, segments.map(() => crossDownCandidates));\n}\n\n''' + anchor
          if anchor not in s:
              raise SystemExit('human yaw anchor missing')
          s = s.replace(anchor, insert, 1)

          old = '''  const rotationlessPublicStages = structuredClone(publicStages);\n  let humanViewpointApplied = false;\n  let viewpointRotationCount = 0;\n  try {'''
          new = '''  const rotationlessPublicStages = structuredClone(publicStages);\n  let humanViewpointApplied = false;\n  let viewpointRotationCount = 0;\n  let yauHumanGripApplied = false;\n  let yauViewpointRotationCount = 0;\n  try {'''
          if old not in s:
              raise SystemExit('viewpoint vars anchor missing')
          s = s.replace(old, new, 1)

          old = '''    const centerHuman = publicCenterStage && publicCenterStage.method !== "Yau"\n      ? buildHumanCenterPresentation444(publicCenterStage, result.meta?.centerPhaseMoveCounts, crossColor)\n      : null;\n    if (centerHuman) {\n      publicCenterStage.segments = centerHuman.segments;\n      publicCenterStage.solution = centerHuman.segments.map((segment) => segment.solution).filter(Boolean).join(" ");\n      publicCenterStage.method = "Cross → Opposite → Remaining 4";\n      viewpointRotationCount += centerHuman.rotationCount;\n    }\n\n    const edgeHuman = publicEdgeStage?.segments?.length\n      ? buildHumanYawPresentation444(publicEdgeStage.segments)\n      : null;\n    if (edgeHuman) {\n      publicEdgeStage.segments = edgeHuman.segments;\n      publicEdgeStage.solution = edgeHuman.segments.map((segment) => segment.solution).filter(Boolean).join(" ");\n      viewpointRotationCount += edgeHuman.rotationCount;\n    }'''
          new = '''    const yauSetupHuman = publicCenterStage?.method === "Yau" && publicCenterStage?.segments?.length\n      ? buildHumanYauSetupPresentation444(publicCenterStage.segments, crossColor)\n      : null;\n    if (yauSetupHuman) {\n      publicCenterStage.segments = yauSetupHuman.segments;\n      publicCenterStage.solution = yauSetupHuman.segments.map((segment) => segment.solution).filter(Boolean).join(" ");\n      viewpointRotationCount += yauSetupHuman.rotationCount;\n      yauViewpointRotationCount += yauSetupHuman.rotationCount;\n    }\n\n    const centerHuman = publicCenterStage && publicCenterStage.method !== "Yau"\n      ? buildHumanCenterPresentation444(publicCenterStage, result.meta?.centerPhaseMoveCounts, crossColor)\n      : null;\n    if (centerHuman) {\n      publicCenterStage.segments = centerHuman.segments;\n      publicCenterStage.solution = centerHuman.segments.map((segment) => segment.solution).filter(Boolean).join(" ");\n      publicCenterStage.method = "Cross → Opposite → Remaining 4";\n      viewpointRotationCount += centerHuman.rotationCount;\n    }\n\n    const isYauEdgeStage = String(publicEdgeStage?.method || "").startsWith("Yau");\n    const edgeHuman = publicEdgeStage?.segments?.length\n      ? isYauEdgeStage\n        ? buildHumanYauEdgePresentation444(publicEdgeStage.segments, crossColor)\n        : buildHumanYawPresentation444(publicEdgeStage.segments)\n      : null;\n    if (edgeHuman) {\n      publicEdgeStage.segments = edgeHuman.segments;\n      publicEdgeStage.solution = edgeHuman.segments.map((segment) => segment.solution).filter(Boolean).join(" ");\n      viewpointRotationCount += edgeHuman.rotationCount;\n      if (isYauEdgeStage) yauViewpointRotationCount += edgeHuman.rotationCount;\n    }'''
          if old not in s:
              raise SystemExit('humanization block anchor missing')
          s = s.replace(old, new, 1)

          old = '''    humanViewpointApplied = viewpointRotationCount > 0\n      && await verifyEquivalent444Presentation(publicScramble, rotationlessPublicStages, publicStages);\n    if (!humanViewpointApplied) {\n      publicStages.splice(0, publicStages.length, ...rotationlessPublicStages);\n      viewpointRotationCount = 0;\n    }\n  } catch (error) {\n    console.warn("[444] human viewpoint presentation failed", error);\n    publicStages.splice(0, publicStages.length, ...rotationlessPublicStages);\n    viewpointRotationCount = 0;\n    humanViewpointApplied = false;\n  }'''
          new = '''    humanViewpointApplied = viewpointRotationCount > 0\n      && await verifyEquivalent444Presentation(publicScramble, rotationlessPublicStages, publicStages);\n    if (!humanViewpointApplied) {\n      publicStages.splice(0, publicStages.length, ...rotationlessPublicStages);\n      viewpointRotationCount = 0;\n      yauViewpointRotationCount = 0;\n    } else if (result.meta?.method444 === "yau" && yauViewpointRotationCount > 0) {\n      yauHumanGripApplied = true;\n    }\n  } catch (error) {\n    console.warn("[444] human viewpoint presentation failed", error);\n    publicStages.splice(0, publicStages.length, ...rotationlessPublicStages);\n    viewpointRotationCount = 0;\n    yauViewpointRotationCount = 0;\n    humanViewpointApplied = false;\n    yauHumanGripApplied = false;\n  }'''
          if old not in s:
              raise SystemExit('viewpoint verify anchor missing')
          s = s.replace(old, new, 1)

          old = '''      humanViewpointApplied,\n      viewpointRotationCount,\n      fullVerificationSolved: true,'''
          new = '''      humanViewpointApplied,\n      viewpointRotationCount,\n      yauHumanGripApplied,\n      yauViewpointRotationCount,\n      fullVerificationSolved: true,'''
          if old not in s:
              raise SystemExit('meta viewpoint anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tools/verify-444-yau.mjs')
          s = p.read_text()
          anchor = '''function allCentersSolved(pattern) {\n  return FACES.every((face) => faceCentersSolved(pattern, face));\n}\n'''
          insert = anchor + '''\nfunction centerColorGroupedSomewhere(pattern, color) {\n  const centers = pattern.patternData.CENTERS;\n  return FACES.some((face) => CENTER_POSITIONS_BY_FACE[face].every(\n    (position) => CENTER_FACE_BY_PIECE.get(Number(centers.pieces[position])) === color,\n  ));\n}\n\nfunction allCentersGrouped(pattern) {\n  const centers = pattern.patternData.CENTERS;\n  const groupedColors = [];\n  for (const face of FACES) {\n    const colors = new Set(CENTER_POSITIONS_BY_FACE[face].map(\n      (position) => CENTER_FACE_BY_PIECE.get(Number(centers.pieces[position])),\n    ));\n    if (colors.size !== 1) return false;\n    groupedColors.push([...colors][0]);\n  }\n  return new Set(groupedColors).size === 6;\n}\n'''
          if anchor not in s:
              raise SystemExit('center helper anchor missing')
          s = s.replace(anchor, insert, 1)

          s = s.replace(
              '''  assert.equal(result.meta.yauFallbackReason, null);\n  assert.equal(result.stages.length, 3);''',
              '''  assert.equal(result.meta.yauFallbackReason, null);\n  assert.equal(result.meta.humanViewpointApplied, true);\n  assert.equal(result.meta.yauHumanGripApplied, true);\n  assert.ok(Number(result.meta.yauViewpointRotationCount) >= 3, "Yau human grip did not reorient enough between method phases");\n  assert.ok(Number(result.meta.yauViewpointRotationCount) <= 12, "Yau human grip inserted excessive cube rotations");\n  assert.equal(result.stages.length, 3);''',
              1,
          )
          s = s.replace(
              '''  pattern = setup.segments[0].solution ? pattern.applyAlg(setup.segments[0].solution) : pattern;\n  assert.equal(faceCentersSolved(pattern, crossColor), true, "first Yau center was not solved first");\n  pattern = setup.segments[1].solution ? pattern.applyAlg(setup.segments[1].solution) : pattern;\n  assert.equal(faceCentersSolved(pattern, OPPOSITE[crossColor]), true, "opposite Yau center was not solved second");''',
              '''  pattern = setup.segments[0].solution ? pattern.applyAlg(setup.segments[0].solution) : pattern;\n  assert.equal(centerColorGroupedSomewhere(pattern, crossColor), true, "first Yau center was not solved first");\n  pattern = setup.segments[1].solution ? pattern.applyAlg(setup.segments[1].solution) : pattern;\n  assert.equal(centerColorGroupedSomewhere(pattern, crossColor), true, "first Yau center was not preserved");\n  assert.equal(centerColorGroupedSomewhere(pattern, OPPOSITE[crossColor]), true, "opposite Yau center was not solved second");''',
              1,
          )
          s = s.replace(
              '''  assert.equal(allCentersSolved(pattern), true, "Yau remaining centers did not finish all centers");''',
              '''  assert.equal(allCentersGrouped(pattern), true, "Yau remaining centers did not finish all centers");''',
              1,
          )
          marker = '''  assert.equal(setup.segments.map((segment) => segment.solution).filter(Boolean).join(" "), setup.solution);\n'''
          extra = marker + '''  assert.ok(Number(setup.segments[1].viewpointRotations) >= 1, "Yau opposite center did not flip the first center down");\n  assert.ok(Number(setup.segments[2].viewpointRotations) >= 1, "Yau Cross 3/4 did not regrip with the cross center on the side");\n  assert.ok(Number(setup.segments[4].viewpointRotations) >= 1, "Yau Cross 4/4 did not return the cross to the bottom");\n'''
          if marker not in s:
              raise SystemExit('setup assertion anchor missing')
          s = s.replace(marker, extra, 1)
          p.write_text(s)
          PY
      - name: Validate human Yau presentation
        run: |
          node --check solver/solver444.js
          node --check tools/verify-444-yau.mjs
          node tools/verify-444-yau.mjs
          node tools/verify-444-edge-323.mjs
          node tools/verify-444-public-notation.mjs
          git diff --check
      - name: Commit runtime and regression
        run: |
          rm -f .github/workflows/apply-444-slice-close-fix.yml .github/workflows/apply-444-yau-natural-edge-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solver/solver444.js tools/verify-444-yau.mjs .github/workflows/apply-444-slice-close-fix.yml .github/workflows/apply-444-yau-natural-edge-fix.yml
          git commit -m "Humanize Yau cube grips"
          git push origin HEAD:main
