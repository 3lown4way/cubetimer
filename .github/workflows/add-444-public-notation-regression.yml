name: Add 4x4 public notation regression

on:
  push:
    branches:
      - fix/444-public-move-notation
    paths:
      - ".github/workflows/add-444-public-notation-regression.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/444-public-move-notation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Add external WCA-notation verification
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/verify-444-worker-boundary.mjs")
          text = path.read_text()

          text = text.replace(
            'import fs from "node:fs";\n\nimport {\n  getSolver444ReadinessStatus,\n  solve444,\n} from "../solver/solver444.js";',
            'import fs from "node:fs";\n\nimport { puzzles } from "../vendor/cubing/puzzles/index.js";\nimport {\n  getSolver444ReadinessStatus,\n  solve444,\n  translate444MoveConvention,\n} from "../solver/solver444.js";',
            1,
          )
          text = text.replace(
            'const progress = [];\nconst valid = await solve444(\n  "Rw U2 F\' Lw D B2",',
            'const publicScramble = "Rw U2 F\' Lw D B2";\nconst progress = [];\nconst valid = await solve444(\n  publicScramble,',
            1,
          )

          marker = 'assert.equal(valid.moveCount, valid.solution.split(/\\s+/).filter(Boolean).length);\n'
          addition = '''assert.equal(valid.moveCount, valid.solution.split(/\\s+/).filter(Boolean).length);

assert.equal(
  translate444MoveConvention("U U' U2 Rw Rw' Rw2 F F' Fw Fw' r r'"),
  "U' U U2 Rw' Rw Rw2 F F' Fw Fw' Rw' Rw",
);
assert.equal(
  translate444MoveConvention(translate444MoveConvention(publicScramble)),
  publicScramble,
  "the public/internal notation conversion must be involutive",
);

const puzzle444 = await puzzles["4x4x4"].kpuzzle();
const solved444 = puzzle444.defaultPattern();
const afterCenters = solved444.applyAlg(publicScramble).applyAlg(valid.stages[0].solution);
const centerOrbitNames = Object.keys(solved444.patternData).filter((name) => /center/i.test(name));
assert.ok(centerOrbitNames.length > 0, "4x4 center orbit was not found");
for (const orbitName of centerOrbitNames) {
  assert.deepEqual(
    afterCenters.patternData[orbitName],
    solved444.patternData[orbitName],
    `public Centers stage did not solve ${orbitName}`,
  );
}
const afterPublicSolution = solved444.applyAlg(publicScramble).applyAlg(valid.solution);
const externallySolved = typeof afterPublicSolution.experimentalIsSolved === "function"
  ? afterPublicSolution.experimentalIsSolved({ ignorePuzzleOrientation: false })
  : JSON.stringify(afterPublicSolution.patternData) === JSON.stringify(solved444.patternData);
assert.equal(externallySolved, true, "public WCA-notation solution must solve the original 4x4 scramble");
'''
          if marker not in text:
            raise SystemExit("move-count marker not found")
          text = text.replace(marker, addition, 1)

          marker = 'assert.match(solver444Source, /fullVerificationSolved: true/);\n'
          addition = '''assert.match(solver444Source, /fullVerificationSolved: true/);
assert.match(solver444Source, /const internalScramble = translate444MoveConvention\\(publicScramble\\)/);
assert.match(solver444Source, /stages: publicStages/);
'''
          if marker not in text:
            raise SystemExit("source assertion marker not found")
          text = text.replace(marker, addition, 1)

          path.write_text(text)
          PY
      - name: Run public-notation regression
        run: |
          node --check solver/solver444.js
          node --check tools/verify-444-worker-boundary.mjs
          node tools/verify-444-worker-boundary.mjs
      - name: Remove temporary workflow
        run: rm .github/workflows/add-444-public-notation-regression.yml
      - name: Commit regression test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Verify 4x4 solutions in public WCA notation"
          git push
