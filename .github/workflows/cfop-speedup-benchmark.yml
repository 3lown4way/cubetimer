name: Solver hotpath benchmark

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/app-wide-performance
          fetch-depth: 0

      - name: Apply measured hotpath optimizations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          worker_path = Path('solver/solverWorker.js')
          worker = worker_path.read_text()
          worker = worker.replace(
              'const TWOPHASE_333_MAX_FRONTIERS = 12;',
              'const TWOPHASE_333_MAX_FRONTIERS = 2;',
              1,
          )
          worker = worker.replace(
              '    await prewarm3x3StrictCfopLibraries();\n',
              '    await prewarm3x3StrictCfopLibraries({ includeF2L: false, includeSingleStage: true });\n',
              1,
          )
          worker_path.write_text(worker)

          cfop_path = Path('solver/cfop3x3.js')
          cfop = cfop_path.read_text()

          style_marker = '  const enableStyleFallback = hasStyleOptIn && options.enableStyleFallback !== false;\n'
          style_insert = style_marker + '''  const preferCompactF2L =
            solveMode === "strict" &&
            !useSvWvStages &&
            !mixedCfopStages &&
            !hasStyleOptIn &&
            !f2lTransitionProfile &&
            !f2lDownstreamProfile;
'''
          if '  const preferCompactF2L =\n' not in cfop:
            if style_marker not in cfop:
              raise SystemExit('style marker not found')
            cfop = cfop.replace(style_marker, style_insert, 1)

          stage_marker = '''      mixedCfopStages,
            enableStyleFallback,
            deadlineTs,
            f2lStyleProfile,
'''
          stage_replacement = '''      mixedCfopStages,
            enableStyleFallback,
            preferCompactF2L,
            deadlineTs,
            f2lStyleProfile,
'''
          if '      preferCompactF2L,\n' not in cfop:
            if stage_marker not in cfop:
              raise SystemExit('F2L stage marker not found')
            cfop = cfop.replace(stage_marker, stage_replacement, 1)

          solve_marker = '''  ) {
            const beamResult = solveWithFormulaDbF2L(startPattern, stage, ctx);
'''
          compact_block = '''  ) {
            if (stage.preferCompactF2L === true) {
              const compactResult = solveF2LCompactIDA(startPattern, stage, ctx);
              if (stage.performanceCollector) {
                stage.performanceCollector.compactPathUsed = true;
                stage.performanceCollector.compactFallbackUsed = false;
                stage.performanceCollector.finalMethod = compactResult?.ok
                  ? "compact_ida"
                  : "compact_ida_failed";
                if (Number.isFinite(compactResult?.nodes)) {
                  stage.performanceCollector.finalNodes = compactResult.nodes;
                }
                if (Number.isFinite(compactResult?.bound)) {
                  stage.performanceCollector.finalBound = compactResult.bound;
                }
              }
              if (!compactResult) return compactResult;
              return {
                ...compactResult,
                method: compactResult.ok ? "compact_ida" : "compact_ida_failed",
                f2lDiagnostics: stage.performanceCollector || null,
              };
            }
            const beamResult = solveWithFormulaDbF2L(startPattern, stage, ctx);
'''
          if '            if (stage.preferCompactF2L === true) {' not in cfop:
            if solve_marker not in cfop:
              raise SystemExit('F2L solve marker not found')
            cfop = cfop.replace(solve_marker, compact_block, 1)

          library_marker = '''      const f2lLibraryAwaitStartedAt = Date.now();
            stages[i].f2lCaseLibrary = await getF2LCaseLibrary(ctx);
            performanceSession.f2lLibraryAwaitMs += Math.max(0, Date.now() - f2lLibraryAwaitStartedAt);
'''
          library_replacement = '''      if (stages[i].preferCompactF2L !== true) {
              const f2lLibraryAwaitStartedAt = Date.now();
              stages[i].f2lCaseLibrary = await getF2LCaseLibrary(ctx);
              performanceSession.f2lLibraryAwaitMs += Math.max(0, Date.now() - f2lLibraryAwaitStartedAt);
            }
'''
          if '      if (stages[i].preferCompactF2L !== true) {' not in cfop:
            if library_marker not in cfop:
              raise SystemExit('F2L library await marker not found')
            cfop = cfop.replace(library_marker, library_replacement, 1)

          cfop_path.write_text(cfop)

          benchmark_path = Path('benchmark-hotpaths.mjs')
          benchmark = benchmark_path.read_text()
          benchmark = benchmark.replace('      maxPhase1Solutions: 12,', '      maxPhase1Solutions: 2,', 1)
          benchmark_path.write_text(benchmark)
          PY

      - name: Syntax checks
        run: |
          node --check benchmark-hotpaths.mjs
          node --check benchmark-twophase-frontiers.mjs
          node --check benchmark-zb-cold.mjs
          node --check solver/solverWorker.js
          node --check solver/cfop3x3.js

      - name: Run cold strict CFOP validation
        run: |
          node --input-type=module <<'EOF'
          import { performance } from 'node:perf_hooks';
          import { cube3x3x3 } from './vendor/cubing/puzzles/index.js';
          import { solve3x3StrictCfopFromPattern } from './solver/cfop3x3.js';
          const kpuzzle = await cube3x3x3.kpuzzle();
          const scramble = "D2 B2 R2 U' R2 U B2 D2 L2 F2 U2 F' D' B L' U B' L' U' R'";
          const started = performance.now();
          const result = await solve3x3StrictCfopFromPattern(kpuzzle.defaultPattern().applyAlg(scramble), {
            mode: 'strict',
            crossColor: 'D',
            enableOllPllPrediction: false,
            deadlineTs: Date.now() + 10000,
          });
          const elapsed = performance.now() - started;
          if (!result?.ok) throw new Error(`COLD_STRICT_FAILED:${result?.reason}`);
          console.log(`cold strict ok: ${elapsed.toFixed(1)}ms moves=${result.moveCount} libraryAwait=${result.performanceDiagnostics?.f2lLibraryAwaitMs ?? '?'}ms`);
          EOF

      - name: Run CFOP regression benchmark
        run: node benchmark-cfop-10.mjs

      - name: Run optimized 2-phase and ZB hotpaths
        run: node benchmark-hotpaths.mjs

      - name: Compare two-phase frontier counts
        run: node benchmark-twophase-frontiers.mjs

      - name: Measure explicit F2L library build cost
        run: node benchmark-zb-cold.mjs

      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver/solverWorker.js solver/cfop3x3.js benchmark-hotpaths.mjs
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Optimize two-phase and default CFOP hot paths"
            git push origin HEAD:agent/app-wide-performance
          fi
