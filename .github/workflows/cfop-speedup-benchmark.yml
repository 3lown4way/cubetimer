name: Apply FMC real deadline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch_and_build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply source patch
        run: |
          python tools/repair-fmc-real-deadline-patcher.py
          python tools/apply-fmc-real-deadline.py
          rm -f tools/repair-fmc-real-deadline-patcher.py

      - name: Format and compile Rust
        run: |
          cargo fmt --manifest-path solver-wasm/Cargo.toml
          cargo test --manifest-path solver-wasm/Cargo.toml --lib

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --version 0.13.1 --locked
          fi

      - name: Rebuild solver WASM
        run: |
          cd solver-wasm
          wasm-pack build --target web --out-dir ../public/solver-wasm

      - name: Validate deadline contract
        run: |
          node --check solver/fmcSolver.js
          node --check solver/wasmSolver.js
          node --check benchmark/fmcBenchmarkWorker.js
          node --check benchmark/benchmark-enhanced.js
          node --check benchmark/benchmark.js
          node --check benchmark-fmc-extreme-contract.mjs
          node --check tools/verify-benchmark-no-fallback.mjs
          node benchmark/benchmark-no-fallback-policy.test.mjs
          node tools/verify-benchmark-no-fallback.mjs
          node benchmark-fmc-extreme-contract.mjs

      - name: Commit generated source and WASM
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Bind FMC Extreme search to the per-run deadline"
          git push origin HEAD:${{ github.head_ref }}
