name: Solver hotpath benchmark

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/app-wide-performance
          fetch-depth: 0

      - name: Apply measured hotpath optimizations
        run: python3 tools/apply-hotpath-optimization.py

      - name: Syntax checks
        run: |
          node --check benchmark-hotpaths.mjs
          node --check benchmark-twophase-frontiers.mjs
          node --check benchmark-zb-cold.mjs
          node --check solver/solverWorker.js
          node --check solver/cfop3x3.js

      - name: Run CFOP regression benchmark
        run: node benchmark-cfop-10.mjs

      - name: Run 2-phase and ZB correctness benchmarks
        run: node benchmark-hotpaths.mjs

      - name: Profile optimized formula-library builds
        env:
          DEBUG_CFOP_BUILD: "1"
        run: node benchmark-zb-cold.mjs

      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver/cfop3x3.js
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Optimize ZBLL case library construction"
            git push origin HEAD:agent/app-wide-performance
          fi
