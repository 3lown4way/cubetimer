name: Validate direct ZBLL key-miss recovery

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate_zbll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply direct ZBLL repair
        run: python tools/apply-zbll-direct-key-miss-fix.py

      - name: Validate syntax and generated index
        run: |
          node --check solver/cfop3x3.js
          node --check benchmark-zb-direct-reliability.mjs
          node tools/generate-zbll-case-index.mjs --check

      - name: Run 250-case direct Pure ZB reliability
        env:
          ZB_RELIABILITY_RUNS: '250'
          ZB_RELIABILITY_TIMEOUT_MS: '10000'
        run: node benchmark-zb-direct-reliability.mjs

      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver/cfop3x3.js benchmark-zb-direct-reliability.mjs
          git rm -f tools/apply-zbll-direct-key-miss-fix.py
          git commit -m "Recover direct ZBLL formulas on case-key misses"
          git push origin HEAD:${{ github.head_ref }}
