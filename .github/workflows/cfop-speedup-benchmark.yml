name: Apply FMC Extreme anytime frontier v3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply_anytime_frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply anytime frontier migration
        run: |
          python tools/strip-anytime-migration-workflow.py
          python tools/apply-fmc-extreme-anytime-v3.py

      - name: Validate scheduler and contracts
        run: |
          node --check solver/fmcSolver.js
          node --check solver/fmcExtremeProfile.js
          node --check benchmark/benchmark-enhanced.js
          node --check benchmark/benchmark.js
          node --check benchmark-fmc-extreme-anytime-plan.mjs
          node --check benchmark-fmc-extreme-contract.mjs
          node benchmark-fmc-extreme-anytime-plan.mjs
          node benchmark-fmc-extreme-contract.mjs

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Continue FMC Extreme with widening anytime rounds"
          git push origin HEAD:${{ github.head_ref }}
