name: Integrate benchmarked FMC Extreme engine

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate_fmc_extreme:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fetch benchmarked Extreme branch
        run: git fetch origin agent/fmc-extreme-independent-frontier-v2

      - name: Apply site-parity integration
        run: python tools/apply-fmc-extreme-site-parity.py

      - name: Format and compile Rust
        run: |
          cargo fmt --manifest-path solver-wasm/Cargo.toml
          cargo test --manifest-path solver-wasm/Cargo.toml --lib

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --version 0.13.1 --locked
          fi

      - name: Rebuild browser WASM
        run: |
          cd solver-wasm
          wasm-pack build --target web --out-dir ../public/solver-wasm

      - name: Validate exact site parity
        run: |
          node --check solver/fmcExtremeProfile.js
          node --check solver/fmcSolver.js
          node --check solver/wasmSolver.js
          node --check benchmark/fmcBenchmarkWorker.js
          node --check benchmark/benchmark-no-fallback-policy.js
          node --check benchmark/benchmark-no-fallback-policy.test.mjs
          node --check benchmark-fmc-extreme-contract.mjs
          node --check tools/verify-benchmark-no-fallback.mjs
          node benchmark/benchmark-no-fallback-policy.test.mjs
          node tools/verify-benchmark-no-fallback.mjs
          node benchmark-fmc-extreme-contract.mjs

      - name: Commit integrated engine and WASM
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use the benchmarked 24-variant FMC Extreme engine"
          git push origin HEAD:${{ github.head_ref }}
