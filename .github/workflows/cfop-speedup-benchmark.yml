name: Solver hotpath benchmark

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fmc-extreme-independent-frontier-v2

      - name: Probe FMC frontiers below 20 moves
        run: node tools/.fmc-sub20-probe.mjs
