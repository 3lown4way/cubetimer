name: Generate missing direct ZBLL cases

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate_zbll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply diagnostic ZBLL generator
        run: python tools/apply-zbll-direct-key-miss-fix.py

      - name: Validate syntax and generated index
        run: |
          node --check solver/cfop3x3.js
          node --check benchmark-zb-direct-reliability.mjs
          node tools/generate-zbll-case-index.mjs --check

      - name: Generate missing direct ZBLL algorithms
        env:
          ZB_RELIABILITY_RUNS: '250'
          ZB_RELIABILITY_TIMEOUT_MS: '30000'
        run: node benchmark-zb-direct-reliability.mjs
