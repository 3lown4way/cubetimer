name: Apply rotation-free move counts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply_rotation_counts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply metric-count fix
        run: |
          python tools/apply-rotation-free-counts.py
          python tools/repair-rotation-count-contract.py

      - name: Validate metric counts
        run: |
          node --check solver/cfop3x3.js
          node --check solver/roux3x3.js
          node --check solver/roux3x3v2.js
          node --check benchmark-rotation-count-contract.mjs
          node benchmark-rotation-count-contract.mjs

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Exclude cube rotations from move counts"
          git push origin HEAD:${{ github.head_ref }}
