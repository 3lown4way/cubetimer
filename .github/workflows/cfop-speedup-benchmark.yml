name: Apply real color-neutral selection

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply_color_neutral:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply color-neutral fix
        run: python tools/apply-color-neutral-fix.py

      - name: Validate color-neutral routing
        run: |
          node --check solver/cfop3x3.js
          node --check solver/roux3x3.js
          node --check solver/roux3x3v2.js
          node --check benchmark-color-neutral-contract.mjs
          node benchmark-color-neutral-contract.mjs

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make CFOP ZB and Roux truly color neutral"
          git push origin HEAD:${{ github.head_ref }}
