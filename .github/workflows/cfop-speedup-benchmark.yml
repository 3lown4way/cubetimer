name: Apply FMC anytime contract repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair_contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Update no-fallback contract
        run: python tools/update-anytime-no-fallback-contract.py

      - name: Validate contract
        run: |
          node --check tools/verify-benchmark-no-fallback.mjs
          node benchmark/benchmark-no-fallback-policy.test.mjs
          node tools/verify-benchmark-no-fallback.mjs

      - name: Commit contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update no-fallback contract for FMC anytime rounds"
          git push origin HEAD:${{ github.head_ref }}
