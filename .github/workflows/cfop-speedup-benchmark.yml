name: Apply FMC Extreme compression-first profile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply_profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply compression-first profile
        run: python tools/apply-fmc-extreme-compression-first.py

      - name: Validate patch
        run: |
          node --check solver/fmcExtremeProfile.js
          node --check solver/fmcSolver.js
          node --check benchmark/benchmark-no-fallback-policy.test.mjs
          node --check benchmark-fmc-extreme-contract.mjs
          node --check tools/verify-benchmark-no-fallback.mjs
          node benchmark/benchmark-no-fallback-policy.test.mjs
          node tools/verify-benchmark-no-fallback.mjs
          node benchmark-fmc-extreme-contract.mjs

      - name: Commit profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Run validated FMC compression frontier first"
          git push origin HEAD:${{ github.head_ref }}
