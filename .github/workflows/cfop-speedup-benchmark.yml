name: Apply FMC Extreme unlimited budget

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch_build_and_commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply unlimited Extreme budget
        run: python tools/apply-fmc-extreme-unlimited.py

      - name: Format and compile Rust
        run: |
          cargo fmt --manifest-path solver-wasm/Cargo.toml
          cargo test --manifest-path solver-wasm/Cargo.toml --lib

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --version 0.13.1 --locked
          fi

      - name: Rebuild solver WASM
        run: |
          cd solver-wasm
          wasm-pack build --target web --out-dir ../public/solver-wasm

      - name: Validate unlimited Extreme contract
        run: |
          node --check solver/fmcSolver.js
          node --check solver/wasmSolver.js
          node --check benchmark-fmc-extreme-contract.mjs
          node --check tools/verify-benchmark-no-fallback.mjs
          node benchmark/benchmark-no-fallback-policy.test.mjs
          node tools/verify-benchmark-no-fallback.mjs
          node benchmark-fmc-extreme-contract.mjs

      - name: Commit generated source and WASM
        run: |
          rm -f tools/apply-fmc-extreme-unlimited.py tools/cfop-speedup-benchmark.final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make FMC Extreme internally unbounded"
          git push origin HEAD:${{ github.head_ref }}
