name: Apply FMC Extreme no-downgrade fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch_fmc_extreme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply source patch
        run: |
          if [ ! -f tools/apply-fmc-extreme-no-downgrade.py ]; then
            echo "Patch already applied"
            exit 0
          fi
          python tools/apply-fmc-extreme-no-downgrade.py
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/verify-benchmark-no-fallback.mjs")
          text = path.read_text()
          start = text.index("const extremeBlock =")
          end = text.index("if (extremeBlock.includes", start)
          replacement = '''const extremeStart = fmcSolver.indexOf('if (qualityMode === "extreme")');
          const sweetSpotStart = fmcSolver.indexOf('stage("baseline"', extremeStart);
          const extremeBlock = fmcSolver.slice(extremeStart, sweetSpotStart);
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Validate source patch
        run: |
          node --check solver/fmcSolver.js
          node --check benchmark/fmcBenchmarkWorker.js
          node --check benchmark/benchmark-enhanced.js
          node --check benchmark/benchmark-no-fallback-policy.js
          node --check benchmark/benchmark-no-fallback-policy.test.mjs
          node --check tools/verify-benchmark-no-fallback.mjs
          node benchmark/benchmark-no-fallback-policy.test.mjs
          node tools/verify-benchmark-no-fallback.mjs

      - name: Commit source patch
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep FMC Extreme on its own quality ladder"
          git push origin HEAD:${{ github.head_ref }}
