name: Apply human CFOP viewpoint optimization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply_human_viewpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply viewpoint optimizer
        run: |
          python tools/repair-human-viewpoint-integrator.py
          python tools/apply-human-viewpoint-cfop.py

      - name: Validate human viewpoint behavior
        run: |
          node --check solver/cfop3x3.js
          node --check benchmark-human-viewpoint-contract.mjs
          node benchmark-human-viewpoint-contract.mjs

      - name: Commit implementation
        run: |
          git checkout -- .github/workflows/cfop-speedup-benchmark.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use human viewpoint changes to avoid back-face turns"
          git push origin HEAD:${{ github.head_ref }}
