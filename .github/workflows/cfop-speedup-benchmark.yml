name: Solver hotpath benchmark

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Syntax checks
        run: |
          node --check benchmark-hotpaths.mjs
          node --check solver/solverWorker.js

      - name: Run CFOP regression benchmark
        run: node benchmark-cfop-10.mjs

      - name: Run 2-phase and ZB hotpath baseline
        run: node benchmark-hotpaths.mjs
