name: Apply short inverse exemption once

on:
  push:
    branches:
      - fix/no-literal-inverse-minmove-twophase
    paths:
      - ".github/workflows/apply-short-inverse-exemption-once.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-literal-inverse-minmove-twophase
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply short inverse exemption
        run: |
          python tools/apply-short-inverse-exemption.py
          python tools/fix-short-inverse-benchmark-markers.py
      - name: Validate syntax and regressions
        run: |
          node --check solver/inverseSolutionPolicy.js
          node --check solver/minmoveExactV2.js
          node --check solver/solverWorker.js
          node --check benchmark-inverse-output-contract.mjs
          node benchmark-inverse-output-contract.mjs
          node benchmark-minmove-exact-v2.mjs
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Allow literal inverse only for scrambles up to four moves"
          git push origin HEAD:fix/no-literal-inverse-minmove-twophase
