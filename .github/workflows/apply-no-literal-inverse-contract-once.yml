name: Apply no-literal-inverse contract once

on:
  push:
    branches:
      - fix/no-literal-inverse-minmove-twophase
    paths:
      - ".github/workflows/apply-no-literal-inverse-contract-once.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-literal-inverse-minmove-twophase
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply inverse output contract
        run: python tools/apply-no-literal-inverse-contract.py

      - name: Check source syntax and contract markers
        run: |
          node --check solver/inverseSolutionPolicy.js
          node --check solver/minmoveExactV2.js
          node --check solver/solverWorker.js
          node --check benchmark-inverse-output-contract.mjs
          grep -q 'excludedSolution: inverseSolution || undefined' solver/solverWorker.js
          grep -q 'MINMOVE_NONTRIVIAL_SEED_NOT_FOUND' solver/minmoveExactV2.js
          git diff --check

      - name: Run reported inverse regressions
        run: node benchmark-inverse-output-contract.mjs

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prevent literal inverse outputs in minmove and two-phase"
          git push origin HEAD:fix/no-literal-inverse-minmove-twophase
