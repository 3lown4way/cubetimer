name: Apply FMC speed-only optimization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/fmc-speed-only'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fmc-speed-only
          fetch-depth: 0

      - name: Capture baseline FMC outputs and timing
        env:
          FMC_SPEED_RUNS: '8'
          FMC_SPEED_PREMOVES: '80'
        run: node benchmark-fmc-speed-identity.mjs --out /tmp/fmc-baseline.json

      - name: Apply FMC speed-only Rust transform
        run: |
          python3 tools/apply-fmc-speed-only.py
          cargo fmt --manifest-path solver-wasm/Cargo.toml
          cargo check --release --manifest-path solver-wasm/Cargo.toml

      - name: Install wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          wasm-pack --version

      - name: Build optimized WASM
        run: |
          rm -rf solver-wasm/.wasm-pack-out
          cd solver-wasm
          wasm-pack build --release --target web --out-dir .wasm-pack-out
          cp .wasm-pack-out/solver_wasm.js ../public/solver-wasm/solver_wasm.js
          cp .wasm-pack-out/solver_wasm_bg.wasm ../public/solver-wasm/solver_wasm_bg.wasm
          cp .wasm-pack-out/solver_wasm.d.ts ../public/solver-wasm/solver_wasm.d.ts
          cp .wasm-pack-out/solver_wasm_bg.wasm.d.ts ../public/solver-wasm/solver_wasm_bg.wasm.d.ts

      - name: Capture optimized FMC outputs and timing
        env:
          FMC_SPEED_RUNS: '8'
          FMC_SPEED_PREMOVES: '80'
        run: node benchmark-fmc-speed-identity.mjs --out /tmp/fmc-optimized.json

      - name: Require identical algorithms and faster runtime
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const baseline = JSON.parse(fs.readFileSync('/tmp/fmc-baseline.json', 'utf8'));
          const optimized = JSON.parse(fs.readFileSync('/tmp/fmc-optimized.json', 'utf8'));
          if (baseline.rows.length !== optimized.rows.length) {
            throw new Error(`row count changed: ${baseline.rows.length} -> ${optimized.rows.length}`);
          }
          for (let index = 0; index < baseline.rows.length; index += 1) {
            const before = baseline.rows[index];
            const after = optimized.rows[index];
            for (const field of ['scramble', 'solution', 'moveCount']) {
              if (before[field] !== after[field]) {
                throw new Error(`FMC output changed at row ${index}, field ${field}`);
              }
            }
            if (JSON.stringify(before.candidates) !== JSON.stringify(after.candidates)) {
              throw new Error(`FMC candidate portfolio changed at row ${index}`);
            }
          }
          const ratio = optimized.summary.averageMs / baseline.summary.averageMs;
          console.log(JSON.stringify({
            baseline: baseline.summary,
            optimized: optimized.summary,
            speedup: 1 / ratio,
            baselineTableBuildMs: baseline.tableBuildMs,
            optimizedTableBuildMs: optimized.tableBuildMs,
          }));
          if (!(ratio < 0.97)) {
            throw new Error(`FMC speed gain below 3%: ratio=${ratio}`);
          }
          NODE

      - name: Commit optimized source and WASM
        run: |
          rm -rf solver-wasm/.wasm-pack-out
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solver-wasm/src/fmc_search.rs \
            public/solver-wasm/solver_wasm.js \
            public/solver-wasm/solver_wasm_bg.wasm \
            public/solver-wasm/solver_wasm.d.ts \
            public/solver-wasm/solver_wasm_bg.wasm.d.ts
          git commit -m "Speed up human-style FMC without changing solutions"
          git push origin HEAD:agent/fmc-speed-only
