name: Apply 4x4 edge integration

on:
  push:
    branches:
      - agent/444-edge-pairing
    paths:
      - "tools/apply-444-edge-integration.mjs"
      - ".github/workflows/apply-444-edge-integration.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/444-edge-pairing
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply runtime integration
        run: node tools/apply-444-edge-integration.mjs
      - name: Validate Rust core and boundary
        run: |
          cargo fmt --manifest-path solver444-wasm/Cargo.toml --all
          cargo test --manifest-path solver444-wasm/Cargo.toml --lib
          cargo clippy --manifest-path solver444-wasm/Cargo.toml --lib --tests -- -D warnings
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Rebuild browser WASM package
        run: wasm-pack build solver444-wasm --target web --out-dir ../public/solver444-wasm --out-name solver444_wasm --release
      - name: Verify JavaScript and real WASM contract
        run: |
          node --check solver/solver444.js
          node --check tools/verify-444-worker-boundary.mjs
          node tools/verify-444-worker-boundary.mjs
      - name: Remove temporary automation
        run: |
          rm tools/apply-444-edge-integration.mjs
          rm .github/workflows/apply-444-edge-integration.yml
          rm .github/workflows/test-444-edge-pairing.yml
      - name: Commit verified edge integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate the verified 4x4 edge pairing stage"
          git push
