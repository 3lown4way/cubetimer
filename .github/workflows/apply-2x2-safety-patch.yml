name: Apply 2x2 WASM safety patch

on:
  push:
    branches:
      - fix/2x2-wasm-correctness
    paths:
      - tools/apply-2x2-safety-patch.mjs
      - .github/workflows/apply-2x2-safety-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2x2-wasm-correctness
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply source patch
        run: node tools/apply-2x2-safety-patch.mjs

      - name: Format Rust
        run: cargo fmt --manifest-path solver-wasm/Cargo.toml --all

      - name: Run Rust tests
        run: cargo test --manifest-path solver-wasm/Cargo.toml --lib

      - name: Run clippy
        run: cargo clippy --manifest-path solver-wasm/Cargo.toml --lib -- -D warnings

      - name: Validate JavaScript syntax
        run: node --check solver/solverWorker.js

      - name: Validate patch
        run: git diff --check

      - name: Commit generated fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver/solverWorker.js solver-wasm/src/lib.rs solver-wasm/src/*.rs
          git commit -m "Verify 2x2 WASM solutions and remove unsafe prune init"
          git push origin HEAD:fix/2x2-wasm-correctness
