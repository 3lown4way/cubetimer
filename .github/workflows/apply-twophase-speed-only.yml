name: Apply two-phase speed-only optimization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/twophase-speed-only'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/twophase-speed-only
          fetch-depth: 0

      - name: Capture baseline outputs and timing
        env:
          TWOPHASE_SPEED_RUNS: '100'
        run: node benchmark-twophase-speed-identity.mjs --out /tmp/twophase-baseline.json

      - name: Apply speed-only Rust transform
        run: |
          python3 tools/apply-twophase-speed-only.py
          cargo fmt --manifest-path solver-wasm/Cargo.toml
          cargo check --release --manifest-path solver-wasm/Cargo.toml

      - name: Install wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          wasm-pack --version

      - name: Build optimized WASM
        run: |
          rm -rf solver-wasm/.wasm-pack-out
          cd solver-wasm
          wasm-pack build --release --target web --out-dir .wasm-pack-out
          cp .wasm-pack-out/solver_wasm.js ../public/solver-wasm/solver_wasm.js
          cp .wasm-pack-out/solver_wasm_bg.wasm ../public/solver-wasm/solver_wasm_bg.wasm
          cp .wasm-pack-out/solver_wasm.d.ts ../public/solver-wasm/solver_wasm.d.ts
          cp .wasm-pack-out/solver_wasm_bg.wasm.d.ts ../public/solver-wasm/solver_wasm_bg.wasm.d.ts

      - name: Capture optimized outputs and timing
        env:
          TWOPHASE_SPEED_RUNS: '100'
        run: node benchmark-twophase-speed-identity.mjs --out /tmp/twophase-optimized.json

      - name: Require identical algorithms and faster runtime
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const baseline = JSON.parse(fs.readFileSync('/tmp/twophase-baseline.json', 'utf8'));
          const optimized = JSON.parse(fs.readFileSync('/tmp/twophase-optimized.json', 'utf8'));
          if (baseline.rows.length !== optimized.rows.length) {
            throw new Error(`row count changed: ${baseline.rows.length} -> ${optimized.rows.length}`);
          }
          const identityFields = ['scramble', 'solution', 'moveCount', 'phase1Depth', 'phase2Depth', 'candidateCount', 'phase2Nodes'];
          for (let i = 0; i < baseline.rows.length; i += 1) {
            for (const field of identityFields) {
              if (baseline.rows[i][field] !== optimized.rows[i][field]) {
                throw new Error(`algorithm changed at row ${i}, field ${field}: ${baseline.rows[i][field]} -> ${optimized.rows[i][field]}`);
              }
            }
          }
          if (baseline.summary.averageMoves !== optimized.summary.averageMoves) {
            throw new Error('average move count changed');
          }
          const ratio = optimized.summary.averageTotalMs / baseline.summary.averageTotalMs;
          const prepareRatio = optimized.summary.averagePrepareMs / baseline.summary.averagePrepareMs;
          console.log(JSON.stringify({
            baseline: baseline.summary,
            optimized: optimized.summary,
            totalSpeedup: 1 / ratio,
            prepareSpeedup: 1 / prepareRatio,
          }));
          if (!(ratio < 0.95)) {
            throw new Error(`speed gain below 5%: ratio=${ratio}`);
          }
          NODE

      - name: Commit optimized source and WASM
        run: |
          rm -rf solver-wasm/.wasm-pack-out
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solver-wasm/src/twophase_search.rs \
            public/solver-wasm/solver_wasm.js \
            public/solver-wasm/solver_wasm_bg.wasm \
            public/solver-wasm/solver_wasm.d.ts \
            public/solver-wasm/solver_wasm_bg.wasm.d.ts
          git commit -m "Speed up two-phase search without changing solutions"
          git push origin HEAD:agent/twophase-speed-only
