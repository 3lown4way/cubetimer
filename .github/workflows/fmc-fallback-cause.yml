name: FMC fallback cause diagnosis

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Baseline profile
        run: node tools/diagnose-fmc-fallback-cause.mjs baseline

      - name: Expanded EO width
        run: |
          git restore --source=HEAD -- solver-wasm/src/fmc_search.rs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('solver-wasm/src/fmc_search.rs')
          s = p.read_text()
          s = s.replace('const FMC_EO_LIMIT: usize = 6;', 'const FMC_EO_LIMIT: usize = 24;')
          s = s.replace('const FMC_PM_EO_LIMIT: usize = 3;', 'const FMC_PM_EO_LIMIT: usize = 12;')
          p.write_text(s)
          PY
          (cd solver-wasm && wasm-pack build --target web --release --out-dir ../public/solver-wasm)
          node tools/diagnose-fmc-fallback-cause.mjs eo-width

      - name: Expanded EO depth
        run: |
          git restore --source=HEAD -- solver-wasm/src/fmc_search.rs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('solver-wasm/src/fmc_search.rs')
          s = p.read_text().replace('const FMC_MAX_EO_DEPTH: u8 = 5;', 'const FMC_MAX_EO_DEPTH: u8 = 6;')
          p.write_text(s)
          PY
          (cd solver-wasm && wasm-pack build --target web --release --out-dir ../public/solver-wasm)
          node tools/diagnose-fmc-fallback-cause.mjs eo-depth

      - name: Expanded DR routes
        run: |
          git restore --source=HEAD -- solver-wasm/src/fmc_search.rs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('solver-wasm/src/fmc_search.rs')
          s = p.read_text()
          s = s.replace('const FMC_DR_ROUTE_LIMIT: usize = 8;', 'const FMC_DR_ROUTE_LIMIT: usize = 32;')
          s = s.replace('const FMC_DR_SLACK: usize = 3;', 'const FMC_DR_SLACK: usize = 7;')
          s = s.replace('const FMC_RZP_SETUP_DEPTH: u8 = 2;', 'const FMC_RZP_SETUP_DEPTH: u8 = 4;')
          p.write_text(s)
          PY
          (cd solver-wasm && wasm-pack build --target web --release --out-dir ../public/solver-wasm)
          node tools/diagnose-fmc-fallback-cause.mjs dr-width

      - name: Expanded P2 budgets
        run: |
          git restore --source=HEAD -- solver-wasm/src/fmc_search.rs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('solver-wasm/src/fmc_search.rs')
          s = p.read_text()
          s = s.replace('const FMC_P2_NODE_LIMIT: u64 = 2_000_000;', 'const FMC_P2_NODE_LIMIT: u64 = 20_000_000;')
          s = s.replace('const FMC_PM_P2_NODE_LIMIT: u64 = 500_000;', 'const FMC_PM_P2_NODE_LIMIT: u64 = 5_000_000;')
          p.write_text(s)
          PY
          (cd solver-wasm && wasm-pack build --target web --release --out-dir ../public/solver-wasm)
          node tools/diagnose-fmc-fallback-cause.mjs p2-budget

      - name: Combined expanded profile
        run: |
          git restore --source=HEAD -- solver-wasm/src/fmc_search.rs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('solver-wasm/src/fmc_search.rs')
          s = p.read_text()
          replacements = {
            'const FMC_MAX_EO_DEPTH: u8 = 5;': 'const FMC_MAX_EO_DEPTH: u8 = 6;',
            'const FMC_EO_LIMIT: usize = 6;': 'const FMC_EO_LIMIT: usize = 24;',
            'const FMC_PM_EO_LIMIT: usize = 3;': 'const FMC_PM_EO_LIMIT: usize = 12;',
            'const FMC_DR_ROUTE_LIMIT: usize = 8;': 'const FMC_DR_ROUTE_LIMIT: usize = 32;',
            'const FMC_DR_SLACK: usize = 3;': 'const FMC_DR_SLACK: usize = 7;',
            'const FMC_RZP_SETUP_DEPTH: u8 = 2;': 'const FMC_RZP_SETUP_DEPTH: u8 = 4;',
            'const FMC_P2_NODE_LIMIT: u64 = 2_000_000;': 'const FMC_P2_NODE_LIMIT: u64 = 20_000_000;',
            'const FMC_PM_P2_NODE_LIMIT: u64 = 500_000;': 'const FMC_PM_P2_NODE_LIMIT: u64 = 5_000_000;',
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing anchor: {old}')
            s = s.replace(old, new)
          p.write_text(s)
          PY
          (cd solver-wasm && wasm-pack build --target web --release --out-dir ../public/solver-wasm)
          node tools/diagnose-fmc-fallback-cause.mjs combined
