name: 4x4 WASM worker boundary

on:
  pull_request:
    paths:
      - "solver444-wasm/**"
      - "solver/solver444.js"
      - "solver/solverWorker.js"
      - "public/solver444-wasm/**"
      - "tools/verify-444-worker-boundary.mjs"
      - ".github/workflows/444-worker-boundary.yml"
  push:
    branches:
      - main
    paths:
      - "solver444-wasm/**"
      - "solver/solver444.js"
      - "solver/solverWorker.js"
      - "public/solver444-wasm/**"
      - "tools/verify-444-worker-boundary.mjs"
      - ".github/workflows/444-worker-boundary.yml"

permissions:
  contents: read

jobs:
  boundary-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: solver444-wasm

      - name: Check Rust formatting
        run: cargo fmt --manifest-path solver444-wasm/Cargo.toml --all -- --check

      - name: Run Rust unit tests
        run: cargo test --manifest-path solver444-wasm/Cargo.toml --lib

      - name: Reject compiler warnings
        run: cargo clippy --manifest-path solver444-wasm/Cargo.toml --lib --tests -- -D warnings

      - name: Validate JavaScript syntax
        run: |
          node --check solver/solver444.js
          node --check solver/solverWorker.js
          node --check tools/verify-444-worker-boundary.mjs

      - name: Install wasm-pack
        shell: bash
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --locked
          fi

      - name: Rebuild 4x4 browser WASM package
        run: wasm-pack build solver444-wasm --target web --out-dir ../target/solver444-wasm-web --out-name solver444_wasm --release

      - name: Verify checked-in 4x4 WASM package
        run: |
          cmp target/solver444-wasm-web/solver444_wasm.js public/solver444-wasm/solver444_wasm.js
          cmp target/solver444-wasm-web/solver444_wasm.d.ts public/solver444-wasm/solver444_wasm.d.ts
          cmp target/solver444-wasm-web/solver444_wasm_bg.wasm public/solver444-wasm/solver444_wasm_bg.wasm
          cmp target/solver444-wasm-web/solver444_wasm_bg.wasm.d.ts public/solver444-wasm/solver444_wasm_bg.wasm.d.ts

      - name: Verify no-fallback worker contract
        run: node tools/verify-444-worker-boundary.mjs

      - name: Validate repository diff
        run: git diff --check
