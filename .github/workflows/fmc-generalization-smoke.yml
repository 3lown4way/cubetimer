name: FMC generalization smoke

on:
  pull_request:
    types: [opened]
    branches:
      - agent/fmc-extreme-independent-frontier-v2

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out benchmark branch
        uses: actions/checkout@v4
        with:
          ref: agent/fmc-extreme-independent-frontier-v2
      - name: Validate harness
        run: |
          node --check tools/benchmark-fmc-generalization.mjs
          python3 -m json.tool tools/fmc-generalization-corpus.json >/dev/null
      - name: Run smoke benchmark
        run: node tools/benchmark-fmc-generalization.mjs --smoke --out /tmp/fmc-generalization-smoke.json
