name: Fix 4x4 center clippy once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-444-center-clippy-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Add narrow clippy allowance
        run: |
          python -c "from pathlib import Path; p=Path('solver444-wasm/src/centers.rs'); s=p.read_text(); old='fn descend_macro_single('; assert old in s; p.write_text(s.replace(old, '#[allow(clippy::too_many_arguments)]\\nfn descend_macro_single(', 1))"
          cargo fmt --manifest-path solver444-wasm/Cargo.toml --all
          cargo clippy --manifest-path solver444-wasm/Cargo.toml --lib --tests -- -D warnings
          cargo test --manifest-path solver444-wasm/Cargo.toml --lib
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solver444-wasm/src/centers.rs
          git commit -m "Fix 4x4 center clippy contract"
          git push origin HEAD:main
