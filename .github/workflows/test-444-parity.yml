name: Probe 4x4 parity normalization

on:
  push:
    branches:
      - agent/444-parity-virtual333
    paths:
      - "solver444-wasm/**"
      - ".github/workflows/test-444-parity.yml"

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/444-parity-virtual333
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add exact re-reduction parity probe
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("solver444-wasm/src/reduction.rs")
          text = path.read_text()
          marker = "\n}\n"
          insert_at = text.rfind(marker)
          probe = r'''

    #[test]
    fn seed_reduction_signatures() {
        fn reduce(seed: &[Move444]) -> ParitySignature {
            let mut state = Cube444::solved();
            state.apply_moves(seed);
            let centers = solve_centers(&state, 0.0).unwrap();
            state.apply_moves(&centers.moves);
            let edges = solve_edges(&state, 0.0).unwrap();
            state.apply_moves(&edges.moves);
            assert!(state.centers_solved());
            assert!(state.edges_paired());
            state.virtual333_state().unwrap().parity_signature()
        }

        let seeds: [(&str, Vec<Move444>); 10] = [
            ("identity", vec![]),
            ("r", vec![mv(Face::R, true, 1), mv(Face::R, false, 3)]),
            ("r-prime", vec![mv(Face::R, true, 3), mv(Face::R, false, 1)]),
            ("r2", vec![mv(Face::R, true, 2), mv(Face::R, false, 2)]),
            ("u", vec![mv(Face::U, true, 1), mv(Face::U, false, 3)]),
            ("u-prime", vec![mv(Face::U, true, 3), mv(Face::U, false, 1)]),
            ("u2", vec![mv(Face::U, true, 2), mv(Face::U, false, 2)]),
            ("r-u", vec![mv(Face::R, true, 1), mv(Face::R, false, 3), mv(Face::U, true, 1), mv(Face::U, false, 3)]),
            ("r-u2", vec![mv(Face::R, true, 1), mv(Face::R, false, 3), mv(Face::U, true, 2), mv(Face::U, false, 2)]),
            ("r2-u", vec![mv(Face::R, true, 2), mv(Face::R, false, 2), mv(Face::U, true, 1), mv(Face::U, false, 3)]),
        ];
        for (name, seed) in seeds {
            println!("seed {name}: {:?}", reduce(&seed));
        }
    }
'''
          path.write_text(text[:insert_at] + probe + text[insert_at:])
          PY
      - name: Format Rust
        run: cargo fmt --manifest-path solver444-wasm/Cargo.toml --all
      - name: Run parity seed probe
        run: cargo test --manifest-path solver444-wasm/Cargo.toml seed_reduction_signatures -- --nocapture
