name: Probe 4x4 parity normalization

on:
  push:
    branches:
      - agent/444-parity-virtual333
    paths:
      - "solver444-wasm/**"
      - ".github/workflows/test-444-parity.yml"

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/444-parity-virtual333
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add random parity correction probe
        run: python -c 'from pathlib import Path; import base64; p=Path("solver444-wasm/src/reduction.rs"); t=p.read_text(); i=t.rfind("\n}\n"); s=base64.b64decode("").decode(); p.write_text(t[:i]+s+t[i:])'
      - name: Format Rust
        run: cargo fmt --manifest-path solver444-wasm/Cargo.toml --all
      - name: Run random parity correction probe
        run: cargo test --manifest-path solver444-wasm/Cargo.toml random_reduction_parity_and_r2_correction -- --nocapture
