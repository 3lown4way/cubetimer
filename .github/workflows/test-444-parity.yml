name: Probe 4x4 parity normalization

on:
  push:
    branches:
      - agent/444-parity-virtual333
    paths:
      - "solver444-wasm/**"
      - ".github/workflows/test-444-parity.yml"

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/444-parity-virtual333
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply fixed-frame OLL parity notation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("solver444-wasm/src/reduction.rs")
          text = path.read_text()
          start = text.index("fn oll_parity_macro() -> Vec<Move444> {")
          end = text.index("\n}\n\nfn pll_parity_macro()", start) + 2
          new = '''fn oll_parity_macro() -> Vec<Move444> {
              // Standard Rw U2 x ... OLL parity algorithm. Whole-cube x is
              // expanded as Rw Lw' and x' restores the fixed color frame.
              vec![
                  mv(Face::R, true, 1),
                  mv(Face::U, false, 2),
                  mv(Face::R, true, 1),
                  mv(Face::L, true, 3),
                  mv(Face::R, true, 1),
                  mv(Face::U, false, 2),
                  mv(Face::R, true, 1),
                  mv(Face::U, false, 2),
                  mv(Face::R, true, 3),
                  mv(Face::U, false, 2),
                  mv(Face::L, true, 1),
                  mv(Face::U, false, 2),
                  mv(Face::R, true, 3),
                  mv(Face::U, false, 2),
                  mv(Face::R, true, 1),
                  mv(Face::U, false, 2),
                  mv(Face::R, true, 3),
                  mv(Face::U, false, 2),
                  mv(Face::R, true, 3),
                  mv(Face::R, true, 3),
                  mv(Face::L, true, 1),
              ]
          }'''
          path.write_text(text[:start] + new + text[end:])
          PY
      - name: Format Rust
        run: cargo fmt --manifest-path solver444-wasm/Cargo.toml --all
      - name: Run parity and reduction tests
        run: cargo test --manifest-path solver444-wasm/Cargo.toml --lib -- --nocapture
      - name: Reject compiler warnings
        run: cargo clippy --manifest-path solver444-wasm/Cargo.toml --lib --tests -- -D warnings
      - name: Commit validated parity model
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver444-wasm/src/reduction.rs solver444-wasm/src/lib.rs
          git commit -m "Validate the 4x4 parity model"
          git push
