name: Probe 4x4 parity normalization

on:
  push:
    branches:
      - agent/444-parity-virtual333

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/444-parity-virtual333
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add PLL generator probe
        run: python -c 'from pathlib import Path; import base64; p=Path("solver444-wasm/src/reduction.rs"); t=p.read_text(); i=t.rfind("\n}\n"); s=base64.b64decode("").decode(); p.write_text(t[:i]+s+t[i:])'
      - name: Format Rust
        run: cargo fmt --manifest-path solver444-wasm/Cargo.toml --all
      - name: Probe PLL generators
        run: cargo test --manifest-path solver444-wasm/Cargo.toml probe_pll_parity_generators -- --nocapture
