name: Probe 4x4 parity normalization

on:
  push:
    branches:
      - agent/444-parity-virtual333
    paths:
      - "solver444-wasm/**"
      - ".github/workflows/test-444-parity.yml"

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/444-parity-virtual333
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply inner-slice parity notation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("solver444-wasm/src/reduction.rs")
          text = path.read_text()
          old = '''fn oll_parity_macro() -> Vec<Move444> {
              vec![
                  mv(Face::R, true, 1),
                  mv(Face::U, false, 2),
                  mv(Face::R, true, 1),
                  mv(Face::U, false, 2),
                  mv(Face::R, true, 3),
                  mv(Face::F, false, 2),
                  mv(Face::R, true, 1),
                  mv(Face::U, false, 2),
                  mv(Face::R, true, 1),
                  mv(Face::U, false, 2),
                  mv(Face::R, true, 3),
                  mv(Face::F, false, 2),
              ]
          }'''
          new = '''fn oll_parity_macro() -> Vec<Move444> {
              // 2R U2 2R U2 2R' F2 2R U2 2R U2 2R' F2, where
              // an inner R turn is expanded as Rw R' and its inverse as Rw' R.
              vec![
                  mv(Face::R, true, 1),
                  mv(Face::R, false, 3),
                  mv(Face::U, false, 2),
                  mv(Face::R, true, 1),
                  mv(Face::R, false, 3),
                  mv(Face::U, false, 2),
                  mv(Face::R, true, 3),
                  mv(Face::R, false, 1),
                  mv(Face::F, false, 2),
                  mv(Face::R, true, 1),
                  mv(Face::R, false, 3),
                  mv(Face::U, false, 2),
                  mv(Face::R, true, 1),
                  mv(Face::R, false, 3),
                  mv(Face::U, false, 2),
                  mv(Face::R, true, 3),
                  mv(Face::R, false, 1),
                  mv(Face::F, false, 2),
              ]
          }'''
          if old not in text:
              raise SystemExit("OLL parity macro target not found")
          path.write_text(text.replace(old, new))
          PY
      - name: Format Rust
        run: cargo fmt --manifest-path solver444-wasm/Cargo.toml --all
      - name: Run parity and reduction tests
        run: cargo test --manifest-path solver444-wasm/Cargo.toml --lib -- --nocapture
      - name: Reject compiler warnings
        run: cargo clippy --manifest-path solver444-wasm/Cargo.toml --lib --tests -- -D warnings
      - name: Commit validated parity model
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver444-wasm/src/reduction.rs solver444-wasm/src/lib.rs
          git commit -m "Validate the 4x4 parity model"
          git push
