name: Probe 4x4 parity normalization

on:
  push:
    branches:
      - agent/444-parity-virtual333
    paths:
      - "solver444-wasm/**"
      - ".github/workflows/test-444-parity.yml"

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/444-parity-virtual333
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Add PLL generator probe
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("solver444-wasm/src/reduction.rs")
          text = path.read_text()
          insert_at = text.rfind("\n}\n")
          probe = r'''

    #[test]
    fn probe_pll_parity_generators() {
        fn inner(face: Face) -> Vec<Move444> {
            vec![mv(face, true, 2), mv(face, false, 2)]
        }
        let mut inner_r_uw = inner(Face::R);
        inner_r_uw.push(mv(Face::U, false, 2));
        inner_r_uw.extend(inner(Face::R));
        inner_r_uw.push(mv(Face::U, true, 2));
        inner_r_uw.extend(inner(Face::R));
        inner_r_uw.push(mv(Face::U, true, 2));

        let wide_r_uw = vec![
            mv(Face::R, true, 2),
            mv(Face::U, false, 2),
            mv(Face::R, true, 2),
            mv(Face::U, true, 2),
            mv(Face::R, true, 2),
            mv(Face::U, true, 2),
        ];

        let mut inner_r_inner_u = inner(Face::R);
        inner_r_inner_u.push(mv(Face::U, false, 2));
        inner_r_inner_u.extend(inner(Face::R));
        inner_r_inner_u.extend(inner(Face::U));
        inner_r_inner_u.extend(inner(Face::R));
        inner_r_inner_u.extend(inner(Face::U));

        for (name, moves) in [
            ("inner-r-uw", inner_r_uw),
            ("wide-r-uw", wide_r_uw),
            ("inner-r-inner-u", inner_r_inner_u),
        ] {
            let mut state = Cube444::solved();
            state.apply_moves(&moves);
            println!(
                "{name}: centers={} paired={} virtual={:?}",
                state.centers_solved(),
                state.edges_paired(),
                state.virtual333_state()
            );
        }
    }
'''
          path.write_text(text[:insert_at] + probe + text[insert_at:])
          PY
      - name: Format Rust
        run: cargo fmt --manifest-path solver444-wasm/Cargo.toml --all
      - name: Probe PLL generators
        run: cargo test --manifest-path solver444-wasm/Cargo.toml probe_pll_parity_generators -- --nocapture
