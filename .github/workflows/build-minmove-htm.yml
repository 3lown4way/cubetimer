name: Build minmove HTM assets

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-minmove-htm-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Apply exact minmove v2 route
        run: node tools/apply-minmove-exact-v2.mjs

      - name: Apply single-pass exact search
        run: node tools/apply-minmove-exact-single-pass.mjs

      - name: Validate source
        run: |
          node --check tools/apply-minmove-exact-v2.mjs
          node --check tools/apply-minmove-exact-single-pass.mjs
          node --check solver/minmoveExactV2.js
          node --check solver/solverWorker.js
          node --check benchmark-minmove-exact-v2.mjs
          cargo fmt --manifest-path solver-wasm/Cargo.toml
          cargo test --manifest-path solver-wasm/Cargo.toml --lib

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build browser WASM
        working-directory: solver-wasm
        run: wasm-pack build --release --target web --out-dir ../public/solver-wasm

      - name: Verify exact minmove corpus
        run: node benchmark-minmove-exact-v2.mjs

      - name: Commit optimized exact solver
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver/solverWorker.js solver-wasm/src/twophase_search.rs
          git add -f \
            public/solver-wasm/solver_wasm.js \
            public/solver-wasm/solver_wasm.d.ts \
            public/solver-wasm/solver_wasm_bg.wasm \
            public/solver-wasm/solver_wasm_bg.wasm.d.ts
          if git diff --cached --quiet; then
            echo "Optimized exact solver already committed"
            exit 0
          fi
          git commit -m "Speed up exact minmove search"
          git push origin "HEAD:${TARGET_BRANCH}"
