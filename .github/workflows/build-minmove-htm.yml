name: Build minmove HTM assets

on:
  push:
    branches:
      - fix/minmove-htm-bundle-loading
    paths:
      - .github/workflows/build-minmove-htm.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-minmove-htm-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Apply minmove deployment changes
        run: |
          node tools/apply-minmove-htm-fix.mjs
          node tools/apply-minmove-builder-bin.mjs

      - name: Validate source changes
        run: |
          node --check solver/minmoveBundleLoader.js
          node --check solver/wasmSolver.js
          node --check solver/solverWorker.js
          node --check benchmark/benchmark-enhanced.js
          node --check benchmark/benchmark.js
          node benchmark-minmove-bundle-loader.mjs
          cargo fmt --manifest-path solver-wasm/Cargo.toml -- --check
          cargo test --manifest-path solver-wasm/Cargo.toml --lib

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Export move convention
        run: node tools/export-minmove-move-data.mjs

      - name: Build minmove v8 tables
        run: cargo run --release --manifest-path solver-wasm/Cargo.toml --bin build_minmove_tables

      - name: Build browser WASM
        working-directory: solver-wasm
        run: wasm-pack build --release --target web --out-dir ../public/solver-wasm

      - name: Split and compress minmove bundle
        run: |
          python3 - <<'PY'
          import gzip
          import json
          import re
          from pathlib import Path

          directory = Path("public/solver-wasm/minmove")
          raw_candidates = sorted(directory.glob("minmove-333-v*.bin"))
          if not raw_candidates:
              raise SystemExit("No generated minmove bundle found")
          raw_path = raw_candidates[-1]
          match = re.fullmatch(r"minmove-333-v(\d+)\.bin", raw_path.name)
          if not match:
              raise SystemExit(f"Unexpected bundle filename: {raw_path.name}")
          version = int(match.group(1))
          prefix = f"minmove-333-v{version}"

          for old in directory.glob("minmove-333-v*.part-*.gz"):
              old.unlink()
          for old in directory.glob("minmove-333-v*.manifest.json"):
              old.unlink()

          chunk_size = 8 * 1024 * 1024
          total_raw = raw_path.stat().st_size
          parts = []
          with raw_path.open("rb") as source:
              index = 0
              while True:
                  raw = source.read(chunk_size)
                  if not raw:
                      break
                  filename = f"{prefix}.part-{index:03d}.gz"
                  compressed = gzip.compress(raw, compresslevel=9, mtime=0)
                  (directory / filename).write_bytes(compressed)
                  parts.append({
                      "file": filename,
                      "compressedBytes": len(compressed),
                      "uncompressedBytes": len(raw),
                  })
                  index += 1

          manifest = {
              "format": "minmove-333-gzip-chunks-v1",
              "bundleVersion": version,
              "uncompressedBytes": total_raw,
              "parts": parts,
          }
          manifest_path = directory / f"{prefix}.manifest.json"
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          raw_path.unlink()
          print(json.dumps({
              "manifest": str(manifest_path),
              "parts": len(parts),
              "rawBytes": total_raw,
              "compressedBytes": sum(part["compressedBytes"] for part in parts),
          }, indent=2))
          PY

      - name: Verify deployed HTM path
        run: |
          node benchmark-minmove-bundle-loader.mjs
          node benchmark-minmove-htm-smoke.mjs

      - name: Commit generated solver and assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f \
            public/solver-wasm/solver_wasm.js \
            public/solver-wasm/solver_wasm.d.ts \
            public/solver-wasm/solver_wasm_bg.wasm \
            public/solver-wasm/solver_wasm_bg.wasm.d.ts \
            public/solver-wasm/minmove/*.manifest.json \
            public/solver-wasm/minmove/*.gz
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Restore deployable minmove HTM solver"
          git push origin "HEAD:${GITHUB_REF_NAME}"
