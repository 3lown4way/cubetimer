name: FMC multi-insertion implementation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: fmc-multi-insertion-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  implement-and-verify:
    if: github.event.pull_request.head.ref == 'agent/fmc-multi-insertion'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Apply production transform
        run: python tools/apply-fmc-multi-insertion.py

      - name: Format Rust
        run: cargo fmt --manifest-path solver-wasm/Cargo.toml

      - name: Run release Rust tests
        run: cargo test --release --manifest-path solver-wasm/Cargo.toml

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Rebuild release WASM
        run: |
          cd solver-wasm
          wasm-pack build --release --target web --out-dir ../public/solver-wasm

      - name: Verify FMC multi-insertion coverage
        run: |
          node --input-type=module <<'NODE'
          import {
            buildFmcTablesWasm,
            solveFmcWasm,
            verifyFmcSolutionWasm,
          } from './solver/wasmSolver.js';

          const scrambles = [
            "R B2 U' L2 D L2 F2 U' B2 F2 L2 F D F2 L B U' B' D' R2",
            "F' R L D B U2 R F2 U2 F2 U R2 U' R2 U' B2 U' R2 F L'",
            "D B2 R2 F D' R F2 L U2 L2 D2 B' R' F U2 B2 L2 B D'",
            "L U' F' R D B R2 F' L2 D' F2 R' D' B2 U' F2 R2 U L'",
            "R' F D' L2 B R D F2 L' B2 D2 R' U' F' D B2 L2 F U2",
            "B D R' F' L' D' R2 B2 U F L D' B' R F2 D R' B2 L2",
            "F' L' B R' D' L' F D' B' L2 D B2 U R' B D2 F' R' U2",
            "R B' L' F' R D B2 L U' R' D2 B R2 F L D B' F' U2 L'",
            "U F2 R L' B D' L' F R' D2 L' F' D2 R2 B2 L2 D' F' U R'",
            "L2 D' B2 F' R' D2 B' L' F' D2 F2 R' U L B D R2 B' L2",
          ];

          if (!(await buildFmcTablesWasm())) throw new Error('FMC_TABLE_BUILD_FAILED');
          const kinds = new Set();
          let multiCandidateCount = 0;
          let surfacedMultiCandidates = 0;
          let totalSolveMs = 0;

          for (const [index, scramble] of scrambles.entries()) {
            const started = performance.now();
            const result = await solveFmcWasm(scramble, {
              maxPremoveSets: 20,
              forceRzp: false,
            });
            totalSolveMs += performance.now() - started;
            if (!result?.ok || !Array.isArray(result.candidates)) {
              throw new Error(`FMC_SOLVE_FAILED:${index}`);
            }
            multiCandidateCount += Number(result.multiInsertionCandidateCount || 0);
            for (const skeleton of result.skeletons || []) kinds.add(String(skeleton.kind || ''));
            for (const candidate of result.candidates) {
              const verification = await verifyFmcSolutionWasm(scramble, candidate.solution);
              if (!verification?.ok || verification.solved !== true) {
                throw new Error(`FMC_INVALID_CANDIDATE:${index}:${candidate.solution}`);
              }
              if (String(candidate.source || '').startsWith('FMC_MULTI_INSERTION_')) {
                surfacedMultiCandidates += 1;
                if (Number(candidate.insertionCount || 0) !== 2 || !Array.isArray(candidate.insertions)) {
                  throw new Error(`BAD_MULTI_DIAGNOSTICS:${index}`);
                }
              }
            }
          }

          for (const kind of ['corner4', 'edge4', 'corner3edge3']) {
            if (!kinds.has(kind)) throw new Error(`MISSING_MULTI_SKELETON_KIND:${kind}`);
          }
          if (multiCandidateCount === 0) throw new Error('NO_MULTI_INSERTION_CANDIDATES');

          console.log(JSON.stringify({
            cases: scrambles.length,
            multiCandidateCount,
            surfacedMultiCandidates,
            skeletonKinds: [...kinds].sort(),
            averageSolveMs: totalSolveMs / scrambles.length,
          }));
          NODE

      - name: Verify human FMC core pipeline
        env:
          FMC_SPEED_RUNS: '4'
          FMC_SPEED_PREMOVE_SETS: '20'
          FMC_SPEED_INSERTION_RUNS: '0'
        run: node benchmark-fmc-speed-identity.mjs

      - name: Verify FMC insertion pipeline
        env:
          FMC_INSERTION_REPEATS: '1'
        run: node benchmark-fmc-insertion-speed-identity.mjs

      - name: Commit generated implementation
        run: |
          if git diff --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add solver-wasm/src/fmc_search.rs solver-wasm/src/lib.rs public/solver-wasm
          git commit -m 'Add FMC multi-insertion search'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
