name: Diagnose FMC premove NISS root

on:
  push:
    branches:
      - fix/fmc-premove-niss-root
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Apply FMC move-order invariants
        run: |
          node tools/apply-fmc-move-order-fix.mjs
          node tools/apply-fmc-p2-orientation-guard.mjs
      - name: Run Rust tests
        working-directory: solver-wasm
        run: cargo test --lib
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build fresh browser WASM
        working-directory: solver-wasm
        run: wasm-pack build --release --target web --out-dir ../public/solver-wasm
      - name: Verify premove NISS candidates at source
        run: node benchmark-fmc-premove-niss-root.mjs
      - name: Commit fixed source and browser WASM
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git add solver-wasm/src/fmc_search.rs public/solver-wasm
          if git diff --cached --quiet; then
            echo "No generated FMC changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix FMC move index ordering"
          git push
