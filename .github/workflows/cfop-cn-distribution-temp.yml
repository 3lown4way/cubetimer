name: Temporary CFOP CN distribution benchmark

on:
  push:
    branches: [main]
    paths:
      - "tools/benchmark-cfop-cn-distribution-temp.mjs"
      - ".github/workflows/cfop-cn-distribution-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run 1000-scramble color-neutral distribution benchmark
        env:
          CN_BENCH_N: 1000
        run: node tools/benchmark-cfop-cn-distribution-temp.mjs
