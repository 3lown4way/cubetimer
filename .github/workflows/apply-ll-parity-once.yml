name: Apply LL parity integration once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-ll-parity-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply integration patch
        run: python tools/apply-ll-parity-once.py
      - name: Validate JavaScript syntax
        run: |
          node --check solver/cfop3x3.js
          node --check solver/solver444.js
          node --check solver/llParity444.js
          node --check tools/verify-444-worker-boundary.mjs
          node --check tools/verify-444-public-notation.mjs
          node --check tools/verify-444-ll-parity.mjs
      - name: Verify LL parity module
        run: node tools/verify-444-ll-parity.mjs
      - name: Verify 4x4 worker boundary
        run: node tools/verify-444-worker-boundary.mjs
      - name: Verify public WCA notation
        run: node tools/verify-444-public-notation.mjs
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solver/cfop3x3.js solver/solver444.js tools/verify-444-worker-boundary.mjs tools/verify-444-public-notation.mjs .github/workflows/444-worker-boundary.yml
          git commit -m "Handle 4x4 parity during last layer"
          git push origin HEAD:main
