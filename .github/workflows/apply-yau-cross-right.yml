name: Apply Yau cross-right presentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-yau-cross-right.yml"
      - "tools/apply-yau-cross-right.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Calibrate patch for post-canonical physical frame
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply-yau-cross-right.py')
          s = p.read_text()
          s = s.replace(
              '(entry) => entry.map.B === normalizedCross && entry.map.F === opposite,',
              '(entry) => entry.map.R === normalizedCross && entry.map.L === opposite,',
              1,
          )
          s = s.replace(
              '// The view-map convention is inverse to the rendered cube rotation here:\n    // map.B = cross places the selected cross-colored center on visible R.',
              '// Presentation is applied after canonical mapping, so map.R is the visible R face.',
              1,
          )
          p.write_text(s)
          PY
      - name: Apply cross-right patch
        run: python tools/apply-yau-cross-right.py
      - name: Remove stage-boundary grip resets
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path('solver/solver444.js')
          s = p.read_text()
          pattern = r'''async function humanizeMappedYauStages444\(publicScramble, sourceStages, crossColor\) \{.*?\n\}\n\nfunction simplifyCfop444OuterMoves'''
          replacement = r'''async function humanizeMappedYauStages444(publicScramble, sourceStages, crossColor) {
            const baselineStages = structuredClone(Array.isArray(sourceStages) ? sourceStages : []);
            const stages = structuredClone(baselineStages);
            const fallback = () => ({
              stages: baselineStages,
              humanViewpointApplied: false,
              viewpointRotationCount: 0,
              yauHumanGripApplied: false,
              yauViewpointRotationCount: 0,
            });
            try {
              const centerStage = stages.find((stage) => stage?.id === "centers");
              const edgeStage = stages.find((stage) => stage?.id === "edges");
              const cfopStage = stages.find((stage) => stage?.id === "threeByThree");
              if (!centerStage?.segments?.length || !edgeStage?.segments?.length || !cfopStage?.segments?.length) {
                return fallback();
              }

              const normalizedCross = /^[URFDLB]$/.test(String(crossColor || "")) ? String(crossColor) : "D";
              const opposite = OPPOSITE_FACE_444[normalizedCross];
              const firstCenterCandidates = VIEW_ORIENTATIONS_444.filter(
                (entry) => entry.map.U === normalizedCross,
              );
              const oppositeCenterCandidates = VIEW_ORIENTATIONS_444.filter(
                (entry) => entry.map.D === normalizedCross && entry.map.U === opposite,
              );
              const crossRightCandidates = VIEW_ORIENTATIONS_444.filter(
                (entry) => entry.map.R === normalizedCross && entry.map.L === opposite,
              );
              const crossDownCandidates = VIEW_ORIENTATIONS_444.filter(
                (entry) => entry.map.D === normalizedCross && entry.map.U === opposite,
              );
              const cfopCrossDownCandidates = VIEW_ORIENTATIONS_444.filter(
                (entry) => entry.map.D === normalizedCross,
              );

              const combinedSegments = [];
              const candidateSets = [];
              for (let index = 0; index < centerStage.segments.length; index += 1) {
                combinedSegments.push(centerStage.segments[index]);
                if (index === 0) candidateSets.push(firstCenterCandidates);
                else if (index === 1) candidateSets.push(oppositeCenterCandidates);
                else if (index === 2 || index === 3) candidateSets.push(crossRightCandidates);
                else candidateSets.push(crossDownCandidates);
              }
              const centerCount = combinedSegments.length;

              for (const segment of edgeStage.segments) {
                combinedSegments.push(segment);
                candidateSets.push(crossDownCandidates);
              }
              const edgeCount = combinedSegments.length - centerCount;

              for (const segment of cfopStage.segments) {
                combinedSegments.push(segment);
                candidateSets.push(cfopCrossDownCandidates);
              }

              const human = humanizeAbsoluteSegments444(combinedSegments, candidateSets);
              if (!human?.segments?.length || human.segments.length !== combinedSegments.length) return fallback();

              let cursor = 0;
              centerStage.segments = human.segments.slice(cursor, cursor + centerCount);
              cursor += centerCount;
              edgeStage.segments = human.segments.slice(cursor, cursor + edgeCount);
              cursor += edgeCount;
              cfopStage.segments = human.segments.slice(cursor);
              for (const stage of [centerStage, edgeStage, cfopStage]) {
                stage.solution = stage.segments.map((segment) => segment.solution).filter(Boolean).join(" ");
              }

              const baselineFlat = [{
                solution: baselineStages.map((stage) => String(stage?.solution || "").trim()).filter(Boolean).join(" "),
              }];
              const candidateFlat = [{
                solution: stages.map((stage) => String(stage?.solution || "").trim()).filter(Boolean).join(" "),
              }];
              const verified = await verifyEquivalent444Presentation(publicScramble, baselineFlat, candidateFlat);
              if (!verified) return fallback();

              const yauSegmentCount = centerCount + edgeCount;
              const yauViewpointRotationCount = human.segments
                .slice(0, yauSegmentCount)
                .reduce((sum, segment) => sum + (Number(segment?.viewpointRotations) || 0), 0);
              return {
                stages,
                humanViewpointApplied: human.rotationCount > 0,
                viewpointRotationCount: human.rotationCount,
                yauHumanGripApplied: yauViewpointRotationCount > 0,
                yauViewpointRotationCount,
              };
            } catch (_) {
              return fallback();
            }
          }

          function simplifyCfop444OuterMoves'''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'unified grip helper replacement count={n}')
          p.write_text(s2)
          PY
      - name: Syntax check
        run: |
          node --check solver/solver444.js
          node --check tools/verify-444-yau.mjs
      - name: Measure presentation rotations
        run: |
          node --input-type=module <<'JS'
          import { solve444 } from './solver/solver444.js';
          const cases = [
            ["D", "Rw U2 F' Lw D B2"],
            ["F", "Uw2 Rw F2 Dw' L B' Rw2 U Fw' D2 Lw B2"],
          ];
          for (const [crossColor, scramble] of cases) {
            const result = await solve444(scramble, null, { method444: 'yau', crossColor, deadlineTs: Date.now() + 60000 });
            console.log('ROTATION_DIAG', crossColor, 'ok=', result.ok, 'view=', result.meta?.viewpointRotationCount, 'yau=', result.meta?.yauViewpointRotationCount, 'frame=', result.meta?.yauFrameSpin);
            for (const stage of result.stages || []) {
              console.log('STAGE', crossColor, stage.id, (stage.segments || []).map(s => `${s.name}:${s.viewpointRotations ?? 0}`).join('|'));
            }
          }
          JS
      - name: Verify Yau regressions
        run: |
          node tools/verify-444-yau.mjs
          node tools/verify-444-edge-323.mjs
          node tools/verify-444-public-notation.mjs
          git diff --check
      - name: Commit implementation
        run: |
          rm -f tools/apply-yau-cross-right.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solver/solver444.js tools/verify-444-yau.mjs tools/apply-yau-cross-right.py
          git commit -m "Keep Yau 3-cross on the right face"
          git push origin HEAD:main
