name: Apply Yau cross-right presentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-yau-cross-right.yml"
      - "tools/apply-yau-cross-right.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Calibrate patch for post-canonical physical frame
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/apply-yau-cross-right.py')
          s = p.read_text()
          s = s.replace(
              '(entry) => entry.map.B === normalizedCross && entry.map.F === opposite,',
              '(entry) => entry.map.R === normalizedCross && entry.map.L === opposite,',
              1,
          )
          s = s.replace(
              '// The view-map convention is inverse to the rendered cube rotation here:\n    // map.B = cross places the selected cross-colored center on visible R.',
              '// Presentation is applied after canonical mapping, so map.R is the visible R face.',
              1,
          )
          p.write_text(s)
          PY
      - name: Apply cross-right patch
        run: python tools/apply-yau-cross-right.py
      - name: Keep one cross-down grip through Yau 3-2-3
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path('solver/solver444.js')
          s = p.read_text()
          pattern = r'''function buildHumanYauEdgePresentation444\(segments, crossColor\) \{.*?\n\}\n\nfunction buildHumanYawPresentation444'''
          replacement = r'''function buildHumanYauEdgePresentation444(segments, crossColor) {
            if (!Array.isArray(segments) || !segments.length) return null;
            const normalizedCross = /^[URFDLB]$/.test(String(crossColor || "")) ? String(crossColor) : "D";
            const opposite = OPPOSITE_FACE_444[normalizedCross];
            const crossDownCandidates = VIEW_ORIENTATIONS_444.filter(
              (entry) => entry.map.D === normalizedCross && entry.map.U === opposite,
            );

            // During Yau 3-2-3 a speedsolver normally keeps the completed cross
            // down and changes only the yaw when it is actually useful.  The old
            // per-segment DP could bounce between several cross-down y-views,
            // producing artificial regrips.  Pick one cross-down yaw for the
            // whole edge stage, then restore the public frame once at the end.
            let best = null;
            for (const candidate of crossDownCandidates) {
              const human = humanizeAbsoluteSegments444(
                segments,
                segments.map(() => [candidate]),
              );
              if (!human?.segments?.length) continue;
              const tokenCount = human.segments.reduce(
                (sum, segment) => sum + splitAlgorithm(segment?.solution).length,
                0,
              );
              const score = human.rotationCount * 100000 + tokenCount;
              if (!best || score < best.score) best = { ...human, score };
            }
            return best ? { segments: best.segments, rotationCount: best.rotationCount } : null;
          }

          function buildHumanYawPresentation444'''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Yau edge presentation replacement count={n}')
          p.write_text(s2)
          PY
      - name: Syntax check
        run: |
          node --check solver/solver444.js
          node --check tools/verify-444-yau.mjs
      - name: Measure presentation rotations
        run: |
          node --input-type=module <<'JS'
          import { solve444 } from './solver/solver444.js';
          const cases = [
            ["D", "Rw U2 F' Lw D B2"],
            ["F", "Uw2 Rw F2 Dw' L B' Rw2 U Fw' D2 Lw B2"],
          ];
          for (const [crossColor, scramble] of cases) {
            const result = await solve444(scramble, null, { method444: 'yau', crossColor, deadlineTs: Date.now() + 60000 });
            console.log('ROTATION_DIAG', crossColor, 'ok=', result.ok, 'view=', result.meta?.viewpointRotationCount, 'yau=', result.meta?.yauViewpointRotationCount, 'frame=', result.meta?.yauFrameSpin);
            for (const stage of result.stages || []) {
              console.log('STAGE', crossColor, stage.id, (stage.segments || []).map(s => `${s.name}:${s.viewpointRotations ?? 0}`).join('|'));
            }
          }
          JS
      - name: Verify Yau regressions
        run: |
          node tools/verify-444-yau.mjs
          node tools/verify-444-edge-323.mjs
          node tools/verify-444-public-notation.mjs
          git diff --check
      - name: Commit implementation
        run: |
          rm -f tools/apply-yau-cross-right.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solver/solver444.js tools/verify-444-yau.mjs tools/apply-yau-cross-right.py
          git commit -m "Keep Yau 3-cross on the right face"
          git push origin HEAD:main
