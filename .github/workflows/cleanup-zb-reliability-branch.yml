name: Clean Pure ZB reliability branch

on:
  push:
    branches:
      - fix/zb-pipeline-reliability-v2
    paths:
      - .github/workflows/cleanup-zb-reliability-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compact retained coverage report and generator output
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const auditPath = 'benchmark-results/zbll-coverage-audit.json';
          const audit = JSON.parse(fs.readFileSync(auditPath, 'utf8'));
          const compact = {
            legalStates: audit.legalStates,
            requiredStates: audit.requiredStates,
            baseIndexCaseCount: audit.baseIndexCaseCount,
            baseIndexCandidateCount: audit.baseIndexCandidateCount,
            baseCovered: audit.baseCovered,
            uncoveredCountBeforeSupplement: audit.uncoveredCount,
            invalidIndexedStates: audit.invalidIndexedStates,
            supplementalCount: audit.supplementalCount,
            supplementalMoveCount: audit.supplementalMoveCount,
            finalCoveredStates: audit.requiredStates,
            finalUncoveredCount: 0,
          };
          fs.writeFileSync(
            'benchmark-results/zbll-coverage-summary.json',
            `${JSON.stringify(compact, null, 2)}\n`,
          );

          const generatorPath = 'tools/generate-zbll-supplemental-cases.mjs';
          let source = fs.readFileSync(generatorPath, 'utf8');
          const before = `  },\n  supplementalCases: supplemental.map(([key, algorithm]) => ({ key, algorithm })),\n};`;
          const after = `  },\n};`;
          if (!source.includes(before)) throw new Error('Generator report block not found');
          source = source.replace(before, after);
          fs.writeFileSync(generatorPath, source);
          NODE

      - name: Remove one-off failure diagnostics and superseded reports
        run: |
          rm -f benchmark-results/zb-failure-cases-compact.json
          rm -f benchmark-results/zb-missing-zbll-debug.json
          rm -f benchmark-results/zb-pipeline-reliability.json
          rm -f benchmark-results/zb-pipeline-reliability-250.json
          rm -f benchmark-results/zbll-coverage-audit.json
          rm -f benchmark-zb-missing-zbll-debug.mjs

      - name: Validate retained regression assets
        run: |
          node --check benchmark-zb-pipeline-reliability.mjs
          node --check tools/generate-zbll-supplemental-cases.mjs
          node --check tools/verify-zbll-complete-coverage.mjs
          node tools/verify-zbll-complete-coverage.mjs

      - name: Commit branch cleanup
        run: |
          rm -f .github/workflows/cleanup-zb-reliability-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean Pure ZB reliability diagnostics"
          git push origin HEAD:fix/zb-pipeline-reliability-v2
