name: Refine Yau ergonomics

on:
  push:
    branches: [main]
    paths:
      - "tools/refine-yau-cross4-v3.py"
      - ".github/workflows/refine-yau-ergonomics.yml"

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply one-cycle Cross 4
        run: python tools/refine-yau-cross4-v3.py
      - name: Syntax check
        run: |
          node --check solver/solver444.js
          node --check solver/edgePairing444.js
          git diff --check
      - name: Verify 4x4 contracts
        run: |
          node tools/verify-444-yau.mjs
          node tools/verify-444-edge-323.mjs
          node tools/verify-444-public-notation.mjs
      - name: Run ergonomics diagnostic
        run: node tools/diag-yau-ergonomics.mjs
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver/edgePairing444.js
          git commit -m "Solve Yau Cross 4 in one slice cycle"
          git push origin HEAD:main
