name: FMC skeleton beam validation

on:
  push:
    branches:
      - agent/fmc-skeleton-beam

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[fmc-skeleton-built]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fmc-skeleton-beam
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: taiki-e/install-action@wasm-pack

      - name: Preserve baseline WASM
        run: cp -a public/solver-wasm /tmp/fmc-baseline

      - name: Apply skeleton beam implementation
        run: python .github/scripts/apply_fmc_skeleton_beam.py

      - name: Format and test Rust
        run: |
          cargo fmt --manifest-path solver-wasm/Cargo.toml
          cargo test --manifest-path solver-wasm/Cargo.toml --release

      - name: Build release WASM
        working-directory: solver-wasm
        run: wasm-pack build --release --target web --out-dir ../public/solver-wasm

      - name: Verify solution identity, skeleton schema, and overhead
        run: |
          cat > /tmp/validate-fmc-skeletons.mjs <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          import { performance } from 'node:perf_hooks';

          async function load(dir) {
            const mod = await import(pathToFileURL(`${dir}/solver_wasm.js`).href);
            await mod.default(fs.readFileSync(`${dir}/solver_wasm_bg.wasm`));
            mod.load_twophase_333_bundle(
              fs.readFileSync('public/solver-wasm/twophase/twophase-333-v1.bin')
            );
            const built = JSON.parse(mod.build_fmc_tables_wasm());
            if (!built.ok) throw new Error(`FMC table build failed: ${JSON.stringify(built)}`);
            return mod;
          }

          const baseline = await load('/tmp/fmc-baseline');
          const current = await load(`${process.cwd()}/public/solver-wasm`);
          const scrambles = [
            "R U R' U' F2 D L2 B' U2 R2 F D' R' B2 U L' U2 F' D2 R",
            "F R2 U' B2 D L2 U F' D2 R B' U2 L' F2 D' R2 U B L2 U'",
            "U2 R F2 L' D2 B U' R2 F' L2 D B2 U R' D' F2 U2 L B' R2",
            "L2 U B2 R' D F2 U2 L' B R2 D2 F' U R B2 D' L F2 U' R2",
            "B' U2 L2 D R F2 U' B2 L D2 R' F U2 L' D' B R2 U F' D2",
            "D R2 F' U2 L B2 D' R U F2 L2 B' D2 R' U' F L' U2 B2 R",
            "R2 D' B U L2 F' R U2 B2 D L' F2 U' R' D2 B' L U F2 R2",
            "F2 L U' R2 B D2 F' U L2 D' R B2 U2 F L' D R2 B' U' L2",
            "U R2 B' D2 L F2 U' R B2 D F' L2 U2 R' B D' F2 L' U R2",
            "B2 D L' U2 F R2 D' B U L2 F' R' D2 U B2 L F2 U' R2 D",
            "L' F2 U R2 D B' L2 U2 F R' D2 B2 U' L F' D R2 U B2 L'",
            "R U2 F' L2 D B2 R' U F2 D2 L B' U2 R2 F D' L' B U' F2",
            "D2 B R' U F2 L2 D' R2 B' U2 L F D2 U' R B2 L' F2 U R'",
            "F' U L2 B2 D R' F2 U2 L' B D2 R U' F L2 D' B' R2 U F2",
            "U2 L F' R2 D B2 U' L2 F D2 R' B U R2 D' F2 L' B' U R",
            "R2 B U' L2 D F2 R' U2 B2 L D' F U R2 B' D2 L' F2 U' R",
            "B L2 U2 F' D R2 B' U L F2 D2 R' U' B2 L' D F R2 U2 L",
            "L2 D' R B2 U F' L U2 R2 D B' F2 U' L' D2 R F U B2 R'",
            "F2 R' D U2 B L2 F' R2 U B2 D' L U' F R D2 B' L2 U2 F2",
            "U B2 L' D2 F R2 U' B D L2 F' R U2 B' D' L F2 R2 U L'"
          ];
          const options = JSON.stringify({ maxPremoveSets: 80, forceRzp: false });
          const oldTimes = [];
          const newTimes = [];
          let totalSkeletons = 0;
          const kinds = new Set();

          for (const scramble of scrambles) {
            let t = performance.now();
            const oldResult = JSON.parse(baseline.solve_fmc_wasm(scramble, options));
            oldTimes.push(performance.now() - t);

            t = performance.now();
            const newResult = JSON.parse(current.solve_fmc_wasm(scramble, options));
            newTimes.push(performance.now() - t);

            if (!oldResult.ok || !newResult.ok) throw new Error(`solve failed for ${scramble}`);
            const oldComparable = {
              solution: oldResult.solution,
              moveCount: oldResult.moveCount,
              candidates: oldResult.candidates,
            };
            const newComparable = {
              solution: newResult.solution,
              moveCount: newResult.moveCount,
              candidates: newResult.candidates,
            };
            if (JSON.stringify(oldComparable) !== JSON.stringify(newComparable)) {
              throw new Error(`complete-solution identity changed for ${scramble}`);
            }
            if (newResult.skeletonCount !== newResult.skeletons.length) {
              throw new Error('skeletonCount mismatch');
            }
            if (newResult.skeletons.length > 24) throw new Error('skeleton beam overflow');
            for (const skeleton of newResult.skeletons) {
              if (!['corner3', 'edge3'].includes(skeleton.kind)) throw new Error('bad skeleton kind');
              if (!Array.isArray(skeleton.defectPositions) || skeleton.defectPositions.length !== 3) {
                throw new Error('bad defect positions');
              }
              if (skeleton.moveCount !== skeleton.solution.trim().split(/\s+/).filter(Boolean).length) {
                throw new Error('skeleton move count mismatch');
              }
              kinds.add(skeleton.kind);
            }
            totalSkeletons += newResult.skeletons.length;
          }

          const avg = xs => xs.reduce((a, b) => a + b, 0) / xs.length;
          const oldAvg = avg(oldTimes);
          const newAvg = avg(newTimes);
          const ratio = newAvg / oldAvg;
          console.log(JSON.stringify({ oldAvg, newAvg, ratio, totalSkeletons, kinds: [...kinds] }));
          if (totalSkeletons === 0) throw new Error('no real skeleton candidates were collected');
          if (ratio > 1.20) throw new Error(`runtime overhead too high: ${ratio.toFixed(3)}x`);
          NODE
          node /tmp/validate-fmc-skeletons.mjs | tee /tmp/fmc-skeleton-validation.json

      - name: Remove temporary workflow machinery and commit outputs
        run: |
          rm -f .github/scripts/apply_fmc_skeleton_beam.py .github/workflows/fmc-skeleton-beam.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add FMC skeleton candidate beam [fmc-skeleton-built]"
          git push origin HEAD:agent/fmc-skeleton-beam
