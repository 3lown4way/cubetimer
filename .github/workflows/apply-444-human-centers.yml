name: Apply verified 4x4 human center order

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-444-human-centers.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solver444-wasm
      - name: Patch human 4x4 solve
        run: |
          python tools/apply-444-human-viewpoint.py
          python tools/apply-444-human-viewpoint-v2.py
          python tools/apply-444-edge-323-v2.py
          python tools/apply-444-edge-323-v3.py
          python tools/apply-444-edge-diagnostics.py
          cargo fmt --manifest-path solver444-wasm/Cargo.toml --all
          node --check solver/solver444.js
          node --check solver/solverWorker.js
          node --check solver/edgePairing444.js
          node --check tools/verify-444-worker-boundary.mjs
          node --check tools/verify-444-public-notation.mjs
          node --check tools/verify-444-edge-323.mjs
          cargo test --manifest-path solver444-wasm/Cargo.toml --lib
      - name: Rebuild browser 4x4 WASM
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --locked
          fi
          rm -rf public/solver444-wasm
          wasm-pack build solver444-wasm --target web --out-dir ../public/solver444-wasm --out-name solver444_wasm --release
      - name: Verify complete browser pipeline
        run: |
          node tools/verify-444-edge-323.mjs
          node tools/verify-444-worker-boundary.mjs
          node tools/verify-444-public-notation.mjs
          git diff --check
      - name: Commit verified change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solver444-wasm/src/centers.rs solver444-wasm/src/api.rs solver/solver444.js solver/edgePairing444.js tools/verify-444-worker-boundary.mjs tools/verify-444-public-notation.mjs tools/verify-444-edge-323.mjs public/solver444-wasm
          git commit -m "Humanize 4x4 centers viewpoints and 3-2-3 banks"
          git push origin HEAD:main
      # intended 3-2-3 groups only
