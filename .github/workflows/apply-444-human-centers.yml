name: Apply verified 4x4 human center order

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-444-human-centers.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch and verify
        run: |
          python tools/apply-444-human-centers.py
          cargo fmt --manifest-path solver444-wasm/Cargo.toml --all
          node --check solver/solver444.js
          node --check solver/solverWorker.js
          cargo test --manifest-path solver444-wasm/Cargo.toml --lib
          node tools/verify-444-worker-boundary.mjs
          node tools/verify-444-public-notation.mjs
          git diff --check
      - name: Commit verified change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solver444-wasm/src/centers.rs solver444-wasm/src/lib.rs solver444-wasm/src/api.rs solver/solver444.js solver/solverWorker.js
          git commit -m "Use selected cross color for 4x4 center order"
          git push origin HEAD:main
