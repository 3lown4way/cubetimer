name: Record reserved FMC Extreme benchmark

on:
  pull_request:
    branches:
      - agent/fmc-extreme-independent-frontier-v2
    types: [opened]

permissions:
  contents: write

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: agent/fmc-extreme-independent-frontier-v2
          fetch-depth: 0

      - name: Run benchmark and record result
        run: |
          cat > /tmp/fmc-reserved-record.mjs <<'NODE'
          import fs from "node:fs";
          import { performance } from "node:perf_hooks";
          import { solveWithFMCSearch } from "${{ github.workspace }}/solver/fmcSolver.js";

          const scramble = "U R2 U' R B D R B' R' B2 U' F' D' R F' L' B L2 F R D";
          const started = performance.now();
          const result = await solveWithFMCSearch(scramble, null, {
            qualityMode: "extreme",
            targetMoveCount: 20,
            timeBudgetMs: 30000,
            maxPremoveSets: 180,
            extremeVariantCount: 8,
            extremeReservedCompressionPremoves: 48,
            continueBelowTarget: true,
            insertionTimeMs: 6000,
            verifyLimit: 64,
          });
          const diagnostics = result?.performanceDiagnostics || {};
          const output = {
            scramble,
            elapsedMs: Math.round(performance.now() - started),
            ok: result?.ok === true,
            reason: result?.reason || null,
            moveCount: result?.moveCount ?? result?.bestHumanMoveCount ?? null,
            solution: result?.solution || result?.bestHumanSolution || null,
            source: result?.source || result?.bestHumanSource || null,
            qualityTarget: result?.qualityTarget ?? null,
            qualityTargetReached: result?.qualityTargetReached === true,
            isolation: diagnostics.extremeIsolation || null,
            stages: diagnostics.wasmStages || [],
            stageBuckets: diagnostics.extremeStageCandidateBuckets || [],
            candidateCounts: diagnostics.candidateCounts || null,
            bestHumanStages: result?.stages || result?.bestHumanStages || [],
          };
          const reserved = output.stages.find((stage) => stage.reservedCompression === true);
          if (!reserved || reserved.multiInsertion !== true) {
            throw new Error("RESERVED_COMPRESSION_STAGE_MISSING");
          }
          fs.writeFileSync("tools/fmc-reserved-benchmark-result.json", JSON.stringify(output, null, 2));
          console.log(JSON.stringify(output));
          NODE
          node /tmp/fmc-reserved-record.mjs

      - name: Commit benchmark result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/fmc-extreme-reserved-benchmark.yml
          git add tools/fmc-reserved-benchmark-result.json
          git commit -m "Record reserved FMC Extreme benchmark"
          git push origin HEAD:agent/fmc-extreme-independent-frontier-v2
