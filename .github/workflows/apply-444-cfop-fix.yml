name: Apply verified 4x4 CFOP fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-444-cfop-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and verify fix
        shell: bash
        run: |
          cat > /tmp/444fix.patch <<'PATCH'
