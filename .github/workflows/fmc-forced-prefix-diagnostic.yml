name: FMC WR16 multi-switch diagnostic

on:
  pull_request:
    types: [opened]
    branches:
      - agent/fmc-extreme-independent-frontier-v2

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fmc-extreme-independent-frontier-v2

      - name: Inject complementary-frame multi-switch test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('solver-wasm/src/fmc_search.rs')
          text = path.read_text()
          replacement = '''const FMC_FRAME_COUNT: usize = 6;
          const AXIS_SCRAMBLE_MAPS_JS: [[u8; 6]; FMC_FRAME_COUNT] = [
              [0, 1, 2, 3, 4, 5],
              [5, 4, 2, 3, 0, 1],
              [2, 3, 1, 0, 4, 5],
              [0, 1, 4, 5, 3, 2],
              [2, 3, 4, 5, 0, 1],
              [4, 5, 0, 1, 2, 3],
          ];
          const AXIS_SOLUTION_MAPS_JS: [[u8; 6]; FMC_FRAME_COUNT] = [
              [0, 1, 2, 3, 4, 5],
              [4, 5, 2, 3, 1, 0],
              [3, 2, 0, 1, 4, 5],
              [0, 1, 5, 4, 2, 3],
              [4, 5, 0, 1, 2, 3],
              [2, 3, 4, 5, 0, 1],
          ];
          const AXIS_NAMES: [&str; FMC_FRAME_COUNT] = [
              "UD", "FB", "RL", "UD_EO_RL", "FB_EO_RL", "RL_EO_UD",
          ];'''.replace('          ', '')
          pattern = re.compile(
              r'/// Axis scramble maps in JS face convention\..*?const AXIS_NAMES: \[&str; 3\] = \["UD", "FB", "RL"\];',
              re.S,
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'axis replacement count={count}')
          for old, new in [
              ('pub axis_scramble_move_map: [[u8; 18]; 3],', 'pub axis_scramble_move_map: [[u8; 18]; FMC_FRAME_COUNT],'),
              ('pub axis_solution_move_map: [[u8; 18]; 3],', 'pub axis_solution_move_map: [[u8; 18]; FMC_FRAME_COUNT],'),
              ('let mut axis_scramble_move_map = [[0u8; 18]; 3];\n    let mut axis_solution_move_map = [[0u8; 18]; 3];\n    for i in 0..3 {', 'let mut axis_scramble_move_map = [[0u8; 18]; FMC_FRAME_COUNT];\n    let mut axis_solution_move_map = [[0u8; 18]; FMC_FRAME_COUNT];\n    for i in 0..FMC_FRAME_COUNT {'),
          ]:
              if old not in text:
                  raise SystemExit(f'missing anchor: {old[:50]}')
              text = text.replace(old, new, 1)

          text += r'''

          #[cfg(test)]
          mod wr16_multi_switch_diagnostic {
              use super::*;
              use crate::twophase_bundle::load_bundle as load_twophase_bundle;

              #[test]
              fn wr16_complementary_frame_multi_switch() {
                  let bundle_path = "public/solver-wasm/twophase/twophase-333-v1.bin";
                  let bytes = std::fs::read(bundle_path)
                      .or_else(|_| std::fs::read(format!("../{bundle_path}")))
                      .expect("twophase bundle");
                  let tables = load_twophase_bundle(&bytes).expect("load bundle");
                  let fmc_tables = build_fmc_tables(&tables);
                  let scramble = parse_scramble(
                      "R' U' F D2 L2 F R2 U2 R2 B D2 L B2 D' B2 L' R' B D2 B U2 L U2 R' U' F",
                      &tables.move_data,
                  ).expect("scramble");
                  let known_inverse = parse_scramble(
                      "U D' F R L2 F' B2 D' R2 D' L2 F U2 D2 F D2",
                      &tables.move_data,
                  ).expect("known inverse solution");
                  let axis = 3usize;
                  let map = &fmc_tables.axis_scramble_move_map[axis];
                  let inverse_scramble = invert_moves(&scramble);
                  let mapped_scramble: Vec<u8> = inverse_scramble
                      .iter().map(|&m| map[m as usize]).collect();
                  let mapped_known: Vec<u8> = known_inverse
                      .iter().map(|&m| map[m as usize]).collect();
                  let state = CubeState::solved().apply_moves(&mapped_scramble, &tables.move_data);
                  assert!(state.apply_moves(&mapped_known, &tables.move_data).is_solved());

                  let mut cache = FmcP2Cache::default();
                  let mut ceiling = 34usize;
                  let results = solve_multi_switch_niss_single_axis(
                      &state,
                      &tables,
                      &fmc_tables,
                      5,
                      &mut cache,
                      &mut ceiling,
                      false,
                      true,
                  );
                  let report = serde_json::json!({
                      "count": results.len(),
                      "ceiling": ceiling,
                      "lengths": results.iter().map(|result| result.moves.len()).collect::<Vec<_>>(),
                      "stages": results.iter().map(|result| result.stage_tag).collect::<Vec<_>>(),
                      "exactRank": results.iter().position(|result| result.moves == mapped_known),
                      "solutions": results.iter().map(|result| solution_string_from_path(&result.moves, &tables.move_data)).collect::<Vec<_>>(),
                  });
                  println!("WR16_MULTI_SWITCH_DIAGNOSTIC {}", report);
                  assert!(results.iter().any(|result| result.moves == mapped_known));
              }
          }
          '''
          path.write_text(text)
          PY
          rustfmt solver-wasm/src/fmc_search.rs

      - name: Run multi-switch diagnostic
        run: cargo test --release --manifest-path solver-wasm/Cargo.toml wr16_complementary_frame_multi_switch -- --nocapture
