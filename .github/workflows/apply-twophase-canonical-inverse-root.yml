name: Apply Two-Phase canonical inverse root fix

on:
  push:
    branches:
      - main
    paths:
      - "tools/apply-twophase-canonical-inverse-root.mjs"
      - ".github/workflows/apply-twophase-canonical-inverse-root.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Apply source patch
        run: node tools/apply-twophase-canonical-inverse-root.mjs
      - name: Format and test Rust
        working-directory: solver-wasm
        run: |
          cargo fmt
          cargo test --lib
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Rebuild browser WASM
        working-directory: solver-wasm
        run: wasm-pack build --release --target web --out-dir ../public/solver-wasm
      - name: Verify canonical inverse regression and reliability
        run: node benchmark-twophase-nontrivial-reliability.mjs
      - name: Commit root fix and rebuilt WASM
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver-wasm/src/twophase_search.rs benchmark-twophase-nontrivial-reliability.mjs public/solver-wasm
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Canonicalize Two-Phase phase-boundary candidates"
            git push
          fi
