name: FMC HTR skeleton validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch HTR transform matching
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/apply-fmc-htr-skeletons.py')
          text = path.read_text()
          text = text.replace('from pathlib import Path\n', 'from pathlib import Path\nimport re\n', 1)

          call_needle = '''fmc = fmc.replace(
              "            force_rzp,\\n        );",
              "            force_rzp,\\n            enable_htr_skeletons,\\n        );",
          )
          if fmc.count("enable_htr_skeletons,\\n        );") != 4:
              raise SystemExit("expected four solve_fmc_single_axis HTR arguments")'''
          call_replacement = '''fmc = fmc.replace(
              "            force_rzp,\\n        );",
              "            force_rzp,\\n            enable_htr_skeletons,\\n        );",
          )
          fmc = fmc.replace(
              "                    force_rzp,\\n                );",
              "                    force_rzp,\\n                    enable_htr_skeletons,\\n                );",
          )
          if fmc.count("enable_htr_skeletons,") < 5:
              raise SystemExit("expected solve_fmc signature plus four HTR call arguments")'''
          if call_needle not in text:
              raise SystemExit('HTR call transform patch anchor missing')
          text = text.replace(call_needle, call_replacement, 1)

          tag_needle = '''fmc = replace_once(fmc, markers[0][0], markers[0][0] + markers[0][1], "direct source tag")'''
          tag_replacement = '''if markers[0][0] not in fmc:
              raise SystemExit("direct source tag anchor missing")
          fmc = fmc.replace(markers[0][0], markers[0][0] + markers[0][1], 1)'''
          if tag_needle not in text:
              raise SystemExit('HTR source-tag patch anchor missing')
          text = text.replace(tag_needle, tag_replacement, 1)

          build_tag_needle = '''for literal in ["                            0,\\n", "                            1,\\n", "                            2,\\n", "                            3,\\n"]:
              fmc = replace_once(fmc, literal, "                            source_tag,\\n", f"build skeleton tag {literal.strip()}")'''
          build_tag_replacement = '''for literal in range(4):
              pattern = rf"(\\n\\s+axis,\\n)(\\s*){literal},(\\n\\s+(?:&\\[\\]|pm_set),)"
              fmc, count = re.subn(pattern, rf"\\1\\2source_tag,\\3", fmc, count=1)
              if count != 1:
                  raise SystemExit(f"build skeleton tag {literal}: expected one match, found {count}")'''
          if build_tag_needle not in text:
              raise SystemExit('HTR build-skeleton tag patch anchor missing')
          path.write_text(text.replace(build_tag_needle, build_tag_replacement, 1))
          PY

      - name: Apply HTR transform
        run: python3 tools/apply-fmc-htr-skeletons.py

      - name: Repair internal DR call
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('solver-wasm/src/fmc_search.rs')
          text = path.read_text()
          pattern = r'(let dr_routes = solve_dr_routes_via_rzp\([\s\S]*?force_rzp,\n)\s*enable_htr_skeletons,\n'
          text, count = re.subn(pattern, r'\1', text, count=1)
          if count != 1:
              raise SystemExit(f'expected one internal DR call repair, found {count}')
          path.write_text(text)
          PY

      - name: Add bounded HTR entry search
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('solver-wasm/src/fmc_search.rs')
          text = path.read_text()
          replacement = r'''fn find_htr_tail_from_p2(
              state_after_dr: &CubeState,
              p2_moves: &[u8],
              tables: &TwophaseTables,
              fmc_tables: &FmcTables,
          ) -> Option<Vec<u8>> {
              const ENTRY_DEPTH: usize = 3;
              let mut queue = std::collections::VecDeque::<(CubeState, Vec<u8>, u8)>::new();
              let mut seen = std::collections::HashMap::<FmcStateKey, usize>::new();
              queue.push_back((*state_after_dr, Vec::new(), LAST_FACE_FREE));
              seen.insert(fmc_state_key(state_after_dr), 0);
              let mut best: Option<Vec<u8>> = None;

              while let Some((state, prefix, last_face)) = queue.pop_front() {
                  if let Some(finish) = htr_finish_moves(&state, tables, fmc_tables) {
                      let mut tail = prefix.clone();
                      tail.extend_from_slice(&finish);
                      let tail = simplify_moves(&tail);
                      if tail != p2_moves && tail.len() <= p2_moves.len() + FMC_HTR_TAIL_SLACK {
                          let replace = best.as_ref().is_none_or(|current| {
                              (tail.len(), tail.clone()) < (current.len(), current.clone())
                          });
                          if replace {
                              best = Some(tail);
                          }
                      }
                  }

                  if prefix.len() >= ENTRY_DEPTH {
                      continue;
                  }
                  for &move_index in &tables.phase2_move_indices {
                      let face = tables.move_data.move_face[move_index as usize];
                      if last_face < LAST_FACE_FREE && face == last_face {
                          continue;
                      }
                      if last_face < LAST_FACE_FREE
                          && face == OPPOSITE_FACE[last_face as usize]
                          && face < last_face
                      {
                          continue;
                      }
                      let next = state.apply_move(move_index as usize, &tables.move_data);
                      let next_depth = prefix.len() + 1;
                      let key = fmc_state_key(&next);
                      if seen.get(&key).is_some_and(|&depth| depth <= next_depth) {
                          continue;
                      }
                      seen.insert(key, next_depth);
                      let mut next_prefix = prefix.clone();
                      next_prefix.push(move_index);
                      queue.push_back((next, next_prefix, face));
                  }
              }
              best
          }

          // --- Result Types ---'''
          pattern = r'fn find_htr_tail_from_p2\([\s\S]*?\n}\n\n// --- Result Types ---'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one HTR tail function replacement, found {count}')
          path.write_text(text)
          PY

      - name: Format Rust
        run: cargo fmt --manifest-path solver-wasm/Cargo.toml

      - name: Run Rust release tests
        run: cargo test --manifest-path solver-wasm/Cargo.toml --release

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Rebuild release WASM
        working-directory: solver-wasm
        run: wasm-pack build --target web --release --out-dir ../public/solver-wasm

      - name: Restore generated ignore files
        run: git restore --source=HEAD -- .gitignore public/solver-wasm/.gitignore 2>/dev/null || true

      - name: Validate HTR candidates and skeletons
        env:
          FMC_HTR_RUNS: '100'
          FMC_HTR_PREMOVE_SETS: '40'
        run: node tools/verify-fmc-htr-skeletons.mjs

      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver-wasm/src/fmc_search.rs solver-wasm/src/lib.rs solver/wasmSolver.js
          git add public/solver-wasm/solver_wasm_bg.wasm
          git add public/solver-wasm/solver_wasm.js public/solver-wasm/solver_wasm.d.ts public/solver-wasm/solver_wasm_bg.wasm.d.ts public/solver-wasm/package.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No production changes to commit"
          else
            git commit -m "Add opt-in HTR skeleton routes"
            git push origin HEAD:${{ github.head_ref }}
          fi
