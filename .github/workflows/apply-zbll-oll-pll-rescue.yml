name: Apply ZBLL OLL PLL rescue

on:
  push:
    branches:
      - fix/zbll-static-index-fallback

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[zbll-oll-pll-rescue]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zbll-static-index-fallback
          fetch-depth: 0

      - name: Apply source patch
        run: node tools/apply-zbll-oll-pll-rescue.mjs

      - name: Remove one-time patch machinery
        run: |
          git rm .github/workflows/apply-zbll-oll-pll-rescue.yml
          git rm tools/apply-zbll-oll-pll-rescue.mjs

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver/cfop3x3.js
          git commit -m "[zbll-oll-pll-rescue] Cover missing ZBLL states"
          git push origin HEAD:fix/zbll-static-index-fallback
