name: V1 vs latest 100 benchmark

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  benchmark:
    if: github.head_ref == 'agent/benchmark-v1-vs-latest-100'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate benchmark
        run: node --check benchmark-v1-vs-latest-100.mjs
      - name: Run 100-case comparison
        run: node --expose-gc benchmark-v1-vs-latest-100.mjs
