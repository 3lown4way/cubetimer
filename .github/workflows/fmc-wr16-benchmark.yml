name: Benchmark FMC WR16 scramble

on:
  pull_request:
    types: [opened]
    branches:
      - agent/fmc-extreme-independent-frontier-v2

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out current solver branch
        uses: actions/checkout@v4
        with:
          ref: agent/fmc-extreme-independent-frontier-v2

      - name: Run WR16 scramble benchmark
        run: |
          cat > tools/.fmc-wr16-bench.mjs <<'NODE'
          import { performance } from "node:perf_hooks";
          import { solveWithFMCSearch } from "../solver/fmcSolver.js";
          import { verifyFmcSolutionWasm } from "../solver/wasmSolver.js";

          const scramble = "R' U' F D2 L2 F R2 U2 R2 B D2 L B2 D' B2 L' R' B D2 B U2 L U2 R' U' F";
          const known16 = "D2 F' D2 U2 F' L2 D R2 D B2 F L2 R' F' D U'";

          const knownVerification = await verifyFmcSolutionWasm(scramble, known16);

          async function run(label, options) {
            const started = performance.now();
            const result = await solveWithFMCSearch(scramble, null, options);
            const elapsedMs = Math.round(performance.now() - started);
            return {
              label,
              elapsedMs,
              ok: result?.ok === true,
              reason: result?.reason || null,
              moveCount: result?.moveCount ?? result?.bestHumanMoveCount ?? null,
              solution: result?.solution || result?.bestHumanSolution || null,
              source: result?.source || result?.bestHumanSource || null,
              parts: result?.parts || result?.bestHumanParts || null,
              diagnostics: result?.performanceDiagnostics || null,
            };
          }

          const sweet = await run("sweetSpot", {
            qualityMode: "sweetSpot",
            targetMoveCount: 24,
            timeBudgetMs: 8000,
            maxPremoveSets: 40,
            verifyLimit: 32,
          });

          const extreme = await run("extreme30s", {
            qualityMode: "extreme",
            targetMoveCount: 20,
            timeBudgetMs: 30000,
            maxPremoveSets: 180,
            extremeVariantCount: 8,
            extremeReservedCompressionPremoves: 24,
            continueBelowTarget: true,
            insertionTimeMs: 6000,
            verifyLimit: 64,
          });

          const output = {
            scramble,
            known16,
            known16Solved: knownVerification?.ok === true && knownVerification?.solved === true,
            sweet,
            extreme,
          };
          console.log(`WR16_BENCHMARK ${JSON.stringify(output)}`);
          if (!output.known16Solved) throw new Error("KNOWN_16_DID_NOT_VERIFY");
          NODE
          node tools/.fmc-wr16-bench.mjs
