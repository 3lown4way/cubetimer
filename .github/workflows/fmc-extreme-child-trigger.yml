name: Apply FMC Extreme isolation from child PR

on:
  pull_request:
    branches:
      - agent/fmc-extreme-independent-frontier-v2

permissions:
  contents: write
  pull-requests: write

jobs:
  patch-test-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: agent/fmc-extreme-independent-frontier-v2
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Apply isolation patch
        run: python3 tools/apply-fmc-extreme-isolation.py

      - name: Validate JavaScript
        run: node --check solver/fmcSolver.js

      - name: Format and test Rust
        run: |
          cargo fmt --manifest-path solver-wasm/Cargo.toml
          cargo test --manifest-path solver-wasm/Cargo.toml

      - name: Rebuild web WASM
        run: |
          cd solver-wasm
          wasm-pack build --target web --out-dir ../public/solver-wasm

      - name: Validate resulting diff
        run: |
          node --check solver/fmcSolver.js
          cargo test --manifest-path solver-wasm/Cargo.toml
          git diff --check
          grep -q 'baselineCandidateImported: false' solver/fmcSolver.js
          grep -q 'rawLimitIndependentFromFinalBest: true' solver/fmcSolver.js
          grep -q 'let mut raw_exploration_limit' solver-wasm/src/fmc_search.rs
          ! grep -q 'human-L0-' solver/fmcSolver.js

      - name: Commit implementation and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/fmc-extreme-child-trigger.yml \
            .github/workflows/fmc-extreme-independent-frontier.yml \
            tools/apply-fmc-extreme-isolation.py \
            tools/.fmc-extreme-trigger-v2
          git add -A
          git commit -m "Separate FMC Extreme raw frontier from final best"
          git push origin HEAD:agent/fmc-extreme-independent-frontier-v2
