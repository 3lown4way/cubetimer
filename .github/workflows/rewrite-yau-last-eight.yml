name: Rewrite Yau last eight

on:
  push:
    branches: [main]
    paths:
      - "tools/rewrite-yau-last-eight-v2.py"
      - "tools/rewrite-yau-last-eight-v3.py"
      - "tools/rewrite-yau-last-eight-v4.py"
      - "tools/rewrite-yau-last-eight-v5.py"
      - "tools/rewrite-yau-last-eight-v6.py"
      - "tools/rewrite-yau-last-eight-v7.py"
      - "tools/rewrite-yau-last-eight-v8.py"
      - "tools/rewrite-yau-last-eight-v9.py"
      - "tools/rewrite-yau-last-eight-v10.py"
      - "tools/rewrite-yau-last-eight-v11.py"
      - "tools/rewrite-yau-last-eight-v12.py"
      - "tools/rewrite-yau-last-eight-v13.py"
      - "tools/rewrite-yau-last-eight-v14.py"
      - "tools/rewrite-yau-last-eight-v17.py"
      - "tools/rewrite-yau-last-eight-v18.py"
      - ".github/workflows/rewrite-yau-last-eight.yml"

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply instrumented Yau rewrite
        run: python tools/rewrite-yau-last-eight-v18.py
      - name: Keep only F-cross regression for diagnosis
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/verify-444-yau.mjs')
          s = p.read_text()
          marker = 'await verifyCase("Rw U2 F\' Lw D B2", "D", { expectNatural: true });'
          pos = s.find(marker)
          if pos < 0:
              raise SystemExit('verifier tail marker not found')
          s = s[:pos] + '''await verifyCase("Uw2 Rw F2 Dw' L B' Rw2 U Fw' D2 Lw B2", "F", { expectNatural: true });\nconsole.log("F-only instrumented Yau diagnostic passed");\n'''
          p.write_text(s)
          PY
      - name: Check syntax
        run: |
          node --check solver/solver444.js
          node --check solver/edgePairing444.js
          node --check tools/verify-444-yau.mjs
          git diff --check
      - name: Diagnose F-cross Yau
        run: node tools/verify-444-yau.mjs
