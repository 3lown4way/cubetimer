name: Apply inverse-derived two-phase fix once

on:
  push:
    branches:
      - fix/twophase-strict-incumbent
    paths:
      - ".github/workflows/apply-twophase-strict-incumbent-once.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/twophase-strict-incumbent
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Apply inverse-derived candidate filter
        run: python tools/apply-twophase-inverse-derived-fix.py

      - name: Validate source
        run: |
          node --check solver/solverWorker.js
          node --check solver/wasmSolver.js
          node --check benchmark-twophase-nontrivial-reliability.mjs
          grep -q 'is_inverse_derived_path' solver-wasm/src/twophase_search.rs
          grep -q 'TWOPHASE_INVERSE_DERIVED_ONLY' solver-wasm/src/twophase_search.rs
          grep -q 'excludedSolution: inverseSolution || undefined' solver/solverWorker.js
          git diff --check

      - name: Format and test Rust
        working-directory: solver-wasm
        run: |
          cargo fmt
          cargo test --lib

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Rebuild browser WASM
        working-directory: solver-wasm
        run: wasm-pack build --release --target web --out-dir ../public/solver-wasm

      - name: Verify 100-case structural reliability
        run: node benchmark-twophase-nontrivial-reliability.mjs

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reject inverse-derived two-phase solutions"
          git push origin HEAD:fix/twophase-strict-incumbent
