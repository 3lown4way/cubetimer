name: Apply strict two-phase incumbent fix once

on:
  push:
    branches:
      - fix/twophase-strict-incumbent
    paths:
      - ".github/workflows/apply-twophase-strict-incumbent-once.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/twophase-strict-incumbent
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply bounded two-phase contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one {label} match, found {count}")
              return text.replace(old, new, 1)

          worker_path = Path("solver/solverWorker.js")
          worker = worker_path.read_text()
          worker = replace_once(
              worker,
              'const v2Strict = noFallback && normalizeSolverVersion(solverVersion) === "v2";',
              'const v2Adaptive = normalizeSolverVersion(solverVersion) === "v2";',
              "v2 mode",
          )
          worker = replace_once(
              worker,
              'const frontierLimits = v2Strict',
              'const frontierLimits = v2Adaptive',
              "frontier selector",
          )
          worker = replace_once(
              worker,
              'excludedSolution: noFallback ? inverseSolution : undefined,',
              'excludedSolution: inverseSolution || undefined,',
              "inverse exclusion",
          )
          worker = replace_once(
              worker,
              'strictIncumbent: false,',
              'strictIncumbent: true,',
              "strict incumbent",
          )
          worker = replace_once(
              worker,
              '  const solution = String(phaseResult.solution || "").trim();\n',
              '  const solution = String(phaseResult.solution || "").trim();\n'
              '  const solutionMoveCount = Number.isFinite(phaseResult.moveCount)\n'
              '    ? phaseResult.moveCount\n'
              '    : countAlgorithmMoves(solution);\n',
              "solution count",
          )
          worker = replace_once(
              worker,
              '  if (noFallback && inverseSolution && solution === inverseSolution) {',
              '  if (inverseSolution && solution === inverseSolution) {',
              "exact inverse guard",
          )
          inverse_guard = (
              '  if (inverseSolution && solution === inverseSolution) {\n'
              '    return { ok: false, reason: "TWOPHASE_STRICT_EXCLUSION_VIOLATION", source: phaseSource };\n'
              '  }\n'
          )
          non_improving_guard = (
              '  if (inverseLength > 0 && solutionMoveCount >= inverseLength) {\n'
              '    return {\n'
              '      ok: false,\n'
              '      reason: "TWOPHASE_NON_IMPROVING_RESULT_REJECTED",\n'
              '      source: phaseSource,\n'
              '      moveCount: solutionMoveCount,\n'
              '      upperBoundLength: inverseLength,\n'
              '    };\n'
              '  }\n'
          )
          worker = replace_once(
              worker,
              inverse_guard,
              inverse_guard + non_improving_guard,
              "anchored non-improving guard",
          )
          worker_path.write_text(worker)

          benchmark_path = Path("benchmark-twophase-nontrivial-reliability.mjs")
          benchmark = benchmark_path.read_text()
          benchmark = replace_once(
              benchmark,
              'frontierLimits: [2, 12, 48],',
              'frontierLimits: [2, 12, 48, 192, 768],',
              "benchmark frontiers",
          )
          benchmark = replace_once(
              benchmark,
              'strictIncumbent: false,',
              'strictIncumbent: true,',
              "benchmark strict incumbent",
          )
          benchmark = replace_once(
              benchmark,
              '  const nontrivial = solution !== inverse;',
              '  const nontrivial = solution !== inverse && Number(result?.moveCount) < 20;',
              "benchmark quality assertion",
          )
          benchmark_path.write_text(benchmark)

          Path(".github/workflows/apply-twophase-strict-incumbent-once.yml").unlink()
          PY

      - name: Validate source contract
        run: |
          node --check solver/solverWorker.js
          node --check benchmark-twophase-nontrivial-reliability.mjs
          grep -q 'const v2Adaptive' solver/solverWorker.js
          grep -q 'strictIncumbent: true' solver/solverWorker.js
          grep -q 'excludedSolution: inverseSolution || undefined' solver/solverWorker.js
          grep -q 'TWOPHASE_NON_IMPROVING_RESULT_REJECTED' solver/solverWorker.js
          ! grep -q 'strictIncumbent: false' benchmark-twophase-nontrivial-reliability.mjs
          git diff --check

      - name: Verify bounded nontrivial reliability
        run: node benchmark-twophase-nontrivial-reliability.mjs

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A solver/solverWorker.js benchmark-twophase-nontrivial-reliability.mjs .github/workflows/apply-twophase-strict-incumbent-once.yml
          git commit -m "Enforce strict two-phase incumbent bounds"
          git push origin HEAD:fix/twophase-strict-incumbent
