name: FMC EO coordinate probe

on:
  pull_request:
    types: [opened]
    branches:
      - agent/fmc-extreme-independent-frontier-v2

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fmc-extreme-independent-frontier-v2
      - name: Create native coordinate probe
        run: |
          mkdir -p solver-wasm/src/bin
          cat > solver-wasm/src/bin/fmc_eo_probe.rs <<'RUST'
          use solver_wasm::fmc_search::build_fmc_tables;
          use solver_wasm::minmove_core::{encode_eo, parse_scramble, solution_string_from_path, CubeState};
          use solver_wasm::twophase_bundle::load_bundle;

          fn main() {
              let bytes = std::fs::read("public/solver-wasm/twophase/twophase-333-v1.bin").unwrap();
              let tables = load_bundle(&bytes).unwrap();
              let fmc = build_fmc_tables(&tables);
              println!("MOVE_NAMES {:?}", tables.move_data.move_names);
              for move_index in 0..18usize {
                  let state = CubeState::solved().apply_move(move_index, &tables.move_data);
                  println!(
                      "SINGLE_MOVE {} eo={} bits={:?}",
                      tables.move_data.move_names[move_index],
                      encode_eo(&state.eo),
                      state.eo,
                  );
              }

              let inverse_scramble = "F' U R U2 L' U2 B' D2 B' R L B2 D B2 L' D2 B' R2 U2 R2 F' L2 D2 F' U R";
              let eo = "U D' F R";
              let inverse_moves = parse_scramble(inverse_scramble, &tables.move_data).unwrap();
              let eo_moves = parse_scramble(eo, &tables.move_data).unwrap();

              for axis in 0..3usize {
                  let map = &fmc.axis_scramble_move_map[axis];
                  let mapped_inverse: Vec<u8> = inverse_moves.iter().map(|&m| map[m as usize]).collect();
                  let mapped_eo: Vec<u8> = eo_moves.iter().map(|&m| map[m as usize]).collect();
                  let before = CubeState::solved().apply_moves(&mapped_inverse, &tables.move_data);
                  let after = before.apply_moves(&mapped_eo, &tables.move_data);
                  println!(
                      "WR16_AXIS {} mapped_eo={} before_eo={} after_eo={} after_bits={:?}",
                      axis,
                      solution_string_from_path(&mapped_eo, &tables.move_data),
                      encode_eo(&before.eo),
                      encode_eo(&after.eo),
                      after.eo,
                  );
              }
          }
          RUST
      - name: Run probe
        run: cargo run --release --manifest-path solver-wasm/Cargo.toml --bin fmc_eo_probe
