name: FMC complementary DR slack4 experiment

on:
  push:
    branches:
      - agent/fmc-extreme-independent-frontier-v2

permissions:
  contents: write

jobs:
  implement-and-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      TARGET_BRANCH: agent/fmc-extreme-independent-frontier-v2
      FMC_GENERALIZATION_FIXED_COUNT: 6
      FMC_GENERALIZATION_COMPRESSION_COUNT: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fmc-extreme-independent-frontier-v2
          fetch-depth: 0

      - name: Remove trigger files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fmc-complementary-dr-slack4.yml .fmc-complementary-dr-slack4-trigger
          git commit -m "Remove temporary complementary DR experiment trigger"
          git push origin HEAD:${TARGET_BRANCH}
          echo "CLEAN_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Capture baseline holdout
        run: node tools/benchmark-fmc-generalization.mjs --out /tmp/fmc-base.json --debug-rows

      - name: Capture baseline development cases
        run: |
          cat > tools/.fmc-dev-runner.mjs <<'NODE'
          import fs from 'node:fs';
          import { performance } from 'node:perf_hooks';
          import { buildFmcTablesWasm, solveFmcWasm, verifyFmcSolutionWasm } from '../solver/wasmSolver.js';
          const output = process.argv[2];
          const corpus = JSON.parse(fs.readFileSync('tools/fmc-generalization-corpus.json', 'utf8'));
          const profile = {
            maxPremoveSets: 0,
            searchLevel: 3,
            searchVariant: 7,
            incumbentMoveCount: 34,
            forceRzp: false,
            enableCoverageFallback: true,
            enableMultiSwitchNiss: true,
            enableDeepMultiSwitchNiss: true,
            enableHtrSkeletons: true,
            enableSliceInsertion: true,
            enableMultiInsertion: true,
          };
          if (!(await buildFmcTablesWasm())) throw new Error('FMC_TABLE_BUILD_FAILED');
          const rows = [];
          for (const testCase of corpus.developmentCases.slice(0, 3)) {
            const started = performance.now();
            const result = await solveFmcWasm(testCase.scramble, profile);
            const elapsedMs = performance.now() - started;
            if (!result?.ok || !result.solution) throw new Error(`SOLVE_FAILED:${testCase.id}`);
            const verification = await verifyFmcSolutionWasm(testCase.scramble, result.solution);
            if (!verification?.ok || verification.solved !== true) throw new Error(`INVALID:${testCase.id}`);
            rows.push({
              id: testCase.id,
              known: testCase.knownMoveCount,
              found: result.moveCount,
              elapsedMs,
              source: result.source,
              solution: result.solution,
            });
          }
          fs.writeFileSync(output, JSON.stringify(rows, null, 2));
          console.log(`DEV_RESULTS ${JSON.stringify(rows)}`);
          NODE
          node tools/.fmc-dev-runner.mjs /tmp/fmc-dev-base.json

      - name: Apply complementary-frame joint DR plus P2 search
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('solver-wasm/src/fmc_search.rs')
          text = path.read_text()

          old_axis = '''/// Axis scramble maps in JS face convention.
          const AXIS_SCRAMBLE_MAPS_JS: [[u8; 6]; 3] = [
              [0, 1, 2, 3, 4, 5], // UD: identity
              [5, 4, 2, 3, 0, 1], // FB: U→B, D→F, R→R, L→L, F→U, B→D
              [2, 3, 1, 0, 4, 5], // RL: U→R, D→L, R→D, L→U, F→F, B→B
          ];

          /// Axis solution maps (inverse of scramble maps) in JS face convention.
          const AXIS_SOLUTION_MAPS_JS: [[u8; 6]; 3] = [
              [0, 1, 2, 3, 4, 5], // UD: identity
              [4, 5, 2, 3, 1, 0], // FB: U→F, D→B, R→R, L→L, F→D, B→U
              [3, 2, 0, 1, 4, 5], // RL: U→L, D→R, R→U, L→D, F→F, B→B
          ];

          const AXIS_NAMES: [&str; 3] = ["UD", "FB", "RL"];'''.replace('          ', '')
          new_axis = '''const FMC_PRIMARY_AXIS_COUNT: usize = 3;
          const FMC_FRAME_COUNT: usize = 6;
          const FMC_COMPLEMENTARY_FRAME_START: usize = 3;

          /// Each DR axis admits two EO axes. Preserve the legacy three frames
          /// for the normal pipeline and use the three complementary frames only
          /// for bounded L3 inverse-side joint DR+P2 rescue.
          const AXIS_SCRAMBLE_MAPS_JS: [[u8; 6]; FMC_FRAME_COUNT] = [
              [0, 1, 2, 3, 4, 5],
              [5, 4, 2, 3, 0, 1],
              [2, 3, 1, 0, 4, 5],
              [0, 1, 4, 5, 3, 2],
              [2, 3, 4, 5, 0, 1],
              [4, 5, 0, 1, 2, 3],
          ];

          const AXIS_SOLUTION_MAPS_JS: [[u8; 6]; FMC_FRAME_COUNT] = [
              [0, 1, 2, 3, 4, 5],
              [4, 5, 2, 3, 1, 0],
              [3, 2, 0, 1, 4, 5],
              [0, 1, 5, 4, 2, 3],
              [4, 5, 0, 1, 2, 3],
              [2, 3, 4, 5, 0, 1],
          ];

          const AXIS_NAMES: [&str; FMC_FRAME_COUNT] = [
              "UD", "FB", "RL", "UD_EO_RL", "FB_EO_RL", "RL_EO_UD",
          ];'''.replace('          ', '')
          if old_axis not in text:
              raise SystemExit('axis block anchor not found')
          text = text.replace(old_axis, new_axis, 1)

          constants_anchor = '''const FMC_MULTI_NISS_RESULT_LIMIT_PER_AXIS: usize = 4;

          /// Maximum number of synthetic leave-slice relocation plans retained.'''.replace('          ', '')
          constants_new = '''const FMC_MULTI_NISS_RESULT_LIMIT_PER_AXIS: usize = 4;

          /// Complementary-frame rescue targets a completed sub-20 result. It
          /// permits DR endpoints up to four moves longer than the shortest DR,
          /// then ranks them jointly with their phase-2 lower bound.
          const FMC_COMPLEMENTARY_FINAL_TARGET: usize = 20;
          const FMC_COMPLEMENTARY_DR_SLACK: usize = 4;
          const FMC_COMPLEMENTARY_DR_NODE_LIMIT: u64 = 12_000_000;
          const FMC_COMPLEMENTARY_ENDPOINT_LIMIT: usize = 512;
          const FMC_COMPLEMENTARY_P2_FRONTIER_LIMIT: usize = 64;
          const FMC_COMPLEMENTARY_P2_NODE_LIMIT: u64 = 2_000_000;

          /// Maximum number of synthetic leave-slice relocation plans retained.'''.replace('          ', '')
          if constants_anchor not in text:
              raise SystemExit('constants anchor not found')
          text = text.replace(constants_anchor, constants_new, 1)

          replacements = [
              ('pub axis_scramble_move_map: [[u8; 18]; 3],',
               'pub axis_scramble_move_map: [[u8; 18]; FMC_FRAME_COUNT],'),
              ('pub axis_solution_move_map: [[u8; 18]; 3],',
               'pub axis_solution_move_map: [[u8; 18]; FMC_FRAME_COUNT],'),
              ('let mut axis_scramble_move_map = [[0u8; 18]; 3];\n    let mut axis_solution_move_map = [[0u8; 18]; 3];\n    for i in 0..3 {',
               'let mut axis_scramble_move_map = [[0u8; 18]; FMC_FRAME_COUNT];\n    let mut axis_solution_move_map = [[0u8; 18]; FMC_FRAME_COUNT];\n    for i in 0..FMC_FRAME_COUNT {'),
              ('/// 0=direct, 1=niss, 2=premove_direct, 3=premove_niss; 8..=11 are stage-boundary NISS.',
               '/// 0=direct, 1=niss, 2=premove_direct, 3=premove_niss; 8..=12 are stage-boundary NISS.'),
              ('.filter(|candidate| (8..=11).contains(&candidate.source_tag))',
               '.filter(|candidate| (8..=12).contains(&candidate.source_tag))'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'missing replacement anchor: {old[:80]}')
              text = text.replace(old, new)

          source_old = '''        11 => format!(
              "FMC_MULTI_NISS_INVERSE_DR_BOUNDARY_{}",
              AXIS_NAMES[candidate.axis as usize]
          ),
          _ => "FMC_UNKNOWN".into(),'''.replace('          ', '')
          source_new = '''        11 => format!(
              "FMC_MULTI_NISS_INVERSE_DR_BOUNDARY_{}",
              AXIS_NAMES[candidate.axis as usize]
          ),
          12 => format!(
              "FMC_MULTI_NISS_INVERSE_JOINT_DR_P2_{}",
              AXIS_NAMES[candidate.axis as usize]
          ),
          _ => "FMC_UNKNOWN".into(),'''.replace('          ', '')
          source_count = text.count(source_old)
          if source_count != 1:
              raise SystemExit(f'candidate source anchor count={source_count}')
          text = text.replace(source_old, source_new, 1)

          skeleton_old = '''        11 => format!(
              "FMC_MULTI_NISS_INVERSE_DR_BOUNDARY_{}",
              AXIS_NAMES[skeleton.axis as usize]
          ),
          _ => "FMC_UNKNOWN".into(),'''.replace('          ', '')
          skeleton_new = '''        11 => format!(
              "FMC_MULTI_NISS_INVERSE_DR_BOUNDARY_{}",
              AXIS_NAMES[skeleton.axis as usize]
          ),
          12 => format!(
              "FMC_MULTI_NISS_INVERSE_JOINT_DR_P2_{}",
              AXIS_NAMES[skeleton.axis as usize]
          ),
          _ => "FMC_UNKNOWN".into(),'''.replace('          ', '')
          skeleton_count = text.count(skeleton_old)
          if skeleton_count != 1:
              raise SystemExit(f'skeleton source anchor count={skeleton_count}')
          text = text.replace(skeleton_old, skeleton_new, 1)

          helper_anchor = '''/// Switch to the inverse side at a stage boundary. If T = S·A is the state at
          /// the boundary and Q solves T⁻¹, then A·Q⁻¹ solves S. Every flattened result is
          /// independently replayed on S before it is admitted.'''.replace('          ', '')
          if helper_anchor not in text:
              raise SystemExit('joint helper anchor not found')

          helper = r'''
          #[derive(Clone, Debug)]
          struct FmcComplementaryEndpoint {
              state: CubeState,
              moves: Vec<u8>,
              p2_input: Phase2Input,
              p2_lower_bound: u8,
          }

          fn retain_complementary_endpoint(
              endpoints: &mut std::collections::HashMap<FmcStateKey, FmcComplementaryEndpoint>,
              endpoint: FmcComplementaryEndpoint,
          ) {
              let key = fmc_state_key(&endpoint.state);
              let replace = endpoints.get(&key).is_none_or(|current| {
                  (
                      endpoint.moves.len() + endpoint.p2_lower_bound as usize,
                      endpoint.p2_lower_bound,
                      endpoint.moves.len(),
                      endpoint.moves.clone(),
                  ) < (
                      current.moves.len() + current.p2_lower_bound as usize,
                      current.p2_lower_bound,
                      current.moves.len(),
                      current.moves.clone(),
                  )
              });
              if replace {
                  endpoints.insert(key, endpoint);
              }
              if endpoints.len() > FMC_COMPLEMENTARY_ENDPOINT_LIMIT {
                  if let Some(worst_key) = endpoints
                      .iter()
                      .max_by_key(|(_, item)| {
                          (
                              item.moves.len() + item.p2_lower_bound as usize,
                              item.p2_lower_bound,
                              item.moves.len(),
                              item.moves.clone(),
                          )
                      })
                      .map(|(key, _)| *key)
                  {
                      endpoints.remove(&worst_key);
                  }
              }
          }

          /// Search EO-preserving paths to many DR endpoints instead of taking
          /// the canonical shortest-DR table chase. Endpoints are ranked by
          /// DR length + P2 lower bound, then only a bounded frontier receives
          /// an exact phase-2 search.
          fn solve_complementary_joint_dr_p2(
              state: &CubeState,
              tables: &TwophaseTables,
              fmc_tables: &FmcTables,
              p2_cache: &mut FmcP2Cache,
              total_bound: usize,
              search_variant: u32,
          ) -> Option<Vec<u8>> {
              if encode_eo(&state.eo) != 0 || total_bound == 0 {
                  return None;
              }
              let start_co = encode_co(&state.co);
              let start_slice = encode_slice_from_ep(&state.ep);
              let shortest_dr = fmc_tables.co_slice_dist[start_co * SLICE_SIZE + start_slice];
              if shortest_dr == 255 {
                  return None;
              }
              let max_dr_depth = (shortest_dr as usize + FMC_COMPLEMENTARY_DR_SLACK)
                  .min(FMC_MAX_DR_DEPTH as usize)
                  .min(total_bound.saturating_sub(1));
              if shortest_dr as usize > max_dr_depth {
                  return None;
              }

              fn dfs(
                  state: CubeState,
                  tables: &TwophaseTables,
                  fmc_tables: &FmcTables,
                  depth_bound: usize,
                  total_bound: usize,
                  search_variant: u32,
                  path: &mut Vec<u8>,
                  last_face: u8,
                  nodes: &mut u64,
                  seen: &mut std::collections::HashMap<(FmcStateKey, u8), usize>,
                  endpoints: &mut std::collections::HashMap<FmcStateKey, FmcComplementaryEndpoint>,
              ) {
                  if *nodes >= FMC_COMPLEMENTARY_DR_NODE_LIMIT {
                      return;
                  }
                  let depth = path.len();
                  let co = encode_co(&state.co);
                  let slice = encode_slice_from_ep(&state.ep);
                  let distance = fmc_tables.co_slice_dist[co * SLICE_SIZE + slice];
                  if distance == 255 || depth.saturating_add(distance as usize) > depth_bound {
                      return;
                  }
                  let key = (fmc_state_key(&state), last_face);
                  if seen.get(&key).is_some_and(|&best_depth| best_depth <= depth) {
                      return;
                  }
                  seen.insert(key, depth);

                  if co == 0 && slice == tables.solved_slice as usize {
                      if let Some(p2_input) = build_p2_input(&state) {
                          let lower = tables
                              .phase2_cp_sep_joint
                              .get(p2_input.cp_idx * FACTORIAL_4[4] + p2_input.sep_idx)
                              .max(tables.phase2_ep.get(p2_input.ep_idx));
                          if depth.saturating_add(lower as usize) <= total_bound {
                              retain_complementary_endpoint(
                                  endpoints,
                                  FmcComplementaryEndpoint {
                                      state,
                                      moves: path.clone(),
                                      p2_input,
                                      p2_lower_bound: lower,
                                  },
                              );
                          }
                      }
                  }
                  if depth >= depth_bound {
                      return;
                  }

                  let mut allowed = fmc_tables.dr_eo_allowed_by_last_face[last_face as usize].clone();
                  allowed.sort_by_key(|&move_index| {
                      let next_co = tables.co_move.get(co, move_index as usize) as usize;
                      let next_slice = tables.slice_move.get(slice, move_index as usize) as usize;
                      let next_distance =
                          fmc_tables.co_slice_dist[next_co * SLICE_SIZE + next_slice];
                      (next_distance, move_index)
                  });
                  if !allowed.is_empty() {
                      let rotation = (search_variant as usize * 7 + depth * 3) % allowed.len();
                      allowed.rotate_left(rotation);
                  }
                  for move_index in allowed {
                      if *nodes >= FMC_COMPLEMENTARY_DR_NODE_LIMIT {
                          break;
                      }
                      *nodes += 1;
                      path.push(move_index);
                      let next = state.apply_move(move_index as usize, &tables.move_data);
                      let next_face = tables.move_data.move_face[move_index as usize];
                      dfs(
                          next,
                          tables,
                          fmc_tables,
                          depth_bound,
                          total_bound,
                          search_variant,
                          path,
                          next_face,
                          nodes,
                          seen,
                          endpoints,
                      );
                      path.pop();
                  }
              }

              let mut endpoints = std::collections::HashMap::new();
              let mut nodes = 0u64;
              for depth_bound in shortest_dr as usize..=max_dr_depth {
                  let mut seen = std::collections::HashMap::new();
                  dfs(
                      *state,
                      tables,
                      fmc_tables,
                      depth_bound,
                      total_bound,
                      search_variant,
                      &mut Vec::with_capacity(max_dr_depth),
                      LAST_FACE_FREE,
                      &mut nodes,
                      &mut seen,
                      &mut endpoints,
                  );
                  if nodes >= FMC_COMPLEMENTARY_DR_NODE_LIMIT {
                      break;
                  }
              }

              let mut endpoints: Vec<FmcComplementaryEndpoint> = endpoints.into_values().collect();
              endpoints.sort_by_key(|endpoint| {
                  (
                      endpoint.moves.len() + endpoint.p2_lower_bound as usize,
                      endpoint.p2_lower_bound,
                      endpoint.moves.len(),
                      endpoint.moves.clone(),
                  )
              });
              endpoints.truncate(FMC_COMPLEMENTARY_P2_FRONTIER_LIMIT);

              let mut best: Option<Vec<u8>> = None;
              for endpoint in endpoints {
                  let best_total = best.as_ref().map_or(total_bound + 1, Vec::len);
                  if endpoint.moves.len() + endpoint.p2_lower_bound as usize >= best_total {
                      continue;
                  }
                  let p2_cap = total_bound
                      .min(best_total.saturating_sub(1))
                      .saturating_sub(endpoint.moves.len())
                      .min(FMC_MAX_P2_DEPTH as usize) as u8;
                  let Some(p2_local) = p2_cache.solve(
                      &endpoint.p2_input,
                      tables,
                      p2_cap,
                      FMC_COMPLEMENTARY_P2_NODE_LIMIT,
                  ) else {
                      continue;
                  };
                  let p2_global: Vec<u8> = p2_local
                      .iter()
                      .map(|&local| tables.phase2_move_indices[local as usize])
                      .collect();
                  let mut full = endpoint.moves.clone();
                  full.extend_from_slice(&p2_global);
                  let full = simplify_moves(&full);
                  if full.len() <= total_bound
                      && state.apply_moves(&full, &tables.move_data).is_solved()
                      && best.as_ref().is_none_or(|current| {
                          (full.len(), full.clone()) < (current.len(), current.clone())
                      })
                  {
                      best = Some(full);
                  }
              }
              best
          }

          fn solve_complementary_inverse_joint_niss_single_axis(
              state: &CubeState,
              tables: &TwophaseTables,
              fmc_tables: &FmcTables,
              max_eo_depth: u8,
              p2_cache: &mut FmcP2Cache,
              search_variant: u32,
          ) -> Vec<FmcBoundaryNissResult> {
              let boundaries = collect_multi_switch_niss_boundaries(
                  state,
                  tables,
                  fmc_tables,
                  max_eo_depth,
                  FMC_COMPLEMENTARY_FINAL_TARGET,
                  false,
                  false,
              );
              let mut output = Vec::new();
              for boundary in boundaries {
                  if boundary.stage_tag != 0 || boundary.prefix_moves.len() >= FMC_COMPLEMENTARY_FINAL_TARGET {
                      continue;
                  }
                  let boundary_state = state.apply_moves(&boundary.prefix_moves, &tables.move_data);
                  let switched_state = invert_state(&boundary_state);
                  let continuation_bound =
                      FMC_COMPLEMENTARY_FINAL_TARGET - boundary.prefix_moves.len();
                  let Some(continuation) = solve_complementary_joint_dr_p2(
                      &switched_state,
                      tables,
                      fmc_tables,
                      p2_cache,
                      continuation_bound,
                      search_variant,
                  ) else {
                      continue;
                  };
                  let inverse_continuation = invert_moves(&continuation);
                  let mut flattened = boundary.prefix_moves.clone();
                  flattened.extend_from_slice(&inverse_continuation);
                  let flattened = simplify_moves(&flattened);
                  if flattened.is_empty()
                      || flattened.len() > FMC_COMPLEMENTARY_FINAL_TARGET
                      || !state.apply_moves(&flattened, &tables.move_data).is_solved()
                  {
                      continue;
                  }
                  output.push(FmcBoundaryNissResult {
                      moves: flattened,
                      eo_moves: boundary.eo_moves.clone(),
                      dr_moves: Vec::new(),
                      finish_moves: inverse_continuation,
                      stage_tag: 0,
                      rzp_used: false,
                  });
              }
              output.sort_by_key(|result| (result.moves.len(), result.moves.clone()));
              output.dedup_by(|left, right| left.moves == right.moves);
              output.truncate(FMC_MULTI_NISS_RESULT_LIMIT_PER_AXIS);
              output
          }

          '''.replace('          ', '')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          phase3_anchor = '''    // --- Phase 3: Premove sweep ---'''
          if phase3_anchor not in text:
              raise SystemExit('phase3 anchor not found')
          block = r'''
              // The primary three frames remain unchanged. Only L3 deep NISS
              // evaluates the missing EO-axis choices, and only on the inverse
              // side where a completed sub-20 solution can be produced.
              if enable_deep_multi_switch_niss && search_level >= 3 {
                  for frame in FMC_COMPLEMENTARY_FRAME_START..FMC_FRAME_COUNT {
                      let conjugated: Vec<u8> = inv_scramble_moves
                          .iter()
                          .map(|&m| fmc_tables.axis_scramble_move_map[frame][m as usize])
                          .collect();
                      let state = CubeState::solved().apply_moves(&conjugated, &tables.move_data);
                      let results = solve_complementary_inverse_joint_niss_single_axis(
                          &state,
                          tables,
                          fmc_tables,
                          max_eo_depth,
                          &mut p2_cache,
                          search_variant.wrapping_add(701 + frame as u32 * 31),
                      );
                      for result in results {
                          let cvt = |moves: &[u8]| -> Vec<u8> {
                              moves
                                  .iter()
                                  .map(|&m| fmc_tables.axis_solution_move_map[frame][m as usize])
                                  .collect()
                          };
                          let effective_inverse_solution = cvt(&result.moves);
                          let simplified = simplify_moves(&invert_moves(&effective_inverse_solution));
                          if simplified.is_empty()
                              || simplified.len() > FMC_COMPLEMENTARY_FINAL_TARGET
                              || !original_scramble_state
                                  .apply_moves(&simplified, &tables.move_data)
                                  .is_solved()
                          {
                              continue;
                          }
                          all_candidates.push(FmcCandidate {
                              moves: simplified,
                              eo_len: result.eo_moves.len() as u8,
                              dr_len: 0,
                              p2_len: result.finish_moves.len() as u8,
                              eo_moves: cvt(&result.eo_moves),
                              dr_moves: vec![],
                              finish_moves: cvt(&result.finish_moves),
                              axis: frame as u8,
                              source_tag: 12,
                              premove_moves: vec![],
                              rzp_used: false,
                              skeleton_moves: vec![],
                              insertion_moves: vec![],
                              insertion_position: None,
                              skeleton_kind: None,
                              insertion_steps: vec![],
                          });
                      }
                  }
              }

          '''.replace('          ', '')
          text = text.replace(phase3_anchor, block + phase3_anchor, 1)
          path.write_text(text)
          PY

      - name: Test and rebuild WASM
        run: |
          cargo test --release --manifest-path solver-wasm/Cargo.toml
          cargo install wasm-pack --locked
          wasm-pack build solver-wasm --target web --out-dir ../public/solver-wasm
          git checkout -- public/solver-wasm/solver_wasm.js \
            public/solver-wasm/solver_wasm.d.ts \
            public/solver-wasm/solver_wasm_bg.wasm.d.ts \
            public/solver-wasm/package.json || true
          git diff --check

      - name: Run patched development cases
        run: node tools/.fmc-dev-runner.mjs /tmp/fmc-dev-patch.json

      - name: Run patched holdout gate
        run: node tools/benchmark-fmc-generalization.mjs --baseline /tmp/fmc-base.json --out /tmp/fmc-patch.json --debug-rows

      - name: Enforce gates
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const baseline = JSON.parse(fs.readFileSync('/tmp/fmc-dev-base.json', 'utf8'));
          const patched = JSON.parse(fs.readFileSync('/tmp/fmc-dev-patch.json', 'utf8'));
          const holdout = JSON.parse(fs.readFileSync('/tmp/fmc-patch.json', 'utf8'));
          const baseById = new Map(baseline.map((row) => [row.id, row]));
          const wr16 = patched.find((row) => row.id === 'sebastiano-tronto-wr16-2019');
          if (!wr16 || wr16.found > 20) {
            throw new Error(`WR16_TARGET_NOT_REACHED:${JSON.stringify(wr16)}`);
          }
          for (const row of patched) {
            const old = baseById.get(row.id);
            if (old && row.found > old.found) {
              throw new Error(`DEVELOPMENT_REGRESSION:${row.id}:${old.found}->${row.found}`);
            }
          }
          if (!holdout.gate?.passed) {
            throw new Error(`HOLDOUT_GATE_FAILED:${JSON.stringify(holdout.gate)}:${JSON.stringify(holdout.comparison)}`);
          }
          console.log(`ACCEPTED WR16=${wr16.found} source=${wr16.source} holdout=${JSON.stringify(holdout.comparison)}`);
          NODE

      - name: Commit accepted patch
        run: |
          rm -f tools/.fmc-dev-runner.mjs
          git add solver-wasm/src/fmc_search.rs public/solver-wasm/solver_wasm_bg.wasm
          git commit -m "Add complementary-frame joint DR endpoint search"
          git push origin HEAD:${TARGET_BRANCH}

      - name: Cleanup rejected worktree
        if: failure()
        run: |
          git reset --hard "$CLEAN_BASE"
          rm -f tools/.fmc-dev-runner.mjs
