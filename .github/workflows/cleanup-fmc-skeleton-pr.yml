name: Clean FMC skeleton PR scope

on:
  push:
    branches:
      - agent/fmc-skeleton-beam

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fmc-skeleton-beam
          fetch-depth: 0
      - name: Restore unrelated generated and formatted files
        run: |
          git fetch origin main
          git checkout origin/main -- \
            public/solver-wasm/.gitignore \
            public/solver-wasm/package.json \
            solver-wasm/src/minmove_builder.rs \
            solver-wasm/src/minmove_bundle.rs \
            solver-wasm/src/minmove_core.rs \
            solver-wasm/src/minmove_search.rs \
            solver-wasm/src/twophase_builder.rs \
            solver-wasm/src/twophase_bundle.rs
          rm -f .github/workflows/cleanup-fmc-skeleton-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Limit FMC skeleton beam changes to intended files [scope-clean]"
          git push origin HEAD:agent/fmc-skeleton-beam
