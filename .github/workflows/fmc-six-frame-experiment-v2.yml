name: FMC six-frame coverage experiment v2

on:
  pull_request:
    types: [opened]
    branches:
      - agent/fmc-extreme-independent-frontier-v2

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      FMC_GENERALIZATION_FIXED_COUNT: 6
      FMC_GENERALIZATION_COMPRESSION_COUNT: 2
    steps:
      - name: Check out FMC branch
        uses: actions/checkout@v4
        with:
          ref: agent/fmc-extreme-independent-frontier-v2
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Capture baseline
        run: |
          node tools/benchmark-fmc-generalization.mjs --out /tmp/six-frame-baseline-holdout.json
          node tools/.fmc-six-frame-dev.mjs /tmp/six-frame-baseline-dev.json

      - name: Apply six-frame EO-DR coverage patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("solver-wasm/src/fmc_search.rs")
          text = path.read_text()

          replacement = '''/// A DR axis has two distinct EO-axis choices. FMC therefore has six
          /// orientation frames, not only the three DR-axis labels.
          const FMC_FRAME_COUNT: usize = 6;
          const AXIS_SCRAMBLE_MAPS_JS: [[u8; 6]; FMC_FRAME_COUNT] = [
              [0, 1, 2, 3, 4, 5], // DR UD, EO FB
              [5, 4, 2, 3, 0, 1], // DR FB, EO UD
              [2, 3, 1, 0, 4, 5], // DR RL, EO FB
              [0, 1, 4, 5, 3, 2], // DR UD, EO RL
              [2, 3, 4, 5, 0, 1], // DR FB, EO RL
              [4, 5, 0, 1, 2, 3], // DR RL, EO UD
          ];

          /// Inverse conjugations for converting solutions back to the original frame.
          const AXIS_SOLUTION_MAPS_JS: [[u8; 6]; FMC_FRAME_COUNT] = [
              [0, 1, 2, 3, 4, 5],
              [4, 5, 2, 3, 1, 0],
              [3, 2, 0, 1, 4, 5],
              [0, 1, 5, 4, 2, 3],
              [4, 5, 0, 1, 2, 3],
              [2, 3, 4, 5, 0, 1],
          ];

          const AXIS_NAMES: [&str; FMC_FRAME_COUNT] = [
              "UD", "FB", "RL", "UD_EO_RL", "FB_EO_RL", "RL_EO_UD",
          ];'''.replace('          ', '')

          pattern = re.compile(
              r'/// Axis scramble maps in JS face convention\..*?const AXIS_NAMES: \[&str; 3\] = \["UD", "FB", "RL"\];',
              re.S,
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"axis map replacement count={count}")

          replacements = [
              ('pub axis_scramble_move_map: [[u8; 18]; 3],',
               'pub axis_scramble_move_map: [[u8; 18]; FMC_FRAME_COUNT],'),
              ('pub axis_solution_move_map: [[u8; 18]; 3],',
               'pub axis_solution_move_map: [[u8; 18]; FMC_FRAME_COUNT],'),
              ('let mut axis_scramble_move_map = [[0u8; 18]; 3];\n    let mut axis_solution_move_map = [[0u8; 18]; 3];\n    for i in 0..3 {',
               'let mut axis_scramble_move_map = [[0u8; 18]; FMC_FRAME_COUNT];\n    let mut axis_solution_move_map = [[0u8; 18]; FMC_FRAME_COUNT];\n    for i in 0..FMC_FRAME_COUNT {'),
              ('let direct_axis_states: [CubeState; 3] = std::array::from_fn(|axis| {',
               'let direct_axis_states: [CubeState; FMC_FRAME_COUNT] = std::array::from_fn(|axis| {'),
              ('let inverse_axis_states: [CubeState; 3] = std::array::from_fn(|axis| {',
               'let inverse_axis_states: [CubeState; FMC_FRAME_COUNT] = std::array::from_fn(|axis| {'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"missing anchor: {old[:60]}")
              text = text.replace(old, new, 1)

          marker = '// --- Full FMC Solver ---'
          head, full = text.split(marker, 1)
          phase3_index = full.index('// --- Phase 3: Premove sweep ---')
          before_phase3 = full[:phase3_index]
          after_phase3 = full[phase3_index:]

          state_anchor = '''    let direct_axis_states: [CubeState; FMC_FRAME_COUNT] = std::array::from_fn(|axis| {'''
          if state_anchor not in before_phase3:
              raise SystemExit('direct state anchor not found')
          before_phase3 = before_phase3.replace(
              state_anchor,
              '    let frame_count = if search_level >= 3 { FMC_FRAME_COUNT } else { 3 };\n' + state_anchor,
              1,
          )

          # The first two loops are direct and inverse base search. Keep the
          # expensive multi-switch and premove sweeps on their existing 3-frame
          # budget until a separate benchmark justifies expanding them.
          if before_phase3.count('for axis in 0..3u8 {') < 3:
              raise SystemExit('expected direct, inverse and multi-switch loops')
          before_phase3 = before_phase3.replace(
              'for axis in 0..3u8 {',
              'for axis in 0..frame_count as u8 {',
              2,
          )
          text = head + marker + before_phase3 + after_phase3
          path.write_text(text)
          PY
          rustfmt solver-wasm/src/fmc_search.rs
          grep -n "FMC_FRAME_COUNT\|UD_EO_RL\|frame_count" solver-wasm/src/fmc_search.rs

      - name: Test Rust and rebuild WASM
        run: |
          cargo test --release --manifest-path solver-wasm/Cargo.toml
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --locked
          fi
          cd solver-wasm
          wasm-pack build --target web --out-dir ../public/solver-wasm

      - name: Compare patched solver
        run: |
          node tools/benchmark-fmc-generalization.mjs --baseline /tmp/six-frame-baseline-holdout.json --out /tmp/six-frame-patched-holdout.json
          node tools/.fmc-six-frame-dev.mjs /tmp/six-frame-patched-dev.json
          python3 - <<'PY'
          import json
          base = json.load(open('/tmp/six-frame-baseline-dev.json'))
          patched = json.load(open('/tmp/six-frame-patched-dev.json'))
          holdout = json.load(open('/tmp/six-frame-patched-holdout.json'))
          comparison = []
          improved = False
          regressed = False
          for before, after in zip(base['rows'], patched['rows']):
              delta = after['found'] - before['found']
              comparison.append({
                  'id': before['id'],
                  'before': before['found'],
                  'after': after['found'],
                  'delta': delta,
                  'elapsedBefore': before['elapsedMs'],
                  'elapsedAfter': after['elapsedMs'],
                  'source': after['source'],
                  'solution': after['solution'],
              })
              improved |= delta < 0
              regressed |= delta > 0
          print('SIX_FRAME_COMPARISON', json.dumps({
              'development': comparison,
              'holdoutGate': holdout['gate'],
              'holdoutComparison': holdout['comparison'],
          }))
          if not holdout['gate']['passed']:
              raise SystemExit('holdout gate failed')
          if regressed:
              raise SystemExit('development case regressed')
          if not improved:
              raise SystemExit('no development case improved')
          PY

      - name: Commit retained six-frame coverage
        run: |
          git add solver-wasm/src/fmc_search.rs public/solver-wasm/solver_wasm.js public/solver-wasm/solver_wasm_bg.wasm public/solver-wasm/solver_wasm_bg.wasm.d.ts public/solver-wasm/solver_wasm.d.ts
          git diff --cached --quiet && { echo "No retained changes"; exit 1; }
          git commit -m "Cover all six FMC EO-DR frames"
          git push origin HEAD:agent/fmc-extreme-independent-frontier-v2
