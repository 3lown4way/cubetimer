name: Generate complete ZBLL supplement

on:
  push:
    branches:
      - fix/zb-pipeline-reliability-v2
    paths:
      - tools/generate-zbll-supplemental-cases.mjs
      - .github/workflows/generate-zbll-supplement.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate generator
        run: node --check tools/generate-zbll-supplemental-cases.mjs

      - name: Audit all 7,776 legal ZBLL states and generate missing algorithms
        run: node tools/generate-zbll-supplemental-cases.mjs

      - name: Commit generated supplement and audit
        run: |
          rm -f .github/workflows/generate-zbll-supplement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver/zbllSupplementalCases.js benchmark-results/zbll-coverage-audit.json .github/workflows/generate-zbll-supplement.yml
          git commit -m "Generate complete Pure ZB ZBLL coverage supplement"
          git push origin HEAD:fix/zb-pipeline-reliability-v2
