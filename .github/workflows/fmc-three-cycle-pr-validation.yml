name: FMC three-cycle PR validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: taiki-e/install-action@wasm-pack

      - name: Apply implementation
        run: |
          python .github/scripts/apply_fmc_three_cycle_insertion.py
          python .github/scripts/apply_fmc_three_cycle_metrics.py
          rustfmt --edition 2021 solver-wasm/src/fmc_search.rs solver-wasm/src/lib.rs

      - name: Test Rust
        run: cargo test --manifest-path solver-wasm/Cargo.toml --release

      - name: Build release WASM
        working-directory: solver-wasm
        run: wasm-pack build --release --target web --out-dir ../public/solver-wasm

      - name: Measure insertion coverage
        run: |
          cat > /tmp/measure-fmc-three-cycle.mjs <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          const dir = `${process.cwd()}/public/solver-wasm`;
          const mod = await import(pathToFileURL(`${dir}/solver_wasm.js`).href);
          await mod.default(fs.readFileSync(`${dir}/solver_wasm_bg.wasm`));
          mod.load_twophase_333_bundle(fs.readFileSync(`${dir}/twophase/twophase-333-v1.bin`));
          const built = JSON.parse(mod.build_fmc_tables_wasm());
          console.log(JSON.stringify(built));
          if (!built.ok || (built.threeCycleAlgorithmCount ?? 0) < 50) {
            throw new Error(`invalid three-cycle table: ${JSON.stringify(built)}`);
          }

          function makeScrambles(count) {
            let x = 0x6d2b79f5;
            const faces = ['U', 'R', 'F', 'D', 'L', 'B'];
            const suffixes = ['', "'", '2'];
            const opposite = [3, 4, 5, 0, 1, 2];
            const next = () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return x >>>= 0; };
            const output = [];
            for (let sample = 0; sample < count; sample++) {
              const moves = [];
              let lastFace = -1;
              for (let index = 0; index < 21; index++) {
                let face;
                do { face = next() % 6; }
                while (face === lastFace || (lastFace >= 0 && face === opposite[lastFace] && face < lastFace));
                moves.push(faces[face] + suffixes[next() % 3]);
                lastFace = face;
              }
              output.push(moves.join(' '));
            }
            return output;
          }

          const options = JSON.stringify({maxPremoveSets: 80, forceRzp: false});
          let casesWithSkeletons = 0;
          let totalSkeletons = 0;
          let casesWithInsertions = 0;
          let totalInsertions = 0;
          let insertionsInTop10 = 0;
          const kindCounts = {corner3: 0, edge3: 0};
          for (const [index, scramble] of makeScrambles(40).entries()) {
            const result = JSON.parse(mod.solve_fmc_wasm(scramble, options));
            if (!result.ok) throw new Error(`FMC solve failed at ${index}`);
            if (result.skeletonCount > 0) casesWithSkeletons++;
            totalSkeletons += result.skeletonCount ?? 0;
            if ((result.insertionCandidateCount ?? 0) > 0) casesWithInsertions++;
            totalInsertions += result.insertionCandidateCount ?? 0;
            for (const skeleton of result.skeletons ?? []) kindCounts[skeleton.kind]++;
            for (const candidate of result.candidates) {
              const verified = JSON.parse(mod.verify_fmc_solution_wasm(scramble, candidate.solution));
              if (!verified.ok || !verified.solved) throw new Error(`invalid candidate at ${index}: ${candidate.solution}`);
              if (candidate.source.startsWith('FMC_INSERTION_')) insertionsInTop10++;
            }
          }
          console.log(JSON.stringify({casesWithSkeletons, totalSkeletons, casesWithInsertions, totalInsertions, insertionsInTop10, kindCounts}, null, 2));
          NODE
          node /tmp/measure-fmc-three-cycle.mjs
