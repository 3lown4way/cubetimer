name: 3x3 search deadline

on:
  push:
    branches:
      - "fix/3x3-search-deadline"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 3x3-search-deadline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deadline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply one-time source patch
        run: node tools/apply-3x3-search-deadline.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: solver-wasm

      - name: Format Rust
        run: cargo fmt --manifest-path solver-wasm/Cargo.toml --all

      - name: Run Rust unit tests
        run: cargo test --manifest-path solver-wasm/Cargo.toml --lib

      - name: Validate JavaScript syntax
        run: |
          node --check solver/wasmSolver.js
          node --check solver/solverWorker.js
          node --check tools/verify-3x3-search-deadline.mjs

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --locked
          fi

      - name: Build browser WASM package
        run: wasm-pack build solver-wasm --target web --out-dir ../target/wasm-web --release

      - name: Publish generated WASM package to branch
        run: |
          cp target/wasm-web/solver_wasm.js public/solver-wasm/solver_wasm.js
          cp target/wasm-web/solver_wasm.d.ts public/solver-wasm/solver_wasm.d.ts
          cp target/wasm-web/solver_wasm_bg.wasm public/solver-wasm/solver_wasm_bg.wasm
          cp target/wasm-web/solver_wasm_bg.wasm.d.ts public/solver-wasm/solver_wasm_bg.wasm.d.ts

      - name: Verify deadline contract
        run: node tools/verify-3x3-search-deadline.mjs

      - name: Validate repository diff
        run: git diff --check

      - name: Commit generated deadline fix
        run: |
          git add \
            solver-wasm/src/minmove_search.rs \
            solver-wasm/src/lib.rs \
            solver/wasmSolver.js \
            solver/solverWorker.js \
            public/solver-wasm/solver_wasm.js \
            public/solver-wasm/solver_wasm.d.ts \
            public/solver-wasm/solver_wasm_bg.wasm \
            public/solver-wasm/solver_wasm_bg.wasm.d.ts
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Enforce 3x3 minmove WASM search deadline"
          git push
