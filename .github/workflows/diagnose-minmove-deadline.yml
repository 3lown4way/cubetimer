name: Diagnose Minmove deadline

on:
  push:
    branches:
      - "fix/twophase-deadline-regression"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run diagnostic
        run: node tools/diagnose-minmove-deadline.mjs
