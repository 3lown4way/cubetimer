name: Clean FMC Extreme PR scope

on:
  pull_request:
    branches:
      - agent/fmc-extreme-independent-frontier-v2

permissions:
  contents: write

jobs:
  restore-unrelated-files:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: agent/fmc-extreme-independent-frontier-v2
          fetch-depth: 0

      - name: Restore files unrelated to FMC Extreme
        run: |
          git checkout 859875cfe138adc81fdb58b41cb32a89191670d9 -- \
            public/solver-wasm/.gitignore \
            public/solver-wasm/package.json \
            solver-wasm/src/minmove_builder.rs \
            solver-wasm/src/minmove_bundle.rs \
            solver-wasm/src/minmove_core.rs \
            solver-wasm/src/minmove_search.rs \
            solver-wasm/src/twophase_builder.rs \
            solver-wasm/src/twophase_bundle.rs

      - name: Validate scoped implementation
        run: |
          node --check solver/fmcSolver.js
          cargo test --manifest-path solver-wasm/Cargo.toml
          git diff --check
          grep -q 'baselineCandidateImported: false' solver/fmcSolver.js
          grep -q 'rawLimitIndependentFromFinalBest: true' solver/fmcSolver.js
          grep -q 'let mut raw_exploration_limit' solver-wasm/src/fmc_search.rs

      - name: Commit scope cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fmc-extreme-scope-cleanup.yml
          git add -A
          git commit -m "Limit FMC Extreme changes to the search path"
          git push origin HEAD:agent/fmc-extreme-independent-frontier-v2
