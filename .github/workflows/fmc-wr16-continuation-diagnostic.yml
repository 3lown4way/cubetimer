name: FMC WR16 continuation diagnostic

on:
  pull_request:
    types: [opened]
    branches:
      - agent/fmc-extreme-independent-frontier-v2

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out target FMC branch
        uses: actions/checkout@v4
        with:
          ref: agent/fmc-extreme-independent-frontier-v2
          fetch-depth: 0

      - name: Inject and run exact continuation diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cleanup() {
            status=$?
            git checkout -- solver-wasm/src/fmc_search.rs 2>/dev/null || true
            rm -f solver-wasm/src/bin/wr16_diag.rs
            git rm -f .github/workflows/fmc-wr16-continuation-diagnostic.yml 2>/dev/null || true
            git add -u
            if ! git diff --cached --quiet; then
              git commit -m "Remove temporary WR16 continuation diagnostic"
              git push origin HEAD:agent/fmc-extreme-independent-frontier-v2
            fi
            exit $status
          }
          trap cleanup EXIT

          python3 - <<'PY'
          from pathlib import Path

          path = Path('solver-wasm/src/fmc_search.rs')
          text = path.read_text()
          anchor = '#[cfg(test)]\nmod skeleton_tests {'
          if anchor not in text:
              raise SystemExit('test module anchor not found')

          diagnostic = r'''
pub fn diagnose_wr16_continuation(
    tables: &TwophaseTables,
    fmc_tables: &FmcTables,
) -> String {
    fn moves_json(moves: &[u8], tables: &TwophaseTables) -> Vec<String> {
        moves
            .iter()
            .map(|&m| tables.move_data.move_names[m as usize].clone())
            .collect()
    }

    let scramble = "R' U' F D2 L2 F R2 U2 R2 B D2 L B2 D' B2 L' R' B D2 B U2 L U2 R' U' F";
    let boundary_text = "U D' F R";
    let continuation_text = "D2 F' D2 U2 F' L2 D R2 D B2 F L2";

    let scramble_moves = parse_scramble(scramble, &tables.move_data).unwrap();
    let inverse_scramble = invert_moves(&scramble_moves);
    let boundary_original = parse_scramble(boundary_text, &tables.move_data).unwrap();
    let continuation_original = parse_scramble(continuation_text, &tables.move_data).unwrap();

    // Complementary frame DR=UD, EO=RL. This is the missing frame in which
    // U D' F R is a valid EO solution on the inverse scramble.
    let frame_map = build_move_conjugation(&[0, 1, 4, 5, 3, 2]);
    let map_moves = |moves: &[u8]| -> Vec<u8> {
        moves.iter().map(|&m| frame_map[m as usize]).collect()
    };
    let inverse_scramble_frame = map_moves(&inverse_scramble);
    let boundary = map_moves(&boundary_original);
    let continuation = map_moves(&continuation_original);

    let inverse_state = CubeState::solved().apply_moves(&inverse_scramble_frame, &tables.move_data);
    let boundary_state = inverse_state.apply_moves(&boundary, &tables.move_data);
    let switched_state = invert_state(&boundary_state);
    let exact_solved = switched_state
        .apply_moves(&continuation, &tables.move_data)
        .is_solved();

    let mut prefixes = Vec::new();
    let mut first_eo = None;
    let mut first_dr = None;
    for split in 0..=continuation.len() {
        let state = switched_state.apply_moves(&continuation[..split], &tables.move_data);
        let eo = encode_eo(&state.eo);
        let co = encode_co(&state.co);
        let slice = encode_slice_from_ep(&state.ep);
        let dr_distance = if eo == 0 {
            Some(fmc_tables.co_slice_dist[co * SLICE_SIZE + slice])
        } else {
            None
        };
        let p2_input = build_p2_input(&state);
        let p2_lower_bound = p2_input.as_ref().map(|input| {
            tables
                .phase2_cp_sep_joint
                .get(input.cp_idx * FACTORIAL_4[4] + input.sep_idx)
                .max(tables.phase2_ep.get(input.ep_idx))
        });
        if split > 0 && eo == 0 && first_eo.is_none() {
            first_eo = Some(split);
        }
        if split > 0 && eo == 0 && co == 0 && slice == tables.solved_slice as usize && first_dr.is_none() {
            first_dr = Some(split);
        }
        prefixes.push(serde_json::json!({
            "split": split,
            "prefix": moves_json(&continuation[..split], tables),
            "eo": eo,
            "co": co,
            "slice": slice,
            "drDistance": dr_distance,
            "p2Ready": p2_input.is_some(),
            "p2LowerBound": p2_lower_bound,
            "solved": state.is_solved(),
        }));
    }

    let switched_eo = encode_eo(&switched_state.eo);
    let eo_pool = find_eo_sequences(switched_eo, tables, fmc_tables, 7, 512, 0);
    let known_eo_len = first_eo.unwrap_or(continuation.len());
    let known_eo = continuation[..known_eo_len].to_vec();
    let known_eo_state = switched_state.apply_moves(&known_eo, &tables.move_data);
    let known_eo_key = fmc_state_key(&known_eo_state);
    let eo_exact_rank = eo_pool.iter().position(|candidate| candidate == &known_eo);
    let eo_state_rank = eo_pool.iter().position(|candidate| {
        fmc_state_key(&switched_state.apply_moves(candidate, &tables.move_data)) == known_eo_key
    });

    let mut dr_json = serde_json::Value::Null;
    if let (Some(eo_split), Some(dr_split)) = (first_eo, first_dr) {
        let state_after_eo = switched_state.apply_moves(&continuation[..eo_split], &tables.move_data);
        let known_dr = continuation[eo_split..dr_split].to_vec();
        let known_dr_state = state_after_eo.apply_moves(&known_dr, &tables.move_data);
        let known_dr_key = fmc_state_key(&known_dr_state);
        let routes = solve_dr_routes_via_rzp(
            &state_after_eo,
            fmc_tables,
            tables,
            14,
            last_face_of_moves(&continuation[..eo_split], tables),
            false,
        );
        let exact_rank = routes.iter().position(|route| route.moves == known_dr);
        let state_rank = routes.iter().position(|route| {
            fmc_state_key(&state_after_eo.apply_moves(&route.moves, &tables.move_data)) == known_dr_key
        });
        let route_summary: Vec<serde_json::Value> = routes
            .iter()
            .enumerate()
            .map(|(index, route)| {
                let endpoint = state_after_eo.apply_moves(&route.moves, &tables.move_data);
                let input = build_p2_input(&endpoint);
                let lower = input.as_ref().map(|input| {
                    tables
                        .phase2_cp_sep_joint
                        .get(input.cp_idx * FACTORIAL_4[4] + input.sep_idx)
                        .max(tables.phase2_ep.get(input.ep_idx))
                });
                serde_json::json!({
                    "rank": index,
                    "moves": moves_json(&route.moves, tables),
                    "length": route.moves.len(),
                    "rzpSetupLength": route.rzp_setup_len,
                    "p2LowerBound": lower,
                })
            })
            .collect();

        let known_p2 = continuation[dr_split..].to_vec();
        let p2_result = build_p2_input(&known_dr_state).map(|input| {
            let result = solve_phase2(&input, tables, 18, 64_000_000);
            let global: Vec<u8> = result
                .moves
                .iter()
                .map(|&local| tables.phase2_move_indices[local as usize])
                .collect();
            serde_json::json!({
                "ok": result.ok,
                "depth": result.depth,
                "nodes": result.nodes,
                "reason": result.reason,
                "moves": moves_json(&global, tables),
                "knownMoves": moves_json(&known_p2, tables),
                "knownLength": known_p2.len(),
                "exactMatch": global == known_p2,
            })
        });

        dr_json = serde_json::json!({
            "eoSplit": eo_split,
            "drSplit": dr_split,
            "knownDr": moves_json(&known_dr, tables),
            "knownDrLength": known_dr.len(),
            "routeCount": routes.len(),
            "exactRank": exact_rank,
            "stateRank": state_rank,
            "routes": route_summary,
            "p2": p2_result,
        });
    }

    serde_json::json!({
        "exactContinuationSolvesSwitchedState": exact_solved,
        "boundaryOriginal": boundary_text,
        "boundaryFrame": moves_json(&boundary, tables),
        "continuationOriginal": continuation_text,
        "continuationFrame": moves_json(&continuation, tables),
        "boundaryEoAfter": encode_eo(&boundary_state.eo),
        "switchedInitialEo": switched_eo,
        "firstEoSplit": first_eo,
        "firstDrSplit": first_dr,
        "prefixes": prefixes,
        "eoGeneration": {
            "known": moves_json(&known_eo, tables),
            "knownLength": known_eo.len(),
            "poolCount": eo_pool.len(),
            "exactRank": eo_exact_rank,
            "stateRank": eo_state_rank,
            "firstCandidates": eo_pool.iter().take(12).map(|m| moves_json(m, tables)).collect::<Vec<_>>(),
        },
        "drGeneration": dr_json,
    })
    .to_string()
}

'''
          path.write_text(text.replace(anchor, diagnostic + anchor, 1))
          PY

          mkdir -p solver-wasm/src/bin
          cat > solver-wasm/src/bin/wr16_diag.rs <<'RS'
          use solver_wasm::fmc_search::{build_fmc_tables, diagnose_wr16_continuation};
          use solver_wasm::twophase_bundle::load_bundle;

          fn main() {
              let bytes = std::fs::read("public/solver-wasm/twophase/twophase-333-v1.bin")
                  .expect("read twophase bundle");
              let tables = load_bundle(&bytes).expect("load twophase bundle");
              let fmc_tables = build_fmc_tables(&tables);
              println!("WR16_CONTINUATION_DIAGNOSTIC {}", diagnose_wr16_continuation(&tables, &fmc_tables));
          }
          RS

          cargo run --release --manifest-path solver-wasm/Cargo.toml --bin wr16_diag
