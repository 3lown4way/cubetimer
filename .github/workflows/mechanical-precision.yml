name: Mechanical precision regression
on:
  push:
    paths:
      - mechanical-lab.html
      - 'physics/**'
      - '.github/workflows/mechanical-precision.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Benchmark identical precise paths
        run: node physics/benchmark-max.mjs
      - name: Publish benchmark commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BENCH_OUTCOME: ${{ job.status }}
        run: |
          if [ "$BENCH_OUTCOME" = "success" ] && [ -f mechanical-bench-status.txt ]; then
            state=success
            description="$(cat mechanical-bench-status.txt)"
          else
            state=failure
            description="Mechanical precise-path regression failed"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="Mechanical precision benchmark" -f description="$description" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
