name: Apply Yau protected remaining centers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-yau-protected-centers.yml"
      - "tools/apply-yau-protected-centers.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Apply protected Yau patch
        run: python tools/apply-yau-protected-centers.py

      - name: Format patched Rust
        run: cargo fmt --manifest-path solver444-wasm/Cargo.toml --all

      - name: Test patched Rust
        run: |
          cargo test --manifest-path solver444-wasm/Cargo.toml --lib
          cargo clippy --manifest-path solver444-wasm/Cargo.toml --lib --tests -- -D warnings

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then cargo install wasm-pack --locked; fi

      - name: Rebuild browser WASM
        run: |
          rm -rf target/solver444-wasm-web
          wasm-pack build solver444-wasm --target web --out-dir ../target/solver444-wasm-web --out-name solver444_wasm --release
          cp target/solver444-wasm-web/solver444_wasm.js public/solver444-wasm/solver444_wasm.js
          cp target/solver444-wasm-web/solver444_wasm.d.ts public/solver444-wasm/solver444_wasm.d.ts
          cp target/solver444-wasm-web/solver444_wasm_bg.wasm public/solver444-wasm/solver444_wasm_bg.wasm
          cp target/solver444-wasm-web/solver444_wasm_bg.wasm.d.ts public/solver444-wasm/solver444_wasm_bg.wasm.d.ts

      - name: Validate Yau contracts
        run: |
          node --check solver/edgePairing444.js
          node --check solver/solver444.js
          node --check tools/verify-444-yau.mjs
          node tools/verify-444-yau.mjs
          node tools/verify-444-edge-323.mjs
          node tools/verify-444-public-notation.mjs
          git diff --check

      - name: Commit implementation
        run: |
          rm -f \
            .github/workflows/diagnose-yau-natural-cross3.yml \
            .github/workflows/apply-yau-natural-cross3-recompute.yml \
            tools/apply-yau-protected-centers.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Preserve cross pairs while solving Yau centers"
          git push origin HEAD:main
