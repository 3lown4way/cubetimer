#[serde(rename_all = "camelCase")]
struct YauRemainingCentersResponse {
    ok: bool,
    status: &'static str,
    reason: Option<String>,
    solution: String,
    move_count: usize,
    verified: bool,
    protected_cross_pair_count: u32,
    phase_move_counts: [usize; 4],
    table_build_ms: f64,
    search_ms: f64,
}

fn serialize_yau_remaining(value: &YauRemainingCentersResponse) -> String {
    serde_json::to_string(value).unwrap_or_else(|_| {
        r#"{"ok":false,"status":"error","reason":"444_YAU_CENTER_SERIALIZATION_FAILED","solution":"","moveCount":0,"verified":false,"protectedCrossPairCount":0,"phaseMoveCounts":[0,0,0,0],"tableBuildMs":0,"searchMs":0}"#.to_string()
    })
}

pub fn solve_444_yau_remaining_centers_boundary(request_json: &str) -> String {
    let request: Solve444Request = match serde_json::from_str(request_json) {
        Ok(request) => request,
        Err(error) => {
            return serialize_yau_remaining(&YauRemainingCentersResponse {
                ok: false,
                status: "invalid",
                reason: Some(format!("444_YAU_CENTER_INVALID_REQUEST:{error}")),
                solution: String::new(),
                move_count: 0,
                verified: false,
                protected_cross_pair_count: 0,
                phase_move_counts: [0; 4],
                table_build_ms: 0.0,
                search_ms: 0.0,
            });
        }
    };
    if deadline_reached(request.deadline_ts) {
        return serialize_yau_remaining(&YauRemainingCentersResponse {
            ok: false,
            status: "timeout",
            reason: Some("444_DEADLINE_REACHED".to_string()),
            solution: String::new(),
            move_count: 0,
            verified: false,
            protected_cross_pair_count: 0,
            phase_move_counts: [0; 4],
            table_build_ms: 0.0,
            search_ms: 0.0,
        });
    }
    let moves = match parse_alg444(&request.scramble) {
        Ok(moves) => moves,
        Err(error) => {
            return serialize_yau_remaining(&YauRemainingCentersResponse {
                ok: false,
                status: "invalid",
                reason: Some(format!("444_YAU_CENTER_INVALID_SCRAMBLE:{error}")),
                solution: String::new(),
                move_count: 0,
                verified: false,
                protected_cross_pair_count: 0,
                phase_move_counts: [0; 4],
                table_build_ms: 0.0,
                search_ms: 0.0,
            });
        }
    };
    let cross_color = match parse_cross_color(&request.cross_color) {
        Some(color) => color,
        None => {
            return serialize_yau_remaining(&YauRemainingCentersResponse {
                ok: false,
                status: "invalid",
                reason: Some("444_YAU_CENTER_INVALID_CROSS_COLOR".to_string()),
                solution: String::new(),
                move_count: 0,
                verified: false,
                protected_cross_pair_count: 0,
                phase_move_counts: [0; 4],
                table_build_ms: 0.0,
                search_ms: 0.0,
            });
        }
    };
    let mut state = Cube444::solved();
    state.apply_moves(&moves);
    if state.validate().is_err() {
        return serialize_yau_remaining(&YauRemainingCentersResponse {
            ok: false,
            status: "invalid",
            reason: Some("444_YAU_CENTER_STATE_INVALID".to_string()),
            solution: String::new(),
            move_count: 0,
            verified: false,
            protected_cross_pair_count: 0,
            phase_move_counts: [0; 4],
            table_build_ms: 0.0,
            search_ms: 0.0,
        });
    }
    let protected_before = crate::edges::paired_cross_edge_type_mask(&state, cross_color)
        .unwrap_or(0);
    let result = match solve_remaining_centers_for_yau(&state, request.deadline_ts, cross_color) {
        Ok(result) => result,
        Err(CenterSolveError::DeadlineReached) => {
            return serialize_yau_remaining(&YauRemainingCentersResponse {
                ok: false,
                status: "timeout",
                reason: Some("444_DEADLINE_REACHED".to_string()),
                solution: String::new(),
                move_count: 0,
                verified: false,
                protected_cross_pair_count: protected_before.count_ones(),
                phase_move_counts: [0; 4],
                table_build_ms: 0.0,
                search_ms: 0.0,
            });
        }
        Err(error) => {
            return serialize_yau_remaining(&YauRemainingCentersResponse {
                ok: false,
                status: "partial",
                reason: Some(format!("444_YAU_CENTER_SEARCH_FAILED:{error}")),
                solution: String::new(),
                move_count: 0,
                verified: false,
                protected_cross_pair_count: protected_before.count_ones(),
                phase_move_counts: [0; 4],
                table_build_ms: 0.0,
                search_ms: 0.0,
            });
        }
    };
    let mut verified_state = state;
    verified_state.apply_moves(&result.moves);
    let protected_after = crate::edges::paired_cross_edge_type_mask(&verified_state, cross_color)
        .unwrap_or(0);
    let verified = verified_state.centers_solved()
        && verified_state.validate().is_ok()
        && protected_after & protected_before == protected_before;
    serialize_yau_remaining(&YauRemainingCentersResponse {
        ok: verified,
        status: if verified { "ok" } else { "error" },
        reason: (!verified).then(|| "444_YAU_CENTER_VERIFICATION_FAILED".to_string()),
        solution: if verified { format_moves(&result.moves) } else { String::new() },
        move_count: if verified { result.moves.len() } else { 0 },
        verified,
        protected_cross_pair_count: protected_before.count_ones(),
        phase_move_counts: result.phase_move_counts,
        table_build_ms: result.table_build_ms,
        search_ms: result.search_ms,
    })
}

#[wasm_bindgen]
pub fn solve_444_yau_remaining_centers_json(request_json: &str) -> String {
    solve_444_yau_remaining_centers_boundary(request_json)
}

