name: Phase transposition table

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  benchmark-and-validate:
    if: github.head_ref == 'agent/phase-transposition-table'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Validate helper scripts
        run: |
          python -m py_compile tools/apply-phase-transposition-table.py
          node --check tools/benchmark-phase-transposition-table.mjs
          node --check tools/compare-phase-transposition-table.mjs

      - name: Capture Map baseline
        run: node --expose-gc tools/benchmark-phase-transposition-table.mjs > /tmp/phase-tt-baseline.json

      - name: Apply typed-array transposition tables
        run: python tools/apply-phase-transposition-table.py

      - name: Run solver regression checks
        run: |
          node --check solver/solver3x3Phase/phase1.js
          node --check solver/solver3x3Phase/phase2.js
          node benchmark-solver-versions.mjs
          node benchmark-cfop-10.mjs
          node benchmark-hotpaths.mjs
          node benchmark-twophase-frontiers.mjs

      - name: Compare phase-search benchmark
        run: |
          node --expose-gc tools/benchmark-phase-transposition-table.mjs > /tmp/phase-tt-optimized.json
          node tools/compare-phase-transposition-table.mjs /tmp/phase-tt-baseline.json /tmp/phase-tt-optimized.json

      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add solver/solver3x3Phase/phase1.js solver/solver3x3Phase/phase2.js
          git commit -m 'Use fixed phase transposition tables'
          git push origin HEAD:${{ github.head_ref }}
