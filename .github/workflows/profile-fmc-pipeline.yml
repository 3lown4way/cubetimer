name: Profile FMC pipeline

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-fmc-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - name: Apply compact HTR table
        run: node tools/apply-fmc-htr-coordinate-table.mjs
      - name: Validate sources
        run: |
          node --check benchmark-fmc-profile.mjs
          node --check benchmark-fmc-feature-case.mjs
          node --check benchmark-fmc-feature-matrix.mjs
          node --check tools/apply-fmc-htr-coordinate-table.mjs
          cargo fmt --manifest-path solver-wasm/Cargo.toml -- --check
          cargo test --manifest-path solver-wasm/Cargo.toml --lib
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build browser WASM
        working-directory: solver-wasm
        run: wasm-pack build --release --target web --out-dir ../public/solver-wasm
      - name: Profile isolated FMC features
        run: node benchmark-fmc-feature-matrix.mjs
      - name: Commit validated HTR implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver-wasm/src/fmc_search.rs
          git add -f \
            public/solver-wasm/solver_wasm.js \
            public/solver-wasm/solver_wasm.d.ts \
            public/solver-wasm/solver_wasm_bg.wasm \
            public/solver-wasm/solver_wasm_bg.wasm.d.ts
          if git diff --cached --quiet; then
            echo "Compact HTR implementation already committed"
            exit 0
          fi
          git commit -m "Use compact bounded HTR coordinates in FMC"
          git push origin "HEAD:${TARGET_BRANCH}"
