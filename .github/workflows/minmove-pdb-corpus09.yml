name: Minmove PDB corpus-09

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate benchmark
        run: node --check benchmark-minmove-pdb-corpus09.mjs
      - name: Prove corpus-09 optimum with HTM PDB
        run: node benchmark-minmove-pdb-corpus09.mjs
