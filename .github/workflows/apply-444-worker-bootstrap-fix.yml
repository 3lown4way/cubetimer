name: Apply 4x4 worker bootstrap recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-444-worker-bootstrap-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch 4x4 worker bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('solver/solver444UiActivation.js')
          s = p.read_text()

          s = s.replace(
              'const SOLVE_TIMEOUT_MS = 60_000;\nconst INSTALL_KEY = "__cubeTimer444UiActivationInstalled";',
              'const SOLVE_TIMEOUT_MS = 60_000;\nconst WORKER_BOOT_TIMEOUT_MS = 8_000;\nconst WORKER_CALL_GRACE_MS = 5_000;\nconst WORKER_BUILD_TOKEN = "20260808-444-bootstrap-1";\nconst INSTALL_KEY = "__cubeTimer444UiActivationInstalled";',
              1,
          )

          old = '''function createWorkerClient() {\n  const worker = new Worker(new URL("./solverWorker.js", import.meta.url), { type: "module" });\n  const api = wrap(worker);\n  return { worker, api };\n}\n'''
          new = '''function createWorkerClient(forceReload = false) {\n  const workerUrl = new URL("./solverWorker.js", import.meta.url);\n  workerUrl.searchParams.set("v", WORKER_BUILD_TOKEN);\n  if (forceReload) workerUrl.searchParams.set("reload", String(Date.now()));\n  const worker = new Worker(workerUrl, { type: "module" });\n  const api = wrap(worker);\n  return { worker, api };\n}\n\nfunction withUiTimeout(promise, timeoutMs, reason) {\n  return new Promise((resolve, reject) => {\n    const timer = window.setTimeout(() => reject(new Error(reason)), timeoutMs);\n    Promise.resolve(promise).then(\n      (value) => {\n        window.clearTimeout(timer);\n        resolve(value);\n      },\n      (error) => {\n        window.clearTimeout(timer);\n        reject(error);\n      },\n    );\n  });\n}\n\nfunction waitForWorkerPing(client) {\n  return new Promise((resolve, reject) => {\n    let settled = false;\n    const finish = (callback, value) => {\n      if (settled) return;\n      settled = true;\n      window.clearTimeout(timer);\n      client.worker.removeEventListener("error", onError);\n      client.worker.removeEventListener("messageerror", onMessageError);\n      callback(value);\n    };\n    const onError = () => finish(reject, new Error("444_WORKER_BOOT_ERROR"));\n    const onMessageError = () => finish(reject, new Error("444_WORKER_MESSAGE_ERROR"));\n    const timer = window.setTimeout(\n      () => finish(reject, new Error("444_WORKER_BOOT_TIMEOUT")),\n      WORKER_BOOT_TIMEOUT_MS,\n    );\n    client.worker.addEventListener("error", onError);\n    client.worker.addEventListener("messageerror", onMessageError);\n    Promise.resolve(client.api.ping()).then(\n      (value) => finish(resolve, value),\n      (error) => finish(reject, error),\n    );\n  });\n}\n'''
          if old not in s:
              raise SystemExit('createWorkerClient anchor missing')
          s = s.replace(old, new, 1)

          s = s.replace(
              '    case "444_WORKER_FAILED":\n      return "4×4 솔버 Worker 실행 중 오류가 발생했습니다.";',
              '    case "444_WORKER_BOOT_TIMEOUT":\n      return "4×4 Worker 준비가 지연되어 새 Worker로 다시 연결하지 못했습니다.";\n    case "444_WORKER_BOOT_ERROR":\n    case "444_WORKER_MESSAGE_ERROR":\n      return "4×4 Worker를 불러오지 못했습니다. 새 버전으로 다시 연결해 주세요.";\n    case "444_WORKER_FAILED":\n      return "4×4 솔버 Worker 실행 중 오류가 발생했습니다.";',
              1,
          )

          old = '''  async function ensureWorker() {\n    if (worker && solverApi) return solverApi;\n    const client = createWorkerClient();\n    worker = client.worker;\n    solverApi = client.api;\n    await solverApi.ping();\n    return solverApi;\n  }\n'''
          new = '''  async function ensureWorker() {\n    if (worker && solverApi) return solverApi;\n    let lastError = null;\n    for (let attempt = 0; attempt < 2; attempt += 1) {\n      const client = createWorkerClient(attempt > 0);\n      try {\n        const pong = await waitForWorkerPing(client);\n        if (pong?.ok !== true) throw new Error("444_WORKER_BOOT_ERROR");\n        worker = client.worker;\n        solverApi = client.api;\n        return solverApi;\n      } catch (error) {\n        lastError = error;\n        client.worker.terminate();\n      }\n    }\n    throw lastError || new Error("444_WORKER_BOOT_ERROR");\n  }\n'''
          if old not in s:
              raise SystemExit('ensureWorker anchor missing')
          s = s.replace(old, new, 1)

          s = s.replace(
              '      const api = await ensureWorker();\n      if (activeRun !== runId || !is444()) return;\n      const deadlineTs = Date.now() + SOLVE_TIMEOUT_MS;\n      const result = await api.solve(',
              '      const api = await ensureWorker();\n      if (activeRun !== runId || !is444()) return;\n      setStatus("4×4 Worker 연결 완료 · 엔진을 초기화하고 있습니다...");\n      const deadlineTs = Date.now() + SOLVE_TIMEOUT_MS;\n      const result = await withUiTimeout(api.solve(',
              1,
          )
          s = s.replace(
              '''        }),\n      );\n      if (activeRun !== runId || !is444() || currentScramble() !== scramble) return;''',
              '''        }),\n        SOLVE_TIMEOUT_MS + WORKER_CALL_GRACE_MS,\n        "444_UI_SOLVE_TIMEOUT",\n      );\n      if (activeRun !== runId || !is444() || currentScramble() !== scramble) return;''',
              1,
          )

          old = '''    } catch (error) {\n      if (activeRun === runId && is444()) {\n        renderFailure({ reason: "444_WORKER_FAILED", detail: error?.message || error });\n      }\n      disposeWorker();\n'''
          new = '''    } catch (error) {\n      if (activeRun === runId && is444()) {\n        const message = String(error?.message || error || "444_WORKER_FAILED");\n        const reason = message === "444_UI_SOLVE_TIMEOUT"\n          ? "444_DEADLINE_REACHED"\n          : message.startsWith("444_WORKER_")\n            ? message\n            : "444_WORKER_FAILED";\n        renderFailure({ reason, detail: message });\n      }\n      disposeWorker();\n'''
          if old not in s:
              raise SystemExit('catch anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('solver/nxnTwistyPreview.js')
          s = p.read_text()
          old = '  void import("./solver444UiActivation.js")'
          new = '  void import("./solver444UiActivation.js?v=20260808-444-bootstrap-1")'
          if old not in s:
              raise SystemExit('activation import anchor missing')
          p.write_text(s.replace(old, new, 1))

          Path('tools/verify-444-ui-worker-bootstrap.mjs').write_text(r'''import assert from "node:assert/strict";\nimport fs from "node:fs";\n\nconst ui = fs.readFileSync(new URL("../solver/solver444UiActivation.js", import.meta.url), "utf8");\nconst preview = fs.readFileSync(new URL("../solver/nxnTwistyPreview.js", import.meta.url), "utf8");\n\nassert.match(ui, /WORKER_BOOT_TIMEOUT_MS = 8_000/);\nassert.match(ui, /workerUrl\.searchParams\.set\("v", WORKER_BUILD_TOKEN\)/);\nassert.match(ui, /workerUrl\.searchParams\.set\("reload", String\(Date\.now\(\)\)\)/);\nassert.match(ui, /client\.worker\.addEventListener\("error", onError\)/);\nassert.match(ui, /client\.worker\.addEventListener\("messageerror", onMessageError\)/);\nassert.match(ui, /for \(let attempt = 0; attempt < 2; attempt \+= 1\)/);\nassert.match(ui, /withUiTimeout\(api\.solve\(/);\nassert.match(preview, /solver444UiActivation\.js\?v=20260808-444-bootstrap-1/);\nconsole.log("4x4 UI worker bootstrap timeout, retry, and cache-bust contract passed");\n''')
          PY
      - name: Validate fix
        run: |
          node --check solver/solver444UiActivation.js
          node --check solver/nxnTwistyPreview.js
          node tools/verify-444-ui-worker-bootstrap.mjs
          node tools/verify-nxn-solver-preview.mjs
          node tools/verify-444-worker-boundary.mjs
          git diff --check
      - name: Commit runtime fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solver/solver444UiActivation.js solver/nxnTwistyPreview.js tools/verify-444-ui-worker-bootstrap.mjs
          git commit -m "Recover stalled 4x4 worker bootstrap"
          git push origin HEAD:main
