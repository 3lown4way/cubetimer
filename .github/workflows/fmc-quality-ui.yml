name: FMC quality UI validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'main.js'
      - 'tools/apply-fmc-quality-ui.py'
      - 'tools/fix-fmc-quality-ui-transform.py'
      - '.github/workflows/fmc-quality-ui.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Narrow ambiguous transform anchor
        run: python3 tools/fix-fmc-quality-ui-transform.py

      - name: Apply FMC quality UI
        run: python3 tools/apply-fmc-quality-ui.py

      - name: Check JavaScript syntax
        run: node --check main.js

      - name: Verify UI wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html').read_text()
          main = Path('main.js').read_text()

          assertions = {
              'selector': 'id="fmcQualitySelect"' in index,
              'sweet option': 'value="sweetSpot"' in index,
              'extreme option': 'value="extreme"' in index,
              'conditional field': 'id="fmcQualityField" hidden' in index,
              'default state': 'fmcQualityMode: "sweetSpot"' in main,
              'state validation': 'VALID_FMC_QUALITY_MODES.has(parsed.settings.fmcQualityMode)' in main,
              'visibility': 'fmcQualityField.hidden = !isFmcMode' in main,
              'persistence listener': 'fmcQualitySelect?.addEventListener("change"' in main,
              'worker forwarding': 'fmcQualityMode,\n        f2lMethod,' in main,
              'completion metadata': 'FMC Extreme' in main and 'FMC Sweet Spot' in main,
          }
          failed = [name for name, ok in assertions.items() if not ok]
          if failed:
              raise SystemExit(f'FMC_QUALITY_UI_ASSERTIONS_FAILED:{failed}')
          print(assertions)
          PY

      - name: Commit production UI and remove validation files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html main.js
          git rm -f .github/workflows/fmc-quality-ui.yml tools/apply-fmc-quality-ui.py tools/fix-fmc-quality-ui-transform.py
          git commit -m "Expose FMC quality presets in solver UI"
          git push origin HEAD:${{ github.head_ref }}
