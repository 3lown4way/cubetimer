name: FMC six-frame coverage experiment

on:
  pull_request:
    types: [opened]
    branches:
      - agent/fmc-extreme-independent-frontier-v2

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      FMC_GENERALIZATION_FIXED_COUNT: 6
      FMC_GENERALIZATION_COMPRESSION_COUNT: 2
    steps:
      - name: Check out FMC branch
        uses: actions/checkout@v4
        with:
          ref: agent/fmc-extreme-independent-frontier-v2
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create development benchmark
        run: |
          cat > /tmp/fmc-six-frame-dev.mjs <<'NODE'
          import fs from "node:fs";
          import { performance } from "node:perf_hooks";
          import { buildFmcTablesWasm, solveFmcWasm, verifyFmcSolutionWasm } from `${process.cwd()}/solver/wasmSolver.js`;

          const corpus = JSON.parse(fs.readFileSync("tools/fmc-generalization-corpus.json", "utf8"));
          const profile = {
            maxPremoveSets: 24,
            searchLevel: 3,
            searchVariant: 7,
            incumbentMoveCount: 34,
            forceRzp: false,
            enableCoverageFallback: true,
            enableMultiSwitchNiss: true,
            enableDeepMultiSwitchNiss: true,
            enableHtrSkeletons: true,
            enableSliceInsertion: true,
            enableMultiInsertion: true,
            enableDrFlip: true,
          };
          if (!(await buildFmcTablesWasm())) throw new Error("FMC_TABLE_BUILD_FAILED");
          const rows = [];
          for (const testCase of corpus.developmentCases.slice(0, 3)) {
            const started = performance.now();
            const result = await solveFmcWasm(testCase.scramble, profile);
            const elapsedMs = Math.round(performance.now() - started);
            if (!result?.ok || !result.solution) throw new Error(`DEV_SOLVE_FAILED:${testCase.id}`);
            const verification = await verifyFmcSolutionWasm(testCase.scramble, result.solution);
            if (!verification?.ok || verification.solved !== true) throw new Error(`DEV_INVALID:${testCase.id}`);
            rows.push({
              id: testCase.id,
              known: testCase.knownMoveCount,
              found: result.moveCount,
              elapsedMs,
              source: result.source,
              solution: result.solution,
            });
          }
          const output = {
            averageMoves: rows.reduce((sum, row) => sum + row.found, 0) / rows.length,
            averageMs: rows.reduce((sum, row) => sum + row.elapsedMs, 0) / rows.length,
            rows,
          };
          fs.writeFileSync(process.argv[2], JSON.stringify(output, null, 2));
          console.log(`SIX_FRAME_DEV ${JSON.stringify(output)}`);
          NODE

      - name: Capture baseline
        run: |
          node tools/benchmark-fmc-generalization.mjs --out /tmp/six-frame-baseline-holdout.json
          node /tmp/fmc-six-frame-dev.mjs /tmp/six-frame-baseline-dev.json

      - name: Apply six-frame EO-DR coverage patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("solver-wasm/src/fmc_search.rs")
          text = path.read_text()

          old_maps = '''/// Axis scramble maps in JS face convention.
          const AXIS_SCRAMBLE_MAPS_JS: [[u8; 6]; 3] = [
              [0, 1, 2, 3, 4, 5], // UD: identity
              [5, 4, 2, 3, 0, 1], // FB: U→B, D→F, R→R, L→L, F→U, B→D
              [2, 3, 1, 0, 4, 5], // RL: U→R, D→L, R→D, L→U, F→F, B→B
          ];

          /// Axis solution maps (inverse of scramble maps) in JS face convention.
          const AXIS_SOLUTION_MAPS_JS: [[u8; 6]; 3] = [
              [0, 1, 2, 3, 4, 5], // UD: identity
              [4, 5, 2, 3, 1, 0], // FB: U→F, D→B, R→R, L→L, F→D, B→U
              [3, 2, 0, 1, 4, 5], // RL: U→L, D→R, R→U, L→D, F→F, B→B
          ];

          const AXIS_NAMES: [&str; 3] = ["UD", "FB", "RL"];'''.replace('          ', '')

          new_maps = '''/// A DR axis has two distinct EO-axis choices. FMC therefore has six
          /// orientation frames, not only the three DR-axis labels.
          const FMC_FRAME_COUNT: usize = 6;
          const AXIS_SCRAMBLE_MAPS_JS: [[u8; 6]; FMC_FRAME_COUNT] = [
              [0, 1, 2, 3, 4, 5], // DR UD, EO FB
              [5, 4, 2, 3, 0, 1], // DR FB, EO UD
              [2, 3, 1, 0, 4, 5], // DR RL, EO FB
              [0, 1, 4, 5, 3, 2], // DR UD, EO RL
              [2, 3, 4, 5, 0, 1], // DR FB, EO RL
              [4, 5, 0, 1, 2, 3], // DR RL, EO UD
          ];

          /// Inverse conjugations for converting solutions back to the original frame.
          const AXIS_SOLUTION_MAPS_JS: [[u8; 6]; FMC_FRAME_COUNT] = [
              [0, 1, 2, 3, 4, 5],
              [4, 5, 2, 3, 1, 0],
              [3, 2, 0, 1, 4, 5],
              [0, 1, 5, 4, 2, 3],
              [4, 5, 0, 1, 2, 3],
              [2, 3, 4, 5, 0, 1],
          ];

          const AXIS_NAMES: [&str; FMC_FRAME_COUNT] = [
              "UD", "FB", "RL", "UD_EO_RL", "FB_EO_RL", "RL_EO_UD",
          ];'''.replace('          ', '')

          if old_maps not in text:
              raise SystemExit("axis map anchor not found")
          text = text.replace(old_maps, new_maps, 1)

          text = text.replace(
              'pub axis_scramble_move_map: [[u8; 18]; 3],',
              'pub axis_scramble_move_map: [[u8; 18]; FMC_FRAME_COUNT],',
              1,
          )
          text = text.replace(
              'pub axis_solution_move_map: [[u8; 18]; 3],',
              'pub axis_solution_move_map: [[u8; 18]; FMC_FRAME_COUNT],',
              1,
          )
          text = text.replace(
              'let mut axis_scramble_move_map = [[0u8; 18]; 3];\n    let mut axis_solution_move_map = [[0u8; 18]; 3];\n    for i in 0..3 {',
              'let mut axis_scramble_move_map = [[0u8; 18]; FMC_FRAME_COUNT];\n    let mut axis_solution_move_map = [[0u8; 18]; FMC_FRAME_COUNT];\n    for i in 0..FMC_FRAME_COUNT {',
              1,
          )

          text = text.replace(
              'let direct_axis_states: [CubeState; 3] = std::array::from_fn(|axis| {',
              'let direct_axis_states: [CubeState; FMC_FRAME_COUNT] = std::array::from_fn(|axis| {',
              1,
          )
          text = text.replace(
              '// --- Phase 1: Direct solve across 3 axes ---\n    for axis in 0..3u8 {',
              '// --- Phase 1: Direct solve across all EO/DR frames ---\n    let frame_count = if search_level >= 3 { FMC_FRAME_COUNT } else { 3 };\n    for axis in 0..frame_count as u8 {',
              1,
          )
          text = text.replace(
              '// --- Phase 2: NISS (inverse scramble) across 3 axes ---',
              '// --- Phase 2: NISS (inverse scramble) across all EO/DR frames ---',
              1,
          )
          text = text.replace(
              'let inverse_axis_states: [CubeState; 3] = std::array::from_fn(|axis| {',
              'let inverse_axis_states: [CubeState; FMC_FRAME_COUNT] = std::array::from_fn(|axis| {',
              1,
          )
          # Replace only the NISS base loop immediately after inverse states.
          inverse_anchor = '''    });
              for axis in 0..3u8 {
                  let state = inverse_axis_states[axis as usize];'''.replace('              ', '')
          inverse_replacement = '''    });
              for axis in 0..frame_count as u8 {
                  let state = inverse_axis_states[axis as usize];'''.replace('              ', '')
          if inverse_anchor not in text:
              raise SystemExit("inverse axis loop anchor not found")
          text = text.replace(inverse_anchor, inverse_replacement, 1)

          path.write_text(text)
          PY
          rustfmt solver-wasm/src/fmc_search.rs
          grep -n "FMC_FRAME_COUNT\|UD_EO_RL\|frame_count" solver-wasm/src/fmc_search.rs

      - name: Test Rust and rebuild WASM
        run: |
          cargo test --release --manifest-path solver-wasm/Cargo.toml
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --locked
          fi
          cd solver-wasm
          wasm-pack build --target web --out-dir ../public/solver-wasm

      - name: Compare patched solver
        run: |
          node tools/benchmark-fmc-generalization.mjs --baseline /tmp/six-frame-baseline-holdout.json --out /tmp/six-frame-patched-holdout.json
          node /tmp/fmc-six-frame-dev.mjs /tmp/six-frame-patched-dev.json
          python3 - <<'PY'
          import json
          base = json.load(open('/tmp/six-frame-baseline-dev.json'))
          patched = json.load(open('/tmp/six-frame-patched-dev.json'))
          holdout = json.load(open('/tmp/six-frame-patched-holdout.json'))
          comparison = []
          improved = False
          regressed = False
          for before, after in zip(base['rows'], patched['rows']):
              delta = after['found'] - before['found']
              comparison.append({
                  'id': before['id'],
                  'before': before['found'],
                  'after': after['found'],
                  'delta': delta,
                  'source': after['source'],
                  'solution': after['solution'],
              })
              improved |= delta < 0
              regressed |= delta > 0
          print('SIX_FRAME_COMPARISON', json.dumps({
              'development': comparison,
              'holdoutGate': holdout['gate'],
              'holdoutComparison': holdout['comparison'],
          }))
          if not holdout['gate']['passed']:
              raise SystemExit('holdout gate failed')
          if regressed:
              raise SystemExit('development case regressed')
          if not improved:
              raise SystemExit('no development case improved')
          PY

      - name: Commit retained six-frame coverage
        run: |
          git add solver-wasm/src/fmc_search.rs public/solver-wasm/solver_wasm.js public/solver-wasm/solver_wasm_bg.wasm public/solver-wasm/solver_wasm_bg.wasm.d.ts public/solver-wasm/solver_wasm.d.ts
          git diff --cached --quiet && { echo "No retained changes"; exit 1; }
          git commit -m "Cover all six FMC EO-DR frames"
          git push origin HEAD:agent/fmc-extreme-independent-frontier-v2
