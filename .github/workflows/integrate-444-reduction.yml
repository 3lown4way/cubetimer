name: Integrate 4x4 reduction bridge

on:
  push:
    branches:
      - agent/444-parity-virtual333
    paths:
      - "solver444-wasm/**"
      - "solver/solver444.js"
      - "tools/verify-444-worker-boundary.mjs"
      - "docs/solver444-parity-virtual333.md"
      - ".github/workflows/integrate-444-reduction.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/444-parity-virtual333
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Rust and JavaScript
        run: |
          cargo fmt --manifest-path solver444-wasm/Cargo.toml --all -- --check
          cargo test --manifest-path solver444-wasm/Cargo.toml --lib -- --nocapture
          cargo clippy --manifest-path solver444-wasm/Cargo.toml --lib --tests -- -D warnings
          node --check solver/solver444.js
          node --check tools/verify-444-worker-boundary.mjs
      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --locked
          fi
      - name: Rebuild browser WASM package
        run: |
          wasm-pack build solver444-wasm \
            --target web \
            --out-dir ../public/solver444-wasm \
            --out-name solver444_wasm \
            --release
          cat > public/solver444-wasm/README.md <<'EOF'
          # 4×4 solver browser package

          This checked-in package is generated from `solver444-wasm` and loaded lazily only for `eventId === "444"`.

          The current API version is `444-reduction-v1`. It independently verifies Centers, Edge Pairing, Parity Normalization, and a legal virtual 3×3 `cp/co/ep/eo` projection. The top-level result remains partial with an empty final solution until the Two-Phase cubie bridge and final 96-facelet verification are complete.

          Rebuild with:

          ```bash
          wasm-pack build solver444-wasm \
            --target web \
            --out-dir ../public/solver444-wasm \
            --out-name solver444_wasm \
            --release
          ```
          EOF
      - name: Verify real WASM boundary
        run: node tools/verify-444-worker-boundary.mjs
      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/test-444-parity.yml
          rm -f .github/workflows/integrate-444-reduction.yml
      - name: Validate repository diff
        run: git diff --check
      - name: Commit verified reduction bridge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Integrate the verified 4x4 reduction bridge"
          git push
