name: Minmove status regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "solver/minmoveExactV2.js"
      - "benchmark-minmove-exact-v2.mjs"
      - "benchmark-minmove-seed-frontier.mjs"
      - ".github/workflows/minmove-status-regression.yml"

permissions:
  contents: read

concurrency:
  group: minmove-status-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate source
        run: |
          node --check solver/minmoveExactV2.js
          node --check benchmark-minmove-exact-v2.mjs
          node --check benchmark-minmove-seed-frontier.mjs

      - name: Profile non-inverse seed frontier coverage
        run: node benchmark-minmove-seed-frontier.mjs

      - name: Verify exact minmove never exposes literal inverse
        run: node benchmark-minmove-exact-v2.mjs
