name: FMC multi-switch NISS validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply multi-switch NISS
        run: |
          if grep -q "enable_multi_switch_niss" solver-wasm/src/fmc_search.rs; then
            echo "Production transform already applied"
          else
            python3 tools/apply-fmc-multi-switch-niss.py
          fi

      - name: Format Rust
        run: cargo fmt --manifest-path solver-wasm/Cargo.toml

      - name: Run Rust release tests
        run: cargo test --manifest-path solver-wasm/Cargo.toml --release

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Rebuild release WASM
        working-directory: solver-wasm
        run: wasm-pack build --target web --release --out-dir ../public/solver-wasm

      - name: Restore generated ignore files
        run: git restore --source=HEAD -- .gitignore public/solver-wasm/.gitignore 2>/dev/null || true

      - name: Benchmark full EO and DR boundaries
        env:
          FMC_MULTI_NISS_RUNS: '100'
          FMC_MULTI_NISS_PREMOVES: '40'
          FMC_MULTI_NISS_LABEL: full
        run: node tools/verify-fmc-multi-switch-niss.mjs

      - name: Save full implementation
        run: cp solver-wasm/src/fmc_search.rs /tmp/fmc_search_full.rs

      - name: Benchmark EO boundaries only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('solver-wasm/src/fmc_search.rs')
          s = p.read_text()
          old = '[best_eo, best_dr].into_iter().flatten().collect()'
          new = '[best_eo, None].into_iter().flatten().collect()'
          if s.count(old) != 1:
              raise SystemExit(f'EO-only anchor count: {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          (cd solver-wasm && wasm-pack build --target web --release --out-dir ../public/solver-wasm)
          FMC_MULTI_NISS_RUNS=100 FMC_MULTI_NISS_PREMOVES=40 FMC_MULTI_NISS_LABEL=eo-only node tools/verify-fmc-multi-switch-niss.mjs

      - name: Benchmark DR boundaries only
        run: |
          cp /tmp/fmc_search_full.rs solver-wasm/src/fmc_search.rs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('solver-wasm/src/fmc_search.rs')
          s = p.read_text()
          old = '[best_eo, best_dr].into_iter().flatten().collect()'
          new = '[None, best_dr].into_iter().flatten().collect()'
          if s.count(old) != 1:
              raise SystemExit(f'DR-only anchor count: {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          (cd solver-wasm && wasm-pack build --target web --release --out-dir ../public/solver-wasm)
          FMC_MULTI_NISS_RUNS=100 FMC_MULTI_NISS_PREMOVES=40 FMC_MULTI_NISS_LABEL=dr-only node tools/verify-fmc-multi-switch-niss.mjs

      - name: Restore full production WASM
        run: |
          cp /tmp/fmc_search_full.rs solver-wasm/src/fmc_search.rs
          (cd solver-wasm && wasm-pack build --target web --release --out-dir ../public/solver-wasm)
          git restore --source=HEAD -- .gitignore public/solver-wasm/.gitignore 2>/dev/null || true

      - name: Commit production implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver-wasm/src/fmc_search.rs solver-wasm/src/lib.rs solver/wasmSolver.js public/solver-wasm/solver_wasm_bg.wasm
          git add public/solver-wasm/solver_wasm.js public/solver-wasm/solver_wasm.d.ts public/solver-wasm/solver_wasm_bg.wasm.d.ts public/solver-wasm/package.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No production changes to commit"
          else
            git commit -m "Add opt-in FMC multi-switch NISS"
            git push origin HEAD:${{ github.head_ref }}
          fi
