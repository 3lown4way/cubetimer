name: FMC multi-switch NISS validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply base multi-switch NISS
        run: |
          if grep -q "enable_multi_switch_niss" solver-wasm/src/fmc_search.rs; then
            echo "Base production transform already applied"
          else
            python3 tools/apply-fmc-multi-switch-niss.py
          fi

      - name: Apply tiered standard and deep modes
        run: |
          if grep -q "enable_deep_multi_switch_niss" solver-wasm/src/fmc_search.rs; then
            echo "Tiered production refinement already applied"
          else
            python3 tools/refine-fmc-multi-switch-niss.py
          fi

      - name: Format Rust
        run: cargo fmt --manifest-path solver-wasm/Cargo.toml

      - name: Run Rust release tests
        run: cargo test --manifest-path solver-wasm/Cargo.toml --release

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Rebuild release WASM
        working-directory: solver-wasm
        run: wasm-pack build --target web --release --out-dir ../public/solver-wasm

      - name: Restore generated ignore files
        run: git restore --source=HEAD -- .gitignore public/solver-wasm/.gitignore 2>/dev/null || true

      - name: Benchmark baseline standard and deep modes
        env:
          FMC_MULTI_NISS_RUNS: '1000'
          FMC_MULTI_NISS_PREMOVES: '40'
        run: node tools/verify-fmc-multi-switch-niss-1000.mjs

      - name: Commit production implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver-wasm/src/fmc_search.rs solver-wasm/src/lib.rs solver/wasmSolver.js public/solver-wasm/solver_wasm_bg.wasm
          git add public/solver-wasm/solver_wasm.js public/solver-wasm/solver_wasm.d.ts public/solver-wasm/solver_wasm_bg.wasm.d.ts public/solver-wasm/package.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No production changes to commit"
          else
            git commit -m "Tier FMC multi-switch NISS modes"
            git push origin HEAD:${{ github.head_ref }}
          fi
