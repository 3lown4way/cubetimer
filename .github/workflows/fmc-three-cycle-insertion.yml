name: FMC three-cycle insertion validation

on:
  push:
    branches:
      - agent/fmc-three-cycle-insertion

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[fmc-insertion-built]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fmc-three-cycle-insertion
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: taiki-e/install-action@wasm-pack

      - name: Preserve stage-1 baseline
        run: cp -a public/solver-wasm /tmp/fmc-stage1-baseline

      - name: Apply three-cycle insertion implementation
        run: |
          python .github/scripts/apply_fmc_three_cycle_insertion.py
          python .github/scripts/apply_fmc_three_cycle_metrics.py
          rustfmt --edition 2021 solver-wasm/src/fmc_search.rs solver-wasm/src/lib.rs

      - name: Test Rust
        run: cargo test --manifest-path solver-wasm/Cargo.toml --release

      - name: Build release WASM
        working-directory: solver-wasm
        run: wasm-pack build --release --target web --out-dir ../public/solver-wasm

      - name: Verify insertion validity, quality, and runtime
        run: |
          cat > /tmp/validate-fmc-three-cycle.mjs <<'NODE'
          import fs from 'node:fs';
          import { pathToFileURL } from 'node:url';
          import { performance } from 'node:perf_hooks';

          async function load(dir) {
            const moduleUrl = pathToFileURL(`${dir}/solver_wasm.js`).href;
            const mod = await import(moduleUrl);
            await mod.default(fs.readFileSync(`${dir}/solver_wasm_bg.wasm`));
            mod.load_twophase_333_bundle(
              fs.readFileSync('public/solver-wasm/twophase/twophase-333-v1.bin')
            );
            const start = performance.now();
            const built = JSON.parse(mod.build_fmc_tables_wasm());
            const buildMs = performance.now() - start;
            if (!built.ok) throw new Error(`FMC table build failed: ${JSON.stringify(built)}`);
            return { mod, built, buildMs };
          }

          function makeScrambles(count) {
            let x = 0x6d2b79f5;
            const faces = ['U', 'R', 'F', 'D', 'L', 'B'];
            const suffixes = ['', "'", '2'];
            const opposite = [3, 4, 5, 0, 1, 2];
            const output = [];
            const next = () => {
              x ^= x << 13;
              x ^= x >>> 17;
              x ^= x << 5;
              return x >>>= 0;
            };
            for (let sample = 0; sample < count; sample++) {
              const moves = [];
              let lastFace = -1;
              for (let index = 0; index < 21; index++) {
                let face;
                do {
                  face = next() % 6;
                } while (
                  face === lastFace ||
                  (lastFace >= 0 && face === opposite[lastFace] && face < lastFace)
                );
                moves.push(faces[face] + suffixes[next() % 3]);
                lastFace = face;
              }
              output.push(moves.join(' '));
            }
            return output;
          }

          const baseline = await load('/tmp/fmc-stage1-baseline');
          const current = await load(`${process.cwd()}/public/solver-wasm`);
          const algorithmCount = current.built.threeCycleAlgorithmCount ?? 0;
          if (algorithmCount < 50) {
            throw new Error(`three-cycle library unexpectedly small: ${algorithmCount}`);
          }
          if (current.buildMs > baseline.buildMs + 3000) {
            throw new Error(
              `three-cycle table build overhead too high: ${baseline.buildMs.toFixed(1)} -> ${current.buildMs.toFixed(1)} ms`
            );
          }

          const scrambles = makeScrambles(40);
          const options = JSON.stringify({ maxPremoveSets: 80, forceRzp: false });
          const oldTimes = [];
          const newTimes = [];
          let insertionCandidates = 0;
          let insertionCandidatesInTop10 = 0;
          let improvedBestCases = 0;
          let equalBestCases = 0;
          let cornerInsertions = 0;
          let edgeInsertions = 0;

          for (let index = 0; index < scrambles.length; index++) {
            const scramble = scrambles[index];
            let oldResult;
            let newResult;
            if (index % 2 === 0) {
              let start = performance.now();
              oldResult = JSON.parse(baseline.mod.solve_fmc_wasm(scramble, options));
              oldTimes.push(performance.now() - start);
              start = performance.now();
              newResult = JSON.parse(current.mod.solve_fmc_wasm(scramble, options));
              newTimes.push(performance.now() - start);
            } else {
              let start = performance.now();
              newResult = JSON.parse(current.mod.solve_fmc_wasm(scramble, options));
              newTimes.push(performance.now() - start);
              start = performance.now();
              oldResult = JSON.parse(baseline.mod.solve_fmc_wasm(scramble, options));
              oldTimes.push(performance.now() - start);
            }

            if (!oldResult.ok || !newResult.ok) {
              throw new Error(`FMC solve failed for case ${index}`);
            }
            if (newResult.moveCount > oldResult.moveCount) {
              throw new Error(
                `best solution regressed for case ${index}: ${oldResult.moveCount} -> ${newResult.moveCount}`
              );
            }
            if (newResult.moveCount < oldResult.moveCount) improvedBestCases++;
            else equalBestCases++;

            insertionCandidates += newResult.insertionCandidateCount ?? 0;
            for (const candidate of newResult.candidates) {
              const verified = JSON.parse(
                current.mod.verify_fmc_solution_wasm(scramble, candidate.solution)
              );
              if (!verified.ok || !verified.solved) {
                throw new Error(`invalid candidate for case ${index}: ${candidate.solution}`);
              }
              if (candidate.source.startsWith('FMC_INSERTION_')) {
                insertionCandidatesInTop10++;
                if (!Array.isArray(candidate.insertionMoves) || candidate.insertionMoves.length === 0) {
                  throw new Error('insertion candidate missing insertionMoves');
                }
                if (candidate.skeletonKind === 'corner3') cornerInsertions++;
                else if (candidate.skeletonKind === 'edge3') edgeInsertions++;
                else throw new Error(`invalid insertion skeleton kind: ${candidate.skeletonKind}`);
              }
            }
          }

          const average = values => values.reduce((sum, value) => sum + value, 0) / values.length;
          const oldAverage = average(oldTimes);
          const newAverage = average(newTimes);
          const runtimeRatio = newAverage / oldAverage;
          const report = {
            cases: scrambles.length,
            threeCycleAlgorithmCount: algorithmCount,
            baselineTableBuildMs: baseline.buildMs,
            insertionTableBuildMs: current.buildMs,
            baselineAverageMs: oldAverage,
            insertionAverageMs: newAverage,
            runtimeRatio,
            insertionCandidates,
            insertionCandidatesInTop10,
            improvedBestCases,
            equalBestCases,
            cornerInsertions,
            edgeInsertions,
          };
          console.log(JSON.stringify(report, null, 2));
          fs.writeFileSync('/tmp/fmc-three-cycle-report.json', JSON.stringify(report, null, 2));

          if (insertionCandidates === 0) {
            throw new Error('no skeleton was completed by the three-cycle library');
          }
          if (insertionCandidatesInTop10 === 0) {
            throw new Error('completed insertions never reached the returned candidate portfolio');
          }
          if (runtimeRatio > 1.35) {
            throw new Error(`FMC runtime overhead too high: ${runtimeRatio.toFixed(3)}x`);
          }
          NODE
          node /tmp/validate-fmc-three-cycle.mjs

      - name: Keep only production files and commit
        run: |
          rm -f .github/scripts/apply_fmc_three_cycle_insertion.py
          rm -f .github/scripts/apply_fmc_three_cycle_metrics.py
          rm -f .github/workflows/fmc-three-cycle-insertion.yml
          git checkout origin/main -- \
            public/solver-wasm/.gitignore \
            public/solver-wasm/package.json \
            public/solver-wasm/README.md \
            public/solver-wasm/solver_wasm.js \
            public/solver-wasm/solver_wasm.d.ts \
            public/solver-wasm/solver_wasm_bg.wasm.d.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete FMC three-cycle skeletons [fmc-insertion-built]"
          git push origin HEAD:agent/fmc-three-cycle-insertion
