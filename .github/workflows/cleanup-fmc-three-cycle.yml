name: Clean FMC three-cycle PR scope

on:
  push:
    branches:
      - agent/fmc-three-cycle-insertion

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[fmc-scope-clean]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fmc-three-cycle-insertion
          fetch-depth: 0

      - name: Restore unrelated files and remove temporary validation files
        run: |
          git fetch origin main
          git checkout origin/main -- \
            solver-wasm/src/minmove_builder.rs \
            solver-wasm/src/minmove_bundle.rs \
            solver-wasm/src/minmove_core.rs \
            solver-wasm/src/minmove_search.rs \
            solver-wasm/src/twophase_builder.rs \
            solver-wasm/src/twophase_bundle.rs
          rm -f .github/THREE_CYCLE_PR_READY.md
          rm -f .github/workflows/fmc-three-cycle-pr-validation.yml
          rm -f .github/workflows/cleanup-fmc-three-cycle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Limit FMC insertion change scope [fmc-scope-clean]"
          git push origin HEAD:agent/fmc-three-cycle-insertion
