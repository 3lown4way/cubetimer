name: Apply 4x4 worker hardening

on:
  push:
    branches:
      - agent/444-wasm-worker-boundary
    paths:
      - "tools/apply-444-worker-hardening.mjs"
      - ".github/workflows/apply-444-worker-hardening.yml"

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/444-wasm-worker-boundary

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply route hardening
        run: node tools/apply-444-worker-hardening.mjs

      - name: Validate syntax and contract
        run: |
          node --check solver/solverWorker.js
          node --check solver/solver444.js
          node tools/verify-444-worker-boundary.mjs

      - name: Remove one-time files
        run: |
          rm tools/apply-444-worker-hardening.mjs
          rm .github/workflows/apply-444-worker-hardening.yml

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver/solverWorker.js tools/apply-444-worker-hardening.mjs .github/workflows/apply-444-worker-hardening.yml
          git commit -m "Harden the 4x4 worker boundary"
          git push
