name: Apply 4x4 smooth playback

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-444-smooth-playback.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply smooth playback patch
        run: python tools/apply-444-smooth-playback.py

      - name: Verify syntax and playback contract
        run: |
          node --check solver/solver444UiActivation.js
          grep -q 'player.alg = solution;' solver/solver444UiActivation.js
          grep -q 'requestAnimationFrame(tickPlayback)' solver/solver444UiActivation.js
          if grep -q 'setInterval(() =>' solver/solver444UiActivation.js; then exit 1; fi
          git diff --check

      - name: Commit implementation
        run: |
          rm -f tools/apply-444-smooth-playback.py .github/workflows/apply-444-smooth-playback.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add solver/solver444UiActivation.js tools/apply-444-smooth-playback.py .github/workflows/apply-444-smooth-playback.yml
          git commit -m "Smooth 4x4 solver playback"
          git push origin HEAD:main
