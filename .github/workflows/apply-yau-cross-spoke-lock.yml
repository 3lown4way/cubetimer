name: Apply Yau cross-spoke lock

on:
  push:
    branches: [main]
    paths:
      - "tools/fix-yau-cross-spoke-lock.py"
      - ".github/workflows/apply-yau-cross-spoke-lock.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solver444-wasm
      - name: Apply cross-spoke lock patch
        run: python tools/fix-yau-cross-spoke-lock.py
      - name: Format and test Rust
        run: |
          cargo fmt --manifest-path solver444-wasm/Cargo.toml --all
          cargo test --manifest-path solver444-wasm/Cargo.toml --lib
          cargo clippy --manifest-path solver444-wasm/Cargo.toml --lib --tests -- -D warnings
      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --locked
          fi
      - name: Rebuild 4x4 browser WASM
        run: |
          rm -rf target/solver444-wasm-web
          wasm-pack build solver444-wasm --target web --out-dir ../target/solver444-wasm-web --out-name solver444_wasm --release
          cp target/solver444-wasm-web/solver444_wasm.js public/solver444-wasm/solver444_wasm.js
          cp target/solver444-wasm-web/solver444_wasm.d.ts public/solver444-wasm/solver444_wasm.d.ts
          cp target/solver444-wasm-web/solver444_wasm_bg.wasm public/solver444-wasm/solver444_wasm_bg.wasm
          cp target/solver444-wasm-web/solver444_wasm_bg.wasm.d.ts public/solver444-wasm/solver444_wasm_bg.wasm.d.ts
      - name: Validate Yau invariants
        run: |
          node --check tools/verify-444-yau.mjs
          node tools/verify-444-yau.mjs
          node tools/verify-444-edge-323.mjs
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver444-wasm/src/edges.rs solver444-wasm/src/centers.rs solver444-wasm/src/api.rs public/solver444-wasm tools/verify-444-yau.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Keep Yau cross spokes locked through centers"
          git push origin main
