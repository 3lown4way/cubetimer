name: Benchmark FMC Extreme fixed scramble

on:
  pull_request:
    branches:
      - agent/fmc-extreme-independent-frontier-v2
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  benchmark:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out FMC Extreme branch
        uses: actions/checkout@v4
        with:
          ref: agent/fmc-extreme-independent-frontier-v2
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run fixed-scramble benchmark
        shell: bash
        run: |
          cat > .tmp-fmc-benchmark.mjs <<'NODE'
          import fs from "node:fs";
          import { performance } from "node:perf_hooks";
          import { solveWithFMCSearch } from "./solver/fmcSolver.js";

          const scramble = "U R2 U' R B D R B' R' B2 U' F' D' R F' L' B L2 F R D";

          const summarize = (mode, result, elapsedMs, progress) => ({
            mode,
            elapsedMs: Math.round(elapsedMs),
            ok: result?.ok === true,
            reason: result?.reason ?? null,
            moveCount: Number.isFinite(result?.moveCount)
              ? result.moveCount
              : Number.isFinite(result?.bestHumanMoveCount)
                ? result.bestHumanMoveCount
                : null,
            solution: result?.solution || result?.bestHumanSolution || null,
            source: result?.source || null,
            qualityTarget: result?.qualityTarget ?? null,
            qualityTargetReached: result?.qualityTargetReached === true,
            stages: (result?.stages || result?.bestHumanStages || []).map((stage) => ({
              name: stage?.name || "",
              moveCount: Number.isFinite(stage?.moveCount) ? stage.moveCount : null,
              solution: stage?.solution || "",
              notes: stage?.notes || "",
              isSummary: stage?.isSummary === true,
            })),
            extremeIsolation: result?.performanceDiagnostics?.extremeIsolation ?? null,
            wasmStages: (result?.performanceDiagnostics?.wasmStages || []).map((stage) => ({
              name: stage.name,
              elapsedMs: stage.elapsedMs,
              ok: stage.ok,
              moveCount: stage.moveCount,
              candidateCount: stage.candidateCount,
              rawExplorationLimit: stage.rawExplorationLimit,
              finalBestImportedAsRawLimit: stage.finalBestImportedAsRawLimit,
              htr: stage.htr,
              sliceInsertion: stage.sliceInsertion,
              multiInsertion: stage.multiInsertion,
              multiSwitch: stage.multiSwitch,
              deepMultiSwitch: stage.deepMultiSwitch,
            })),
            candidateCounts: result?.performanceDiagnostics?.candidateCounts ?? null,
            phaseTimingsMs: result?.performanceDiagnostics?.phaseTimingsMs ?? null,
            topCandidates: result?.performanceDiagnostics?.topCandidates?.ranked ?? [],
            progressEvents: progress.length,
          });

          async function run(mode, options) {
            const progress = [];
            const started = performance.now();
            const result = await solveWithFMCSearch(
              scramble,
              (event) => progress.push(event),
              options,
            );
            return summarize(mode, result, performance.now() - started, progress);
          }

          const output = {
            scramble,
            node: process.version,
            generatedAt: new Date().toISOString(),
            results: [],
          };

          try {
            output.results.push(
              await run("sweetSpot", {
                qualityMode: "sweetSpot",
                targetMoveCount: 24,
                timeBudgetMs: 8000,
                maxPremoveSets: 40,
                continueBelowTarget: false,
              }),
            );
            output.results.push(
              await run("extreme", {
                qualityMode: "extreme",
                targetMoveCount: 20,
                timeBudgetMs: 30000,
                maxPremoveSets: 180,
                extremeVariantCount: 8,
                continueBelowTarget: true,
                insertionTimeMs: 6000,
                verifyLimit: 64,
              }),
            );
          } catch (error) {
            output.error = error instanceof Error
              ? { name: error.name, message: error.message, stack: error.stack }
              : String(error);
          }

          fs.writeFileSync("fmc-fixed-scramble-benchmark.json", JSON.stringify(output, null, 2));
          console.log("FMC_BENCHMARK_RESULT_START");
          console.log(JSON.stringify(output, null, 2));
          console.log("FMC_BENCHMARK_RESULT_END");
          if (output.error) process.exitCode = 1;
          NODE

          node .tmp-fmc-benchmark.mjs 2>&1 | tee fmc-fixed-scramble-benchmark.log
          rm -f .tmp-fmc-benchmark.mjs

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmc-fixed-scramble-benchmark
          path: |
            fmc-fixed-scramble-benchmark.json
            fmc-fixed-scramble-benchmark.log
          if-no-files-found: warn
