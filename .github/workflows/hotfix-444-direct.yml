name: Hotfix 4x4 WCA notation direct

on:
  push:
    branches:
      - agent/fix-444-wca-notation

permissions:
  contents: write

jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without marketplace actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD
      - name: Apply WCA notation boundary fix
        run: python tools/apply-444-wca-hotfix.py
      - name: Validate syntax and external 4x4 behavior
        run: |
          node --check solver/solver444.js
          node --check tools/verify-444-worker-boundary.mjs
          node tools/verify-444-worker-boundary.mjs
      - name: Commit verified hotfix
        run: |
          rm -f tools/apply-444-wca-hotfix.py
          rm -f .github/workflows/hotfix-444-wca-notation.yml
          rm -f .github/workflows/hotfix-444-direct.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix 4x4 WCA notation at the solver boundary"
          git push origin "${GITHUB_REF_NAME}"
