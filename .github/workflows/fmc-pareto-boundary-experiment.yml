name: FMC Pareto boundary experiment

on:
  pull_request:
    types: [opened]
    branches:
      - agent/fmc-extreme-independent-frontier-v2

permissions:
  contents: write

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out FMC branch
        uses: actions/checkout@v4
        with:
          ref: agent/fmc-extreme-independent-frontier-v2
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create development benchmark
        run: |
          cat > tools/.fmc-pareto-dev-bench.mjs <<'NODE'
          import fs from "node:fs";
          import { performance } from "node:perf_hooks";
          import { buildFmcTablesWasm, solveFmcWasm, verifyFmcSolutionWasm } from "../solver/wasmSolver.js";

          const corpus = JSON.parse(fs.readFileSync("tools/fmc-generalization-corpus.json", "utf8"));
          const selected = corpus.developmentCases.slice(0, 3);
          const profile = {
            maxPremoveSets: 24,
            searchLevel: 3,
            searchVariant: 7,
            incumbentMoveCount: 34,
            forceRzp: false,
            enableCoverageFallback: true,
            enableMultiSwitchNiss: true,
            enableDeepMultiSwitchNiss: true,
            enableHtrSkeletons: true,
            enableSliceInsertion: true,
            enableMultiInsertion: true,
            enableDrFlip: true,
          };
          if (!(await buildFmcTablesWasm())) throw new Error("FMC_TABLE_BUILD_FAILED");
          const rows = [];
          for (const testCase of selected) {
            const started = performance.now();
            const result = await solveFmcWasm(testCase.scramble, profile);
            const elapsedMs = Math.round(performance.now() - started);
            if (!result?.ok || !result.solution) throw new Error(`DEV_SOLVE_FAILED:${testCase.id}`);
            const verification = await verifyFmcSolutionWasm(testCase.scramble, result.solution);
            if (!verification?.ok || verification.solved !== true) throw new Error(`DEV_INVALID:${testCase.id}`);
            rows.push({ id: testCase.id, known: testCase.knownMoveCount, found: result.moveCount, elapsedMs, source: result.source });
          }
          const averageMoves = rows.reduce((sum, row) => sum + row.found, 0) / rows.length;
          const output = { averageMoves, rows };
          fs.writeFileSync(process.argv[2], JSON.stringify(output, null, 2));
          console.log(`PARETO_DEV ${JSON.stringify(output)}`);
          NODE

      - name: Capture baseline
        run: |
          node tools/benchmark-fmc-generalization.mjs --smoke --out /tmp/pareto-baseline-holdout.json
          node tools/.fmc-pareto-dev-bench.mjs /tmp/pareto-baseline-dev.json

      - name: Apply bounded Pareto boundary patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("solver-wasm/src/fmc_search.rs")
          text = path.read_text()

          old_constants = '''/// Stage-boundary NISS keeps one EO and one DR boundary per axis/side.
          const FMC_MULTI_NISS_BOUNDARY_EO_LIMIT: usize = 3;
          const FMC_MULTI_NISS_CONTINUATION_EO_LIMIT: usize = 2;
          const FMC_MULTI_NISS_CONTINUATION_P2_NODE_LIMIT: u64 = 500_000;
          const FMC_MULTI_NISS_RESULT_LIMIT_PER_AXIS: usize = 4;'''.replace('          ', '')
          new_constants = '''/// Stage-boundary NISS generates a wider EO/DR pool, then sends only a
          /// bounded state-diverse frontier into the expensive inverse continuation.
          const FMC_MULTI_NISS_BOUNDARY_EO_LIMIT: usize = 10;
          const FMC_MULTI_NISS_EO_FRONTIER_LIMIT: usize = 3;
          const FMC_MULTI_NISS_DR_FRONTIER_LIMIT: usize = 4;
          const FMC_MULTI_NISS_CONTINUATION_EO_LIMIT: usize = 2;
          const FMC_MULTI_NISS_CONTINUATION_P2_NODE_LIMIT: u64 = 500_000;
          const FMC_MULTI_NISS_DIVERSE_CONTINUATION_P2_NODE_LIMIT: u64 = 180_000;
          const FMC_MULTI_NISS_RESULT_LIMIT_PER_AXIS: usize = 8;'''.replace('          ', '')
          if old_constants not in text:
              raise SystemExit("constants anchor not found")
          text = text.replace(old_constants, new_constants, 1)

          old_struct = '''struct FmcNissBoundary {
              prefix_moves: Vec<u8>,
              eo_moves: Vec<u8>,
              dr_moves: Vec<u8>,
              /// 0 = EO→DR boundary, 1 = DR→P2 boundary.
              stage_tag: u8,
          }'''
          new_struct = '''struct FmcNissBoundary {
              prefix_moves: Vec<u8>,
              eo_moves: Vec<u8>,
              dr_moves: Vec<u8>,
              /// 0 = EO→DR boundary, 1 = DR→P2 boundary.
              stage_tag: u8,
              last_face: u8,
              state_bucket: u8,
              rzp_used: bool,
          }'''
          if old_struct not in text:
              raise SystemExit("boundary struct anchor not found")
          text = text.replace(old_struct, new_struct, 1)

          replacement = r'''fn niss_boundary_state_bucket(state: &CubeState) -> u8 {
              let mut hash = 0x811c9dc5u32;
              for value in fmc_state_key(state) {
                  hash ^= value as u32;
                  hash = hash.wrapping_mul(0x01000193);
              }
              (hash & 0x0f) as u8
          }

          fn select_diverse_niss_boundaries(
              mut candidates: Vec<FmcNissBoundary>,
              limit: usize,
          ) -> Vec<FmcNissBoundary> {
              candidates.sort_by_key(|candidate| {
                  (
                      candidate.prefix_moves.len(),
                      candidate.eo_moves.len(),
                      candidate.dr_moves.len(),
                      candidate.rzp_used,
                      candidate.last_face,
                      candidate.state_bucket,
                      candidate.prefix_moves.clone(),
                  )
              });
              let mut seen_moves = std::collections::HashSet::new();
              candidates.retain(|candidate| seen_moves.insert(candidate.prefix_moves.clone()));

              let mut selected = Vec::new();
              let mut selected_moves = std::collections::HashSet::new();
              let mut bucket_counts =
                  std::collections::HashMap::<(u8, u8, bool), usize>::new();

              for quota in 1..=2 {
                  for candidate in &candidates {
                      if selected.len() >= limit {
                          break;
                      }
                      if selected_moves.contains(&candidate.prefix_moves) {
                          continue;
                      }
                      let bucket = (
                          candidate.last_face,
                          candidate.state_bucket,
                          candidate.rzp_used,
                      );
                      let count = *bucket_counts.get(&bucket).unwrap_or(&0);
                      if count >= quota {
                          continue;
                      }
                      selected.push(candidate.clone());
                      selected_moves.insert(candidate.prefix_moves.clone());
                      bucket_counts.insert(bucket, count + 1);
                  }
              }

              if selected.len() < limit {
                  for candidate in candidates {
                      if selected.len() >= limit {
                          break;
                      }
                      if selected_moves.insert(candidate.prefix_moves.clone()) {
                          selected.push(candidate);
                      }
                  }
              }

              selected.sort_by_key(|candidate| {
                  (
                      candidate.prefix_moves.len(),
                      candidate.stage_tag,
                      candidate.eo_moves.len(),
                      candidate.dr_moves.len(),
                      candidate.prefix_moves.clone(),
                  )
              });
              selected
          }

          /// Collect a bounded Pareto-style set of legal switch points. The
          /// frontier keeps short paths, but also reserves room for different
          /// last faces, cube states, and RZP families so a locally longer EO or
          /// DR can survive when it enables a much shorter continuation.
          fn collect_multi_switch_niss_boundaries(
              state: &CubeState,
              tables: &TwophaseTables,
              fmc_tables: &FmcTables,
              max_eo_depth: u8,
              current_best: usize,
              force_rzp: bool,
              include_dr_boundaries: bool,
          ) -> Vec<FmcNissBoundary> {
              let eo_idx = encode_eo(&state.eo);
              let eo_sequences = find_eo_sequences(
                  eo_idx,
                  tables,
                  fmc_tables,
                  max_eo_depth,
                  FMC_MULTI_NISS_BOUNDARY_EO_LIMIT,
                  0,
              );
              let mut eo_boundaries = Vec::new();
              let mut dr_boundaries = Vec::new();

              for eo_moves in eo_sequences {
                  if eo_moves.is_empty() || eo_moves.len() >= current_best {
                      continue;
                  }
                  let state_after_eo = state.apply_moves(&eo_moves, &tables.move_data);
                  eo_boundaries.push(FmcNissBoundary {
                      prefix_moves: eo_moves.clone(),
                      eo_moves: eo_moves.clone(),
                      dr_moves: Vec::new(),
                      stage_tag: 0,
                      last_face: last_face_of_moves(&eo_moves, tables),
                      state_bucket: niss_boundary_state_bucket(&state_after_eo),
                      rzp_used: false,
                  });

                  let dr_cap = current_best
                      .saturating_sub(eo_moves.len())
                      .min(FMC_MAX_DR_DEPTH as usize) as u8;
                  if dr_cap == 0 {
                      continue;
                  }
                  let last_face_before_dr = last_face_of_moves(&eo_moves, tables);
                  let dr_routes = solve_dr_routes_via_rzp(
                      &state_after_eo,
                      fmc_tables,
                      tables,
                      dr_cap,
                      last_face_before_dr,
                      force_rzp,
                  );
                  for route in dr_routes.into_iter().take(FMC_DR_ROUTE_LIMIT) {
                      let mut prefix_moves = eo_moves.clone();
                      prefix_moves.extend_from_slice(&route.moves);
                      let prefix_moves = simplify_moves(&prefix_moves);
                      if prefix_moves.is_empty() || prefix_moves.len() >= current_best {
                          continue;
                      }
                      let state_after_dr = state.apply_moves(&prefix_moves, &tables.move_data);
                      dr_boundaries.push(FmcNissBoundary {
                          prefix_moves: prefix_moves.clone(),
                          eo_moves: eo_moves.clone(),
                          dr_moves: route.moves,
                          stage_tag: 1,
                          last_face: last_face_of_moves(&prefix_moves, tables),
                          state_bucket: niss_boundary_state_bucket(&state_after_dr),
                          rzp_used: route.rzp_setup_len > 0,
                      });
                  }
              }

              let mut output = select_diverse_niss_boundaries(
                  eo_boundaries,
                  FMC_MULTI_NISS_EO_FRONTIER_LIMIT,
              );
              if include_dr_boundaries {
                  output.extend(select_diverse_niss_boundaries(
                      dr_boundaries,
                      FMC_MULTI_NISS_DR_FRONTIER_LIMIT,
                  ));
              }
              output
          }

          /// Switch to the inverse side'''

          pattern = re.compile(
              r"fn retain_shorter_boundary\(.*?\n\}\n\n/// Switch to the inverse side",
              re.S,
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"boundary block replacement count={count}")

          text = text.replace(
              "for boundary in boundaries {",
              "for (boundary_index, boundary) in boundaries.into_iter().enumerate() {",
              1,
          )
          text = text.replace(
              "FMC_MULTI_NISS_CONTINUATION_EO_LIMIT,\n            FMC_MAX_DR_DEPTH,\n            FMC_MAX_P2_DEPTH,\n            FMC_MULTI_NISS_CONTINUATION_P2_NODE_LIMIT,",
              "if boundary_index < 2 {\n                FMC_MULTI_NISS_CONTINUATION_EO_LIMIT\n            } else {\n                1\n            },\n            FMC_MAX_DR_DEPTH,\n            FMC_MAX_P2_DEPTH,\n            if boundary_index < 2 {\n                FMC_MULTI_NISS_CONTINUATION_P2_NODE_LIMIT\n            } else {\n                FMC_MULTI_NISS_DIVERSE_CONTINUATION_P2_NODE_LIMIT\n            },",
              1,
          )
          text = text.replace(
              "rzp_used: continuation_rzp,",
              "rzp_used: boundary.rzp_used || continuation_rzp,",
              1,
          )

          if "retain_shorter_boundary" in text:
              raise SystemExit("legacy single-boundary selector remains")
          path.write_text(text)
          PY
          rustfmt solver-wasm/src/fmc_search.rs

      - name: Test Rust and rebuild WASM
        run: |
          cargo test --release --manifest-path solver-wasm/Cargo.toml
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --locked
          fi
          cd solver-wasm
          wasm-pack build --target web --out-dir ../public/solver-wasm

      - name: Run patched holdout and development benchmarks
        run: |
          node tools/benchmark-fmc-generalization.mjs --smoke --baseline /tmp/pareto-baseline-holdout.json --out /tmp/pareto-patched-holdout.json
          node tools/.fmc-pareto-dev-bench.mjs /tmp/pareto-patched-dev.json
          python3 - <<'PY'
          import json
          base = json.load(open('/tmp/pareto-baseline-dev.json'))
          patched = json.load(open('/tmp/pareto-patched-dev.json'))
          holdout = json.load(open('/tmp/pareto-patched-holdout.json'))
          rows = []
          improved = False
          for before, after in zip(base['rows'], patched['rows']):
              delta = after['found'] - before['found']
              rows.append({'id': before['id'], 'before': before['found'], 'after': after['found'], 'delta': delta})
              improved = improved or delta < 0
          print('PARETO_COMPARISON', json.dumps({'development': rows, 'holdoutGate': holdout['gate']}))
          if not holdout['gate']['passed']:
              raise SystemExit('holdout gate failed')
          if patched['averageMoves'] > base['averageMoves'] + 0.34:
              raise SystemExit('development average regressed')
          if not improved:
              raise SystemExit('no development case improved; do not retain experiment')
          PY

      - name: Commit retained experiment
        run: |
          rm -f tools/.fmc-pareto-dev-bench.mjs
          git add solver-wasm/src/fmc_search.rs public/solver-wasm/solver_wasm.js public/solver-wasm/solver_wasm_bg.wasm public/solver-wasm/solver_wasm_bg.wasm.d.ts public/solver-wasm/solver_wasm.d.ts
          git diff --cached --quiet && { echo "No retained changes"; exit 1; }
          git commit -m "Preserve diverse FMC NISS boundaries"
          git push origin HEAD:agent/fmc-extreme-independent-frontier-v2
