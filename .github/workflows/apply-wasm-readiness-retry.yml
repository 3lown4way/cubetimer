name: Apply WASM readiness retry

on:
  push:
    branches:
      - fix/fmc-premove-niss-root
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair applicator syntax
        run: node tools/fix-wasm-readiness-applicator-syntax.mjs
      - name: Apply loader repair
        run: node tools/apply-wasm-readiness-retry.mjs
      - name: Validate loader repair
        run: |
          node --check solver/wasmSolver.js
          node --check solver/fmcSolver.js
          node --check benchmark-wasm-readiness-contract.mjs
          node benchmark-wasm-readiness-contract.mjs
      - name: Commit loader repair
        run: |
          git add solver/wasmSolver.js solver/fmcSolver.js
          if git diff --cached --quiet; then
            echo "WASM readiness repair already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Retry transient WASM readiness failures"
          git push origin "HEAD:${TARGET_BRANCH}"
