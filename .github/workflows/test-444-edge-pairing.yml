name: Test 4x4 edge pairing

on:
  push:
    branches:
      - agent/444-edge-pairing
    paths:
      - "solver444-wasm/**"
      - ".github/workflows/test-444-edge-pairing.yml"

permissions:
  contents: write

jobs:
  edge-pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/444-edge-pairing
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format Rust
        run: cargo fmt --manifest-path solver444-wasm/Cargo.toml --all
      - name: Run 4x4 Rust tests
        run: cargo test --manifest-path solver444-wasm/Cargo.toml --lib -- --nocapture
      - name: Reject compiler warnings
        run: cargo clippy --manifest-path solver444-wasm/Cargo.toml --lib --tests -- -D warnings
      - name: Commit formatted source
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver444-wasm/src/edges.rs solver444-wasm/src/lib.rs
          git commit -m "Format the 4x4 edge pairing core"
          git push
