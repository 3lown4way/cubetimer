name: Test 4x4 edge pairing

on:
  push:
    branches:
      - agent/444-edge-pairing
    paths:
      - "solver444-wasm/**"
      - ".github/workflows/test-444-edge-pairing.yml"

permissions:
  contents: write

jobs:
  edge-pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/444-edge-pairing
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply validated edge corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("solver444-wasm/src/edges.rs")
          text = path.read_text()
          replacements = [
              (
                  "[8, 7, 10, 8, 8, 8, 9, 5]",
                  "[8, 7, 9, 8, 8, 8, 8, 5]",
              ),
              (
                  "#[derive(Clone, Debug)]\nstruct PairPhase {",
                  "#[cfg_attr(not(test), allow(dead_code))]\n#[derive(Clone, Debug)]\nstruct PairPhase {",
              ),
              (
                  "#[derive(Clone, Debug)]\nstruct LastPhase {",
                  "#[cfg_attr(not(test), allow(dead_code))]\n#[derive(Clone, Debug)]\nstruct LastPhase {",
              ),
              (
                  "    for position in 0..WING_COUNT {\n        let locked = EDGE_SLOTS\n            .iter()\n            .take(phase)\n            .any(|pair| pair.contains(&(position as u8)));\n        if !locked {\n            local_by_global[position] = remaining.len() as u8;\n            remaining.push(position as u8);\n        }\n    }",
                  "    for (position, local) in local_by_global.iter_mut().enumerate() {\n        let locked = EDGE_SLOTS\n            .iter()\n            .take(phase)\n            .any(|pair| pair.contains(&(position as u8)));\n        if !locked {\n            *local = remaining.len() as u8;\n            remaining.push(position as u8);\n        }\n    }",
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f"edge correction target missing: {old[:48]!r}")
          path.write_text(text)
          PY
      - name: Format Rust
        run: cargo fmt --manifest-path solver444-wasm/Cargo.toml --all
      - name: Run 4x4 Rust tests
        run: cargo test --manifest-path solver444-wasm/Cargo.toml --lib -- --nocapture
      - name: Reject compiler warnings
        run: cargo clippy --manifest-path solver444-wasm/Cargo.toml --lib --tests -- -D warnings
      - name: Commit validated source
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver444-wasm/src/edges.rs solver444-wasm/src/lib.rs
          git commit -m "Validate the 4x4 edge pairing core"
          git push
