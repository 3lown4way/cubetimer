name: Rebuild 4x4 browser WASM once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-444-wasm-once.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: solver444-wasm
      - name: Rebuild checked-in browser WASM
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --locked
          fi
          rm -rf public/solver444-wasm
          wasm-pack build solver444-wasm --target web --out-dir ../public/solver444-wasm --out-name solver444_wasm --release
          node tools/verify-444-worker-boundary.mjs
      - name: Commit synchronized WASM
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/solver444-wasm
          git commit -m "Synchronize 4x4 browser WASM"
          git push origin HEAD:main
