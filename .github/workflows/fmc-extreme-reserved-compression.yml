name: Apply reserved FMC Extreme compression stage

on:
  pull_request:
    branches:
      - agent/fmc-extreme-independent-frontier-v2
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: fmc-extreme-reserved-compression
  cancel-in-progress: false

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: agent/fmc-extreme-independent-frontier-v2
          fetch-depth: 0

      - name: Apply patch
        run: python3 tools/apply_fmc_reserved_compression.py

      - name: Validate JavaScript
        run: |
          node --check solver/fmcSolver.js
          git diff --check
          grep -q 'reservedCompressionVariant' solver/fmcSolver.js
          grep -q 'buildRoundRobinCandidateOrder' solver/fmcSolver.js
          grep -q 'extremeStageCandidateBuckets' solver/fmcSolver.js

      - name: Run fixed-scramble benchmark
        run: |
          cat > /tmp/fmc-reserved-benchmark.mjs <<'NODE'
          import { solveWithFMCSearch } from "${{ github.workspace }}/solver/fmcSolver.js";

          const scramble = "U R2 U' R B D R B' R' B2 U' F' D' R F' L' B L2 F R D";
          const result = await solveWithFMCSearch(scramble, null, {
            qualityMode: "extreme",
            targetMoveCount: 20,
            timeBudgetMs: 30000,
            maxPremoveSets: 180,
            extremeVariantCount: 8,
            extremeReservedCompressionPremoves: 48,
            continueBelowTarget: true,
            insertionTimeMs: 6000,
            verifyLimit: 64,
          });
          const diagnostics = result?.performanceDiagnostics || {};
          const summary = {
            ok: result?.ok === true,
            reason: result?.reason || null,
            moveCount: result?.moveCount ?? result?.bestHumanMoveCount ?? null,
            solution: result?.solution || result?.bestHumanSolution || null,
            isolation: diagnostics.extremeIsolation || null,
            stages: diagnostics.wasmStages || [],
            stageBuckets: diagnostics.extremeStageCandidateBuckets || [],
          };
          console.log(`RESERVED_BENCHMARK ${JSON.stringify(summary)}`);
          const reserved = summary.stages.find((stage) => stage.reservedCompression === true);
          if (!reserved) throw new Error("RESERVED_COMPRESSION_STAGE_NOT_EXECUTED");
          if (reserved.multiInsertion !== true) throw new Error("RESERVED_STAGE_MULTI_INSERTION_DISABLED");
          if (summary.isolation?.baselineCandidateImported !== false) throw new Error("BASELINE_IMPORTED");
          if (summary.isolation?.rawLimitIndependentFromFinalBest !== true) throw new Error("RAW_LIMIT_NOT_INDEPENDENT");
          NODE
          node /tmp/fmc-reserved-benchmark.mjs | tee /tmp/fmc-reserved-benchmark.log
          grep -q 'RESERVED_BENCHMARK' /tmp/fmc-reserved-benchmark.log

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/fmc-extreme-reserved-compression.yml
          git rm --ignore-unmatch tools/apply_fmc_reserved_compression.py
          git add solver/fmcSolver.js
          git commit -m "Reserve FMC Extreme compression search"
          git push origin HEAD:agent/fmc-extreme-independent-frontier-v2
