name: FMC quality preset validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'solver/fmcSolver.js'
      - 'solver/solverWorker.js'
      - 'tools/apply-fmc-quality-presets.py'
      - 'tools/verify-fmc-quality-presets.mjs'
      - '.github/workflows/fmc-quality-presets.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply quality presets
        run: python3 tools/apply-fmc-quality-presets.py

      - name: Check JavaScript syntax
        run: |
          node --check solver/fmcSolver.js
          node --check solver/solverWorker.js
          node --check tools/verify-fmc-quality-presets.mjs

      - name: Validate quality presets
        env:
          FMC_QUALITY_RUNS: '24'
        run: node tools/verify-fmc-quality-presets.mjs

      - name: Commit production implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver/fmcSolver.js solver/solverWorker.js
          git rm .github/workflows/fmc-quality-presets.yml tools/apply-fmc-quality-presets.py tools/verify-fmc-quality-presets.mjs
          git commit -m "Add FMC sweet-spot and extreme quality presets"
          git push origin HEAD:${{ github.head_ref }}
