name: Apply 4x4 center integration

on:
  push:
    branches:
      - agent/444-center-solver
    paths:
      - "tools/apply-444-center-integration.mjs"
      - ".github/workflows/apply-444-center-integration.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/444-center-solver
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply integration patches
        run: node tools/apply-444-center-integration.mjs
      - name: Format and test Rust
        run: |
          cargo fmt --manifest-path solver444-wasm/Cargo.toml --all
          cargo test --manifest-path solver444-wasm/Cargo.toml --lib
          cargo clippy --manifest-path solver444-wasm/Cargo.toml --lib --tests -- -D warnings
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Rebuild browser WASM package
        run: wasm-pack build solver444-wasm --target web --out-dir ../public/solver444-wasm --out-name solver444_wasm --release
      - name: Verify JavaScript and real WASM contract
        run: |
          node --check solver/solver444.js
          node --check solver/solverWorker.js
          node --check tools/verify-444-worker-boundary.mjs
          node tools/verify-444-worker-boundary.mjs
      - name: Remove one-time automation
        run: |
          rm tools/apply-444-center-integration.mjs
          rm .github/workflows/apply-444-center-integration.yml
      - name: Commit generated center solver integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver444-wasm solver/solver444.js solver/solverWorker.js public/solver444-wasm tools/verify-444-worker-boundary.mjs tools/apply-444-center-integration.mjs .github/workflows/apply-444-center-integration.yml
          git commit -m "Integrate the verified 4x4 center stage"
          git push
