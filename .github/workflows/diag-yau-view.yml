name: Diagnose Yau view

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diag-yau-view.yml"
      - "tools/diag-yau-view.mjs"

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        face: [R, F, B, L]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch candidate face
        env:
          FACE: ${{ matrix.face }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          face = os.environ['FACE']
          opp = {'R':'L','L':'R','F':'B','B':'F'}[face]
          p = Path('solver/solver444.js')
          s = p.read_text()
          pattern = r'''  const crossLeftCandidates = VIEW_ORIENTATIONS_444\.filter\(\n    \(entry\) => entry\.map\.[URFDLB] === normalizedCross && entry\.map\.[URFDLB] === opposite,\n  \);'''
          replacement = f'''  const crossLeftCandidates = VIEW_ORIENTATIONS_444.filter(\n    (entry) => entry.map.{face} === normalizedCross && entry.map.{opp} === opposite,\n  );'''
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'candidate anchor count={n}')
          p.write_text(s2)
          PY
      - name: Run diagnostic
        run: |
          echo "CANDIDATE=${{ matrix.face }}"
          node tools/diag-yau-view.mjs | grep -E 'Cross Edges 3/4|Remaining 4 Centers|Cross Edge 4/4|^ok'
