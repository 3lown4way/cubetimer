name: Apply exact inverse exclusion once

on:
  push:
    branches:
      - fix/no-literal-inverse-minmove-twophase
    paths:
      - ".github/workflows/apply-exact-inverse-exclusion-once.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/no-literal-inverse-minmove-twophase
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Apply inverse exclusion patches
        run: |
          python tools/apply-short-inverse-exemption.py
          python tools/fix-short-inverse-benchmark-markers.py
          python tools/fix-exact-patcher-cache-target.py
          python tools/apply-exact-inverse-exclusion.py
      - name: Format and test Rust
        working-directory: solver-wasm
        run: |
          cargo fmt
          cargo test --lib
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Rebuild browser WASM
        working-directory: solver-wasm
        run: wasm-pack build --release --target web --out-dir ../public/solver-wasm
      - name: Validate JavaScript and regressions
        run: |
          node --check solver/inverseSolutionPolicy.js
          node --check solver/minmoveExactV2.js
          node --check solver/solverWorker.js
          node --check benchmark-inverse-output-contract.mjs
          node benchmark-inverse-output-contract.mjs
          node benchmark-minmove-exact-v2.mjs
          node benchmark-twophase-nontrivial-reliability.mjs
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Exclude literal inverse paths from exact minmove search"
          git push origin HEAD:fix/no-literal-inverse-minmove-twophase
