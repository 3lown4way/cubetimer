name: Apply 4x4 WASM worker boundary

on:
  push:
    branches:
      - agent/444-wasm-worker-boundary
    paths:
      - "tools/apply-444-worker-boundary.mjs"
      - ".github/workflows/apply-444-worker-boundary.yml"

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/444-wasm-worker-boundary

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: solver444-wasm

      - name: Install wasm-pack
        shell: bash
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --locked
          fi

      - name: Patch worker
        run: node tools/apply-444-worker-boundary.mjs

      - name: Format and validate Rust
        run: |
          cargo fmt --manifest-path solver444-wasm/Cargo.toml --all
          cargo test --manifest-path solver444-wasm/Cargo.toml --lib
          cargo clippy --manifest-path solver444-wasm/Cargo.toml --lib --tests -- -D warnings

      - name: Build browser WASM package
        run: wasm-pack build solver444-wasm --target web --out-dir ../public/solver444-wasm --out-name solver444_wasm --release

      - name: Validate JavaScript and boundary contract
        run: |
          node --check solver/solver444.js
          node --check solver/solverWorker.js
          node --check tools/verify-444-worker-boundary.mjs
          node tools/verify-444-worker-boundary.mjs

      - name: Remove one-time files
        run: |
          rm tools/apply-444-worker-boundary.mjs
          rm .github/workflows/apply-444-worker-boundary.yml

      - name: Commit generated boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver/solverWorker.js solver444-wasm Cargo.lock 2>/dev/null || true
          git add solver444-wasm/Cargo.lock
          git add -f public/solver444-wasm
          git add tools/apply-444-worker-boundary.mjs .github/workflows/apply-444-worker-boundary.yml
          git commit -m "Connect the 4x4 WASM worker boundary"
          git push
