name: FMC NISS final diagnostics fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Restrict HTR diagnostics to HTR source tags
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('solver-wasm/src/lib.rs')
          text = path.read_text()
          replacements = {
              'result.candidates.iter().filter(|candidate| candidate.source_tag >= 4).count()':
                  'result.candidates.iter().filter(|candidate| (4..=7).contains(&candidate.source_tag)).count()',
              'result.skeletons.iter().filter(|skeleton| skeleton.source_tag >= 4).count()':
                  'result.skeletons.iter().filter(|skeleton| (4..=7).contains(&skeleton.source_tag)).count()',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one diagnostic expression, found {count}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --manifest-path solver-wasm/Cargo.toml

      - name: Run Rust release tests
        run: cargo test --manifest-path solver-wasm/Cargo.toml --release

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Rebuild release WASM
        working-directory: solver-wasm
        run: wasm-pack build --target web --release --out-dir ../public/solver-wasm

      - name: Restore generated ignore files
        run: git restore --source=HEAD -- .gitignore public/solver-wasm/.gitignore 2>/dev/null || true

      - name: Verify diagnostics separation
        run: |
          node --input-type=module <<'JS'
          import { buildFmcTablesWasm, solveFmcWasm, verifyFmcSolutionWasm } from './solver/wasmSolver.js';
          if (!(await buildFmcTablesWasm())) throw new Error('FMC_TABLE_BUILD_FAILED');
          const scramble = "D R B2 D2 R D F R F' R' D' R2 D' F U B2 L U' B2 L2 D'";
          const result = await solveFmcWasm(scramble, {
            maxPremoveSets: 40,
            enableMultiSwitchNiss: true,
            enableDeepMultiSwitchNiss: false,
            enableHtrSkeletons: false,
            enableMultiInsertion: false,
            enableSliceInsertion: false,
          });
          if (!result?.ok) throw new Error('FMC_SOLVE_FAILED');
          if (!(Number(result.multiSwitchNissCandidateCount) > 0)) {
            throw new Error(`NO_MULTI_SWITCH_CANDIDATES:${result.multiSwitchNissCandidateCount}`);
          }
          if (Number(result.htrCandidateCount) !== 0 || Number(result.htrSkeletonCount) !== 0) {
            throw new Error(`HTR_DIAGNOSTIC_CONTAMINATION:${result.htrCandidateCount}:${result.htrSkeletonCount}`);
          }
          const verification = await verifyFmcSolutionWasm(scramble, result.solution);
          if (!verification?.ok || verification.solved !== true) throw new Error('INVALID_SOLUTION');
          console.log(JSON.stringify({
            moveCount: result.moveCount,
            multiSwitchNissCandidateCount: result.multiSwitchNissCandidateCount,
            htrCandidateCount: result.htrCandidateCount,
            htrSkeletonCount: result.htrSkeletonCount,
          }, null, 2));
          JS

      - name: Commit production fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fmc-niss-final-fix.yml
          git add solver-wasm/src/lib.rs public/solver-wasm/solver_wasm_bg.wasm
          git add public/solver-wasm/solver_wasm.js public/solver-wasm/solver_wasm.d.ts public/solver-wasm/solver_wasm_bg.wasm.d.ts public/solver-wasm/package.json 2>/dev/null || true
          git commit -m "Keep FMC HTR diagnostics source-specific"
          git push origin HEAD:${{ github.head_ref }}
