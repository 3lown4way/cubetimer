name: Apply Yau 3-2-3 cross lock

on:
  push:
    branches: [main]
    paths:
      - "tools/apply-yau-safe-wide-macros-v2.py"
      - ".github/workflows/apply-yau-323-cross-lock.yml"

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply safe-wide Yau patch
        run: python tools/apply-yau-safe-wide-macros-v2.py
      - name: Verify syntax
        run: |
          node --check solver/solver444.js
          node --check solver/edgePairing444.js
          node --check tools/verify-444-yau.mjs
          git diff --check
      - name: Verify Yau cross never splits
        run: |
          node tools/verify-444-yau.mjs
          node tools/verify-444-edge-323.mjs
          node tools/verify-444-public-notation.mjs
