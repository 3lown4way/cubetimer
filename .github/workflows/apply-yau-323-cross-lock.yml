name: Apply Yau 3-2-3 cross lock

on:
  push:
    branches: [main]
    paths:
      - "tools/apply-yau-cross-bank-minimal.py"
      - ".github/workflows/apply-yau-323-cross-lock.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal protected-bank fix
        run: python tools/apply-yau-cross-bank-minimal.py
      - name: Verify syntax
        run: |
          node --check solver/solver444.js
          node --check tools/verify-444-yau.mjs
          git diff --check
      - name: Diagnose and verify Yau protected bank
        run: node tools/verify-444-yau.mjs
