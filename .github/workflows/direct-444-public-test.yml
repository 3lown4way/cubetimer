name: Direct 4x4 public notation validation

on:
  push:
    branches:
      - fix/444-public-move-notation
    paths:
      - ".github/workflows/direct-444-public-test.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone branch without marketplace actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch fix/444-public-move-notation \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
      - name: Verify public Centers and full solution
        working-directory: repo
        run: |
          node --check solver/solver444.js
          node --check tools/verify-444-public-notation.mjs
          node tools/verify-444-worker-boundary.mjs
          node tools/verify-444-public-notation.mjs
