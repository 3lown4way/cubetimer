name: Temporary verify CFOP full color neutral

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-cfop-cn-temp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check solver/cfop3x3.js
          node --check benchmark-color-neutral-contract.mjs
      - name: Verify permanent color-neutral contract
        run: node benchmark-color-neutral-contract.mjs
      - name: Record successful verification
        shell: bash
        run: |
          printf '{"ok":true,"contract":"benchmark-color-neutral-contract.mjs"}\n' > tools/cn-contract-verified-temp.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/cn-contract-verified-temp.json
          git commit -m "Verify CFOP color-neutral regression contract"
          git push
