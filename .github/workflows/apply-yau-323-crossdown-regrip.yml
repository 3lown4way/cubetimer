name: Apply Yau 3-2-3 cross-down regrip

on:
  push:
    branches: [main]
    paths:
      - "tools/apply-yau-323-crossdown-regrip.py"
      - "tools/adjust-yau-regrip-rotation-cap.py"
      - "tools/lock-yau-cross4-right-grip.py"
      - ".github/workflows/apply-yau-323-crossdown-regrip.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply grip-boundary patch
        run: |
          python tools/apply-yau-323-crossdown-regrip.py
          python tools/lock-yau-cross4-right-grip.py
          python tools/adjust-yau-regrip-rotation-cap.py
      - name: Syntax check
        run: |
          node --check solver/solver444.js
          node --check tools/verify-444-yau.mjs
          git diff --check
      - name: Verify 4x4 contracts
        run: |
          node tools/verify-444-yau.mjs
          node tools/verify-444-edge-323.mjs
          node tools/verify-444-public-notation.mjs
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solver/solver444.js tools/verify-444-yau.mjs
          git commit -m "Regrip cross down before Yau 3-2-3"
          git push origin HEAD:main
