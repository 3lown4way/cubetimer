name: Trigger final 4x4 bootstrap check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trigger-444-final-bootstrap-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --check solver/solver444UiActivation.js
          node tools/verify-444-ui-worker-bootstrap.mjs
          node tools/verify-nxn-solver-preview.mjs
          node tools/verify-444-worker-boundary.mjs
          node tools/verify-444-yau.mjs
