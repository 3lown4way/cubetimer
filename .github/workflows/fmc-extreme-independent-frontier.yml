name: Apply FMC Extreme isolation patch

on:
  push:
    branches:
      - agent/fmc-extreme-independent-frontier
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fmc-extreme-independent-frontier
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Patch FMC Extreme isolation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              path.write_text(text.replace(old, new, 1))

          js = Path("solver/fmcSolver.js")
          replace_once(
              js,
              '''      const searchLevel = variant === 0 ? 0 : variant < 3 ? 1 : variant < 7 ? 2 : 3;
              const premoveCap =
                searchLevel === 0 ? 40 : searchLevel === 1 ? 90 : searchLevel === 2 ? 140 : requestedPremoveSets;
              stages.push(
                stage(`human-L${searchLevel}-V${variant}`, {
                  maxPremoveSets: capPremoves(premoveCap),
                  searchLevel,
                  searchVariant: variant,
                  enableMultiSwitchNiss: searchLevel >= 1,
                  enableDeepMultiSwitchNiss: searchLevel >= 2,
                  enableHtrSkeletons: searchLevel >= 2,
                  enableSliceInsertion: searchLevel >= 2,
                  enableMultiInsertion: searchLevel >= 3,
                }),
              );
          ''',
              '''      // Extreme never enters the baseline-equivalent L0 profile. It starts from
              // an independent broad frontier and expands its raw-path ceiling by level.
              const searchLevel = variant < 2 ? 1 : variant < 7 ? 2 : 3;
              const premoveCap =
                searchLevel === 1 ? 90 : searchLevel === 2 ? 140 : requestedPremoveSets;
              const rawExplorationLimit = searchLevel === 1 ? 28 : searchLevel === 2 ? 31 : 34;
              stages.push(
                stage(`human-L${searchLevel}-V${variant}`, {
                  maxPremoveSets: capPremoves(premoveCap),
                  searchLevel,
                  searchVariant: variant,
                  rawExplorationLimit,
                  enableMultiSwitchNiss: true,
                  enableDeepMultiSwitchNiss: searchLevel >= 2,
                  enableHtrSkeletons: searchLevel >= 2,
                  enableSliceInsertion: searchLevel >= 2,
                  enableMultiInsertion: searchLevel >= 3,
                }),
              );
          ''',
              "extreme stage profile",
          )

          replace_once(
              js,
              '''        const stageOptions = {
                  ...qualityStage.options,
                  incumbentMoveCount: Number.isFinite(bestMoveCount)
                    ? Math.max(1, bestMoveCount - (bestMoveCount <= targetMoveCount ? 1 : 0))
                    : 40,
                };
          ''',
              '''        const rawExplorationLimit =
                  qualityMode === "extreme"
                    ? Number.isFinite(qualityStage.options.rawExplorationLimit)
                      ? Math.max(24, Math.min(40, Math.floor(qualityStage.options.rawExplorationLimit)))
                      : 32
                    : Number.isFinite(bestMoveCount)
                      ? Math.max(1, bestMoveCount - (bestMoveCount <= targetMoveCount ? 1 : 0))
                      : 40;
                const { rawExplorationLimit: _rawExplorationLimit, ...wasmQualityOptions } = qualityStage.options;
                const stageOptions = {
                  ...wasmQualityOptions,
                  // The Rust API keeps this legacy field name for compatibility, but in
                  // Extreme it is a fixed raw-path ceiling, never the current final best.
                  incumbentMoveCount: rawExplorationLimit,
                };
          ''',
              "independent raw limit",
          )

          replace_once(
              js,
              '''    wasmStages: [],
                sweepBudgetMs,
                searchProfiles: {
          ''',
              '''    wasmStages: [],
                sweepBudgetMs,
                extremeIsolation:
                  qualityMode === "extreme"
                    ? {
                        baselineCandidateImported: false,
                        baselineCacheReused: false,
                        rawLimitIndependentFromFinalBest: true,
                      }
                    : null,
                searchProfiles: {
          ''',
              "extreme diagnostics root",
          )

          replace_once(
              js,
              '''          multiInsertion: stageOptions.enableMultiInsertion === true,
                });
          ''',
              '''          multiInsertion: stageOptions.enableMultiInsertion === true,
                  rawExplorationLimit: stageOptions.incumbentMoveCount,
                  finalBestImportedAsRawLimit: qualityMode !== "extreme",
                });
          ''',
              "stage diagnostics",
          )

          rust = Path("solver-wasm/src/fmc_search.rs")
          text = rust.read_text()

          old = '''            if simplified.len() < *current_best {
                      *current_best = simplified.len();
                  }

                  let skeleton_prefixes = collect_axis_skeleton_prefixes(
          '''
          new = '''            // `current_best` is the raw exploration ceiling. A completed
                  // candidate must not tighten it, because a longer raw skeleton can still
                  // compress below the current final best through insertion/cancellation.
                  let skeleton_prefixes = collect_axis_skeleton_prefixes(
          '''
          if text.count(old) != 1:
              raise SystemExit(f"direct incumbent tightening: expected 1 match, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''                    if !htr_simplified.is_empty() && htr_simplified.len() <= *current_best {
                              if htr_simplified.len() < *current_best {
                                  *current_best = htr_simplified.len();
                              }
                              let htr_prefixes = collect_axis_skeleton_prefixes(
          '''
          new = '''                    if !htr_simplified.is_empty() && htr_simplified.len() <= *current_best {
                              // Keep the raw ceiling fixed after finding an HTR completion too.
                              let htr_prefixes = collect_axis_skeleton_prefixes(
          '''
          if text.count(old) != 1:
              raise SystemExit(f"HTR incumbent tightening: expected 1 match, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''    let mut best_count = incumbent_move_count.clamp(1, 40);
          '''
          new = '''    // This is deliberately independent from the best completed solution.
              // Extreme may retain 28-34 move raw skeletons even after finding a 20-21 move result.
              let mut raw_exploration_limit = incumbent_move_count.clamp(1, 40);
          '''
          if text.count(old) != 1:
              raise SystemExit(f"raw ceiling declaration: expected 1 match, found {text.count(old)}")
          text = text.replace(old, new, 1)

          best_ref_count = text.count("&mut best_count")
          if best_ref_count < 1:
              raise SystemExit("raw ceiling references: no &mut best_count references found")
          text = text.replace("&mut best_count", "&mut raw_exploration_limit")
          rust.write_text(text)

          js_text = js.read_text()
          rust_text = rust.read_text()
          assert "variant === 0 ? 0" not in js_text
          assert "baselineCandidateImported: false" in js_text
          assert "rawLimitIndependentFromFinalBest: true" in js_text
          assert "*current_best = simplified.len()" not in rust_text
          assert "*current_best = htr_simplified.len()" not in rust_text
          assert "let mut raw_exploration_limit" in rust_text
          PY

      - name: Check JavaScript syntax
        run: node --check solver/fmcSolver.js

      - name: Format Rust
        run: cargo fmt --manifest-path solver-wasm/Cargo.toml

      - name: Test Rust solver
        run: cargo test --manifest-path solver-wasm/Cargo.toml

      - name: Rebuild solver WASM
        run: |
          cd solver-wasm
          wasm-pack build --target web --out-dir ../public/solver-wasm

      - name: Validate patch and diff
        shell: bash
        run: |
          node --check solver/fmcSolver.js
          cargo test --manifest-path solver-wasm/Cargo.toml
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          js = Path('solver/fmcSolver.js').read_text()
          rust = Path('solver-wasm/src/fmc_search.rs').read_text()
          assert 'human-L0-' not in js
          assert 'baselineCandidateImported: false' in js
          assert 'rawLimitIndependentFromFinalBest: true' in js
          assert '*current_best = simplified.len()' not in rust
          assert '*current_best = htr_simplified.len()' not in rust
          PY

      - name: Commit generated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fmc-extreme-independent-frontier.yml
          git add -A
          git commit -m "Separate FMC Extreme raw frontier from final best"
          git push origin HEAD:agent/fmc-extreme-independent-frontier
