name: F2L compact kernel

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-and-benchmark:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/f2l-compact-kernel'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Validate helper scripts
        run: |
          python -m py_compile tools/apply-f2l-compact-kernel.py
          node --check tools/benchmark-f2l-compact-kernel.mjs
          node --check tools/compare-f2l-compact-kernel.mjs

      - name: Capture baseline and apply compact kernel
        if: ${{ !contains(hashFiles('solver/cfop3x3.js'), '') }}
        shell: bash
        run: |
          if grep -q 'F2L_COMPACT_KERNEL_VERSION = 2' solver/cfop3x3.js; then
            echo 'already_applied=true' >> "$GITHUB_ENV"
            exit 0
          fi
          echo 'already_applied=false' >> "$GITHUB_ENV"
          mkdir -p /tmp/f2l-baseline
          tar --exclude=.git -cf - . | tar -xf - -C /tmp/f2l-baseline
          (cd /tmp/f2l-baseline && node tools/benchmark-f2l-compact-kernel.mjs > /tmp/f2l-baseline.json)
          python tools/apply-f2l-compact-kernel.py

      - name: Syntax and correctness checks
        run: |
          node --check solver/cfop3x3.js
          node benchmark-solver-versions.mjs
          node benchmark-cfop-10.mjs

      - name: Compare focused F2L benchmark
        if: env.already_applied == 'false'
        run: |
          node tools/benchmark-f2l-compact-kernel.mjs > /tmp/f2l-optimized.json
          node tools/compare-f2l-compact-kernel.mjs /tmp/f2l-baseline.json /tmp/f2l-optimized.json

      - name: Commit optimized solver
        if: env.already_applied == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add solver/cfop3x3.js
          git commit -m 'Optimize compact F2L search kernel'
          git push origin HEAD:${{ github.head_ref }}
